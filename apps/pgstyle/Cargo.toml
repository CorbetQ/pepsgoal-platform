[package]
name = "pgstyle"
version = "0.1.0"
edition = "2021"
description = "PG-Net : IA maison PepsGoal Style (photo → fond PepsGoal, ciel retiré sur demande), optimisée pour 2 vCPU"
license = "MIT"

[dependencies]
tract-onnx = "0.21"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
kamadak-exif = "0.5"
anyhow = "1"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"

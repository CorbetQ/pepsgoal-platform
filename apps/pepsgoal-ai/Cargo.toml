[workspace]
resolver = "2"
members = ["crates/imaging", "crates/style", "crates/engine", "crates/cli"]

[workspace.package]
edition = "2021"
license = "MIT"
version = "0.1.0"

[workspace.dependencies]
anyhow = "1"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
kamadak-exif = "0.5"
tract-onnx = "0.21"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
imaging = { path = "crates/imaging" }
style = { path = "crates/style" }
engine = { path = "crates/engine" }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"

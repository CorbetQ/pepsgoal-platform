/* ---- modération : onglet Serveur ---- */
.srv-health .card-h h2,.srv-h2{display:flex;align-items:center;gap:8px}
.srv-health .card-h h2 svg{width:20px;height:20px}
.srv-ok .dot{width:8px;height:8px;border-radius:50%;background:var(--ok);display:inline-block;margin-right:6px;box-shadow:0 0 0 0 var(--ok)}
.stat small{display:block;font-size:11.5px;color:var(--ink-3);margin-top:2px}
.meter{margin:10px 0 2px}
.meter-h{display:flex;justify-content:space-between;font-size:12.5px;font-weight:700;color:var(--ink-2);margin-bottom:4px}
.meter .bar{display:block}
.meter .bar>i{transition:width .6s ease}
.meter.hot .bar>i{background:var(--danger)}
.sbars{display:flex;align-items:flex-end;gap:3px;height:70px;margin-top:8px}
.sbars i{flex:1;min-width:2px;height:max(3px,calc(var(--h) * 100%));border-radius:4px 4px 2px 2px;background:linear-gradient(to top,var(--flame),var(--flame-2));opacity:.9;transform-origin:bottom}
.sbars-min{height:44px;gap:1px}
.sbars-min i{border-radius:2px}
.spark-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px}
.spark-card{padding:12px;border-radius:16px;background:color-mix(in srgb,var(--ink) 4%,transparent)}
.spark-h{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.srv-foot{text-align:center;margin:-4px 0 14px}

/* ---- messagerie : réponses, réactions, mentions ---- */
.msg{position:relative}
.msg-act{position:absolute;top:50%;width:30px;height:30px;margin-top:-15px;border-radius:50%;border:0;display:grid;place-items:center;background:var(--glass-strong);color:var(--ink-2);box-shadow:var(--shadow);opacity:0;cursor:pointer;transition:opacity .15s,transform .15s}
.msg-act svg{width:16px;height:16px}
.msg.me .msg-act{left:-36px}
.msg.them .msg-act{right:-36px}
.msg:hover .msg-act,.msg-act:focus-visible,.msg-act[aria-expanded="true"]{opacity:1}
@media (hover:none){.msg-act{opacity:.55}}
.rx-row{display:flex;flex-wrap:wrap;gap:4px;margin-top:-2px;max-width:78%}
.rx-row.me{align-self:flex-end;justify-content:flex-end}
.rx-row.them{align-self:flex-start}
.rx{display:inline-flex;align-items:center;gap:3px;padding:2px 8px;border-radius:999px;border:1px solid var(--line);background:var(--glass-strong);font-size:13px;cursor:pointer;color:var(--ink)}
.rx b{font-size:11.5px;font-weight:800}
.rx.on{border-color:var(--flame);background:color-mix(in srgb,var(--flame) 16%,var(--glass-strong))}
.msg-menu{display:flex;flex-wrap:wrap;align-items:center;gap:4px;padding:6px;border-radius:18px;background:var(--glass-strong);border:1px solid var(--glass-edge);box-shadow:var(--shadow);max-width:min(100%,360px)}
.msg-menu.me{align-self:flex-end}
.msg-menu.them{align-self:flex-start}
.rx-btn{width:36px;height:36px;border-radius:50%;border:0;background:none;font-size:20px;line-height:1;cursor:pointer;display:grid;place-items:center;color:var(--ink-2)}
.rx-btn:hover,.rx-btn:focus-visible{background:color-mix(in srgb,var(--ink) 8%,transparent)}
.rx-btn.on{background:color-mix(in srgb,var(--flame) 20%,transparent)}
.rx-btn svg{width:18px;height:18px}
.rx-more{display:flex;flex-wrap:wrap;gap:2px;width:100%}
.msg-quote{display:flex;flex-direction:column;align-items:flex-start;gap:1px;width:100%;margin:0 0 6px;padding:5px 9px;border:0;border-left:3px solid currentColor;border-radius:8px;background:color-mix(in srgb,currentColor 12%,transparent);color:inherit;text-align:left;font-size:12.5px;cursor:pointer}
.msg-quote b{font-size:11.5px}
.msg-quote span{opacity:.85;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.mention{font-weight:800;color:var(--t-proj-ink)}
.msg.me .mention{color:inherit;text-decoration:underline;text-underline-offset:2px}
.mention.me{background:color-mix(in srgb,var(--flame) 22%,transparent);border-radius:6px;padding:0 3px}
.msg.mentioned{box-shadow:0 0 0 2px var(--flame)}
.mrow.flash .msg{animation:msgFlash 1.4s ease}
@keyframes msgFlash{0%,40%{box-shadow:0 0 0 4px color-mix(in srgb,var(--flame) 70%,transparent)}}
.reply-bar{display:flex;align-items:center;gap:10px;padding:8px 10px;margin-bottom:8px;border-radius:14px;background:color-mix(in srgb,var(--ink) 6%,transparent);border-left:3px solid var(--flame)}
.reply-bar>svg{width:18px;height:18px;flex:none;color:var(--flame)}
.reply-bar span{flex:1;min-width:0;display:flex;flex-direction:column}
.reply-bar small{color:var(--ink-3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mention-pop{display:flex;flex-direction:column;gap:2px;padding:6px;margin-bottom:8px;border-radius:16px;background:var(--glass-strong);border:1px solid var(--glass-edge);box-shadow:var(--shadow);max-height:220px;overflow-y:auto}
.mention-opt{display:flex;align-items:center;gap:10px;padding:6px 8px;border:0;border-radius:12px;background:none;color:var(--ink);text-align:left;cursor:pointer}
.mention-opt:hover,.mention-opt:focus-visible{background:color-mix(in srgb,var(--ink) 8%,transparent)}
.mention-opt span{display:flex;flex-direction:column}
.mention-opt small{color:var(--ink-3)}

/* ---- notes de version ---- */
.notes details{border:1px solid var(--line);border-radius:18px;padding:12px 14px;margin-bottom:10px;background:color-mix(in srgb,var(--ink) 3%,transparent)}
.notes summary{cursor:pointer;display:flex;align-items:center;gap:10px;font-weight:800;list-style:none}
.notes summary::-webkit-details-marker{display:none}
.notes summary .v{font-family:var(--font-display);font-size:16px}
.notes summary small{color:var(--ink-3);font-weight:600;margin-left:auto}
.notes ul{margin:10px 0 2px 2px;padding-left:18px;display:flex;flex-direction:column;gap:6px;font-size:14px;line-height:1.45}
.notes .tag-new{font-size:11px;font-weight:800;padding:2px 8px;border-radius:999px;background:var(--flame);color:var(--on-accent)}

/* ---- anneau de niveau autour de l'icône de profil ---- */
.lv-ring{position:relative;isolation:isolate;border-radius:50%}
.lv-ring::before{content:"";position:absolute;inset:-6px;border-radius:50%;z-index:-1;pointer-events:none}
.lv-fx{position:absolute;inset:-10px;border-radius:50%;pointer-events:none;z-index:-1}
.lv1::before{background:radial-gradient(closest-side,color-mix(in srgb,var(--flame-2) 70%,transparent),transparent);opacity:.6}
.lv2::before{background:radial-gradient(closest-side,var(--flame),transparent 90%);opacity:.75}
.lv3::before,.lv4::before,.lv5::before,.lv6::before{background:conic-gradient(var(--flame-2),var(--flame),var(--pink),var(--flame-2));-webkit-mask:radial-gradient(closest-side,transparent calc(100% - 4px),#000 calc(100% - 3px));mask:radial-gradient(closest-side,transparent calc(100% - 4px),#000 calc(100% - 3px))}
.lv6::before{background:conic-gradient(#FF4A12,#FFB000,#B6FF2E,#22D3FF,#A98BFF,#FF3D96,#FF4A12)}
.lv4 .lv-fx,.lv5 .lv-fx,.lv6 .lv-fx{box-shadow:0 0 22px 2px color-mix(in srgb,var(--flame) 55%,transparent)}
.lv6 .lv-fx{box-shadow:0 0 28px 4px color-mix(in srgb,var(--pink) 55%,transparent),0 0 12px 1px color-mix(in srgb,var(--flame-2) 70%,transparent)}
.lv5 .lv-fx::before,.lv5 .lv-fx::after,.lv6 .lv-fx::before,.lv6 .lv-fx::after{content:"";position:absolute;left:50%;top:-3px;width:7px;height:7px;margin-left:-3.5px;border-radius:50%;background:var(--flame-2);box-shadow:0 0 8px 2px var(--flame-2);transform-origin:3.5px calc(50% + 3px)}
.lv5 .lv-fx::after,.lv6 .lv-fx::after{background:var(--pink);box-shadow:0 0 8px 2px var(--pink);transform:rotate(180deg)}
.lv-ring.sm::before{inset:-3px}
.lv-ring.sm .lv-fx{display:none}
@keyframes lvBreath{50%{transform:scale(1.12);opacity:.95}}
@keyframes lvSpin{to{transform:rotate(360deg)}}
@keyframes lvFlicker{0%,100%{opacity:.75}45%{opacity:1}55%{opacity:.6}}
@keyframes lvOrbit{to{transform:rotate(360deg)}}
@keyframes lvOrbit2{from{transform:rotate(180deg)}to{transform:rotate(540deg)}}

/* ---- micro-animations (désactivées avec « Désactiver les animations » ou le réglage système) ---- */
@media (prefers-reduced-motion:no-preference){
  .logo.morph .egg i{animation:eggFlip .7s cubic-bezier(.2,.9,.3,1.3) both;animation-delay:calc(var(--k) * 90ms)}
  .logo.morph{position:relative;overflow:hidden}
  .logo.morph::after{content:"";position:absolute;top:0;bottom:0;left:0;width:35%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.75),transparent);animation:eggGlint 1.1s .35s ease-out both;pointer-events:none}
  .logo.egg-gold .egg i,.logo.egg-cold .egg i{animation:eggShimmer 4s linear infinite}
  .logo.morph.egg-gold .egg i,.logo.morph.egg-cold .egg i{animation:eggFlip .7s cubic-bezier(.2,.9,.3,1.3) both,eggShimmer 4s linear .8s infinite;animation-delay:calc(var(--k) * 90ms),.8s}
  .snow i{animation:snowFall var(--d) linear var(--delay) infinite}
  .bg-aurora i:nth-child(1){animation:drift1 26s ease-in-out infinite}
  .bg-aurora i:nth-child(2){animation:drift2 32s ease-in-out infinite}
  .bg-aurora i:nth-child(3){animation:drift1 38s ease-in-out infinite reverse}
  .bg-waves g{animation:waveX var(--w,22s) linear infinite}
  .bg-waves g:nth-of-type(2){--w:30s;animation-direction:reverse}
  .bg-waves g:nth-of-type(3){--w:16s}
  .bg-stars i:nth-child(2){animation:twinkle 5s ease-in-out infinite}
  .bg-grid{animation:gridPan 40s linear infinite}
  .lv1::before,.lv2::before{animation:lvBreath 3.2s ease-in-out infinite}
  .lv3::before{animation:lvSpin 7s linear infinite}
  .lv4::before{animation:lvSpin 4.5s linear infinite}
  .lv4 .lv-fx{animation:lvFlicker 1.9s ease-in-out infinite}
  .lv5::before{animation:lvSpin 3s linear infinite}
  .lv6::before{animation:lvSpin 2.2s linear infinite}
  .lv5 .lv-fx::before,.lv6 .lv-fx::before{animation:lvOrbit 2.8s linear infinite}
  .lv5 .lv-fx::after,.lv6 .lv-fx::after{animation:lvOrbit2 3.6s linear infinite}
  .lv6 .lv-fx{animation:lvFlicker 1.4s ease-in-out infinite}
  .srv-ok .dot{animation:pulseDot 2s ease-out infinite}
  .main.enter .sbars i{animation:sparkUp .6s cubic-bezier(.2,.9,.3,1.2) both;animation-delay:calc(var(--n,0) * 25ms)}
  /* Boutons : léger enfoncement au toucher */
  .btn,.icon-btn,.fchip,.mini-btn,.cheer,.rx,.rx-btn,.pal-sw,.tab,.nav-a,.chip[data-act]{transition:transform .14s cubic-bezier(.3,1.5,.5,1),background-color .2s,box-shadow .2s,color .2s}
  .btn:active,.icon-btn:active,.fchip:active,.mini-btn:active,.cheer:active,.rx:active,.tab:active,.nav-a:active{transform:scale(.94)}
  .btn-primary:hover{box-shadow:0 8px 22px -8px color-mix(in srgb,var(--flame) 70%,transparent)}
  /* Cartes : elles se soulèvent au survol */
  @media (hover:hover){
    .gcard,.post,.sugg,.spark-card,.bg-tile .bt-prev{transition:transform .22s cubic-bezier(.2,.9,.3,1.2),box-shadow .22s}
    .gcard:hover,.sugg:hover{transform:translateY(-3px)}
    .bg-tile:hover .bt-prev{transform:translateY(-2px) scale(1.03)}
    .fab:hover svg{transform:rotate(90deg)}
    .logo:hover svg{animation:flick .9s ease-in-out}
    #bell:hover svg{animation:wiggle .6s ease}
    .msg-act:hover{transform:scale(1.1)}
  }
  .fab svg{transition:transform .3s cubic-bezier(.3,1.5,.5,1)}
  /* Onglet actif : l'icône rebondit */
  .fchip.pop[aria-pressed="true"]{animation:chipPop .3s cubic-bezier(.3,1.6,.5,1)}
  /* Interrupteurs à ressort */
  .switch span::after{transition:transform .32s cubic-bezier(.3,1.6,.5,1),width .2s}
  .switch input:active+span::after{width:27px}
  /* Pastilles, badges et réactions qui apparaissent */
  .rx{animation:popIn .35s cubic-bezier(.3,1.6,.5,1)}
  .fav-btn.on.pop svg{animation:favPop .45s cubic-bezier(.3,1.6,.5,1)}
  .msg-menu{animation:menuIn .22s cubic-bezier(.2,.9,.3,1.2) both}
  .msg-menu .rx-btn{animation:popIn .3s cubic-bezier(.3,1.6,.5,1) both;animation-delay:calc(var(--i,0) * 30ms)}
  .rx-btn:hover{transform:scale(1.25) translateY(-2px)}
  .mrow.new .msg{animation:msgIn .28s cubic-bezier(.2,.9,.3,1.2) both}
  .reply-bar,.mention-pop,.e2e-info:not([hidden]){animation:menuIn .22s ease both}
  .sugg{animation:fadeUp .4s ease both;animation-delay:calc(var(--i,0) * 60ms)}
  .notes details[open] ul{animation:fadeUp .3s ease}
  .bar>i{transition:width .7s cubic-bezier(.2,.9,.3,1)}
  input:focus-visible,textarea:focus-visible,select:focus-visible{transition:box-shadow .2s,border-color .2s}
  .toast{animation:toastIn .35s cubic-bezier(.2,.9,.3,1.25) both}
  .person{transition:background-color .2s}
  .tasks li:not(.dragging){transition:transform .2s}
}
@keyframes waveX{to{transform:translateX(-1440px)}}
@keyframes twinkle{50%{opacity:.25}}
@keyframes gridPan{to{background-position:44px 44px,44px 44px}}
@keyframes pulseDot{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--ok) 60%,transparent)}100%{box-shadow:0 0 0 8px transparent}}
@keyframes sparkUp{from{transform:scaleY(0)}}
@keyframes tabBounce{0%{transform:scale(.7) translateY(3px)}60%{transform:scale(1.15) translateY(-2px)}100%{transform:none}}
@keyframes chipPop{50%{transform:scale(1.08)}}
@keyframes favPop{0%{transform:scale(.4) rotate(-40deg)}70%{transform:scale(1.35) rotate(12deg)}100%{transform:none}}
@keyframes menuIn{from{opacity:0;transform:translateY(6px) scale(.96)}}
@keyframes msgIn{from{opacity:0;transform:translateY(10px) scale(.96)}}
@keyframes toastIn{from{opacity:0;transform:translateY(14px) scale(.94)}}

/* ===================== 2.1.0 ===================== */
/* ---- icône de profil : anneau centré quel que soit le conteneur ---- */
.lv-ring{display:inline-grid;place-items:center;flex:none;line-height:0;vertical-align:middle}
.me-mini>.lv-ring{align-self:center}

/* ---- navigation : fond de sélection qui glisse d'un onglet à l'autre ---- */
.tabbar,.side{isolation:isolate}
.nav-ind{position:absolute;top:0;left:0;width:0;height:0;border-radius:18px;background:var(--ink);z-index:0;pointer-events:none;opacity:0;box-shadow:0 6px 18px -8px rgba(0,0,0,.45);transition:transform .45s cubic-bezier(.3,1.25,.5,1),width .45s cubic-bezier(.3,1.25,.5,1),height .45s,opacity .2s}
.side .nav-ind{border-radius:14px}
.tab,.nav-a{position:relative;z-index:1;transition:color .3s ease}
.tab[aria-current="page"],.nav-a[aria-current="page"]{background:transparent!important;color:var(--bg)}
.nav-a[aria-current="page"]:hover{background:transparent!important}
:root[data-a11y-motion="off"] .nav-ind{transition:none}
@media (prefers-reduced-motion:reduce){.nav-ind{transition:none}}

/* ---- objectif Période ---- */
.t-period{--c:var(--t-period);--c-ink:var(--t-period-ink)}
.daychips.mdays{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.daychips.mdays label span{min-width:0;width:100%}
.pd-times{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.pd-times input{width:100%}
.pd-live{color:var(--ok);font-weight:800}
.pd-live::before{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--ok);margin-right:6px;vertical-align:1px;animation:recPulse 1.6s ease-in-out infinite}
.pd-next{list-style:none;display:flex;flex-direction:column;gap:6px;margin-bottom:16px}
.pd-next li{display:flex;justify-content:space-between;gap:10px;padding:9px 12px;border-radius:12px;background:color-mix(in srgb,var(--t-period) 14%,transparent);font-size:14px}
.pd-next span{font-weight:800;color:var(--t-period-ink);font-variant-numeric:tabular-nums}

/* ---- partage ---- */
.share-quote{margin:0 0 4px;padding:12px 14px;border-left:3px solid var(--flame);border-radius:12px;background:color-mix(in srgb,var(--ink) 5%,transparent);font-weight:600}
.share-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:14px}
.share-opt{display:flex;flex-direction:column;align-items:flex-start;gap:4px;padding:14px;border-radius:18px;border:1px solid var(--line);background:color-mix(in srgb,var(--ink) 4%,transparent);color:var(--ink);text-align:left;cursor:pointer;transition:transform .15s,border-color .2s,background-color .2s}
.share-opt:hover:not(:disabled){border-color:var(--flame);background:color-mix(in srgb,var(--flame) 10%,transparent)}
.share-opt:disabled{opacity:.5;cursor:not-allowed}
.share-opt small{color:var(--ink-3);font-size:12px;line-height:1.35}
.so-ic{display:grid;place-items:center;width:38px;height:38px;border-radius:12px;margin-bottom:4px;color:var(--on-accent);background:linear-gradient(135deg,var(--flame-2),var(--flame) 60%,var(--pink))}
.so-ic svg{width:20px;height:20px}
.so-story .so-ic{background:linear-gradient(135deg,#FFB3C7,#FF5C8A)}
.so-msg .so-ic{background:linear-gradient(135deg,#8AF0FF,#3DB2FF)}
.so-ext .so-ic{background:linear-gradient(135deg,#E6FFB3,#56C596)}
.share-targets,.wx-results{list-style:none;display:flex;flex-direction:column;gap:4px;max-height:46vh;overflow-y:auto;margin:0 0 6px}
.share-tg{display:flex;align-items:center;gap:12px;width:100%;padding:8px 10px;border:0;border-radius:14px;background:none;color:var(--ink);text-align:left;cursor:pointer}
.share-tg:hover,.share-tg:focus-visible{background:color-mix(in srgb,var(--ink) 7%,transparent)}
.share-tg>span:not(.grp-av):not(.av){flex:1;min-width:0;display:flex;flex-direction:column}
.share-tg small{color:var(--ink-3)}
.share-tg>svg{width:18px;height:18px;color:var(--ink-3);flex:none}

/* ---- carte météo ---- */
.wx-card .card-h h2{display:flex;align-items:center;gap:6px}
.wx-card .card-h h2 svg{width:18px;height:18px}
.wx-now{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.wx-ico{font-size:52px;line-height:1;filter:drop-shadow(0 6px 12px rgba(0,0,0,.18))}
.wx-main{display:flex;flex-direction:column;flex:1;min-width:140px}
.wx-t{font-family:var(--font-display);font-size:40px;line-height:1;letter-spacing:-.03em}
.wx-main span{color:var(--ink-2);font-weight:600;font-size:14px;margin-top:4px}
.wx-side{list-style:none;display:flex;flex-direction:column;gap:4px;font-size:13px;font-weight:700;color:var(--ink-2)}
.wx-side li{display:flex;align-items:center;gap:6px}
.wx-side svg{width:15px;height:15px}
.wx-tip{margin:12px 0;padding:10px 12px;border-radius:14px;background:color-mix(in srgb,var(--flame) 12%,transparent);font-weight:600;font-size:14px}
.wx-days{list-style:none;display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.wx-days li{display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 4px;border-radius:14px;background:color-mix(in srgb,var(--ink) 5%,transparent);font-weight:800;font-size:13px}
.wx-days small{margin-left:4px;color:var(--ink-3);font-weight:700}
.wx-di{font-size:24px;line-height:1.2}
.wx-foot{margin-top:10px}

/* ---- thème OLED : noir pur, panneaux sombres et nets ---- */
:root[data-skin="oled"]{--bg:#000;--glass:rgba(12,12,16,.78);--glass-strong:#0B0B0F;--glass-card:#0C0C10;--glass-edge:rgba(255,255,255,.1);--line:rgba(255,255,255,.12);--scrim:rgba(0,0,0,.78);--blob-op:.18;--shadow:0 14px 40px -18px rgba(0,0,0,.9)}
:root[data-skin="oled"] body{background:#000}

/* ---- thème Météo : ciel en direct et verre givré ---- */
:root[data-bg="sky"] .bg-sky{display:block}
/* Verre givré : panneaux plus translucides et plus flous, liseré lumineux */
:root[data-skin="weather"]{--glass:rgba(255,255,255,.4);--glass-strong:rgba(255,255,255,.8);--glass-card:rgba(255,255,255,.5);--glass-edge:rgba(255,255,255,.75)}
:root[data-skin="weather"][data-theme="dark"]{--glass:rgba(18,22,48,.42);--glass-strong:rgba(22,26,56,.86);--glass-card:rgba(18,22,48,.55);--glass-edge:rgba(255,255,255,.22)}
:root[data-skin="weather"] .glass{-webkit-backdrop-filter:blur(26px) saturate(185%) brightness(1.04);backdrop-filter:blur(26px) saturate(185%) brightness(1.04);box-shadow:inset 0 1px 0 rgba(255,255,255,.5),var(--shadow)}
:root[data-skin="weather"][data-theme="dark"] .glass{box-shadow:inset 0 1px 0 rgba(255,255,255,.14),var(--shadow)}
.bg-tiles.off{opacity:.45;pointer-events:none;filter:grayscale(.6)}
.seg.wrap{flex-wrap:wrap}
@media (prefers-reduced-motion:no-preference){
}

/* ===================== 2.1.1 ===================== */
canvas.bg-sky{width:100%;height:100%}
/* Flou du verre givré : faible, moyen (par défaut) ou fort */
:root{--gb:14px}
:root[data-blur="low"]{--gb:6px}
:root[data-blur="high"]{--gb:28px}
.glass{-webkit-backdrop-filter:blur(var(--gb)) saturate(160%);backdrop-filter:blur(var(--gb)) saturate(160%)}

const emojiKey = g => [...g].map(c => c.codePointAt(0).toString(16)).filter(c => c !== 'fe0f').join('-');
function emojify(root){
  if (!EMOJI || !root) return;
  const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, { acceptNode: n => EMOJI_RE.test(n.data) && !n.parentElement?.closest(EMOJI_SKIP) ? NodeFilter.FILTER_ACCEPT : NodeFilter.FILTER_REJECT });

      let key = EMOJI_RE.test(g) && !(g.codePointAt(0) < 0x2190 && !g.includes('\uFE0F') && !g.includes('\u20E3')) ? emojiKey(g) : null;

      frag.append(img); changed = true;
    }

    if (buf) frag.append(buf);
    n.replaceWith(frag);
  }

  const once = (key, fn) => { const k = `${u.id}|${t}|${key}`; if (!DB.reminderLog[k]) { DB.reminderLog[k] = 1; fn(); fired = true; } };
  const s = u.settings;
  if (s.morning.on && hm >= s.morning.time && plan.due.length) once('morning', () => {
    const text = `Rappel du jour : ${pl(plan.due.length, 'validation prévue', 'validations prévues')}. ${st.n ? `Ta série de ${pl(st.n, 'jour', 'jours')} t'attend.` : 'Allume ta flamme !'}`;
    notify(u.id, text, { type:'reminder', view:'today' }); toast(text, 'bell');
  });
  if (s.evening.on && hm >= s.evening.time && pending) once('evening', () => {
    const text = `Il te reste ${pl(pending, 'validation', 'validations')} avant minuit${st.n && !st.lit ? ` pour garder ta série de ${pl(st.n, 'jour', 'jours')}` : ''}.`;
    notify(u.id, text, { type:'reminder', view:'today' }); toast(text, 'bell');
  });
  if (wdIdx(new Date()) === 6 && hm >= '18:00') once('recap' + ymd(weekStart(new Date())), () => {
    notify(u.id, 'Ton récap de la semaine est prêt : retrouve-le sur l\u2019accueil.', { type:'badge' }); toast('Ton récap de la semaine est prêt !', 'star');
  });
  for (const x of plan.due) if (x.g.type === 'period' && !x.done && hm >= x.g.start && hm <= addHM(x.g.start, 15)) once('pd' + x.g.id, () => {
    const text = `C’est l’heure : « ${x.g.title} » (${x.g.start}–${x.g.end}).`; notify(u.id, text, { type:'period', view:'today' }); toast(text, 'clock');
  });
  for (const x of plan.ongoing) if (x.g.type === 'deadline') {
    const n = daysUntil(x.g.due);
    if (n === 0 || n === 1) once('dl' + x.g.id, () => notify(u.id, `Deadline « ${x.g.title} » : ${n === 0 ? "c'est aujourd'hui" : "c'est demain"}.`, { type:'deadline', goalId:x.g.id }));
  }
  evaluateGoals(u, once);
  if (fired) save();
  queueBadgeCheck();
}

/* ================= actions métier ================= */
function addCheck(g, kind, value, pts, date = today(), userId = me()?.id || g.userId){
  const c = { id:uid(), goalId:g.id, userId, date, kind, value, pts, at:Date.now() };
  if (g.buddy && g.buddyVerify && userId === g.userId && ['done','progress','measure'].includes(kind)) { c.pending = true; c.ptsPending = pts; c.pts = 0; }
  DB.checkins.push(c);
  if (c.pending) requestVerify(g, c);
  return c;
}
function afterValidation(g, pts, wasLit){
  celebrate(pts);
  const u = me(), st = globalStreak(u.id);
  if (!wasLit) toast(st.n > 1 ? `Flamme allumée : ${pl(st.n, 'jour', 'jours')} de série !` : 'Flamme allumée ! Ta série commence.', 'flame');
  const n = goalStreak(g);
  if (MILESTONES.includes(n) && !g.milestones.includes(n) && ['routine','abstinence','limit','duration','timed','period'].includes(g.type)) {
    g.milestones.push(n);
    const unit = statBig(g).l;
    notify(u.id, `Palier débloqué : ${n} ${unit} pour « ${g.title} ».`, { type:'badge', goalId:g.id });
    autoPost(u, g, `${n} ${unit} pour « ${g.title} ». La flamme tient bon.`);
  }
  u.milestones = u.milestones || [];
  if ([3,7,14,30,60,100,365].includes(st.n) && !u.milestones.includes(st.n + '@' + today())) {
    u.milestones.push(st.n + '@' + today());
    notify(u.id, `Série de ${st.n} jours ! Tu gagnes un nouveau palier de flamme.`, { type:'badge' });
  }
  queueBadgeCheck();
}
function validate(id){
  const g = goalById(id), u = me(); if (!g || !isMember(g, u.id)) return;
  if (EXT[g.type]) return EXT[g.type].validate(g);
  const t = today(), wasLit = globalStreak(u.id).lit;
  if (g.type === 'routine' || g.type === 'abstinence') {
    const ex = DB.checkins.find(c => c.goalId === id && c.date === t && c.kind === 'done');
    if (ex) { DB.checkins.splice(DB.checkins.indexOf(ex), 1); save(); render(); toast('Validation annulée.', 'x'); return; }
    if (g.type === 'routine' && g.mode === 'days' && !g.days.includes(wdIdx(new Date()))) { toast("Cette routine n'est pas prévue aujourd'hui.", 'cal'); return; }
    addCheck(g, 'done', 1, TYPES[g.type].pts);
    UI.justDone = id;
    save(); render(); afterValidation(g, TYPES[g.type].pts, wasLit); save();
    checkPerfect();
  } else if (g.type === 'deadline') {
    if (g.completedAt) return;
    const pts = TYPES.deadline.pts + (t <= g.due ? 20 : 0);
    g.completedAt = Date.now(); addCheck(g, 'done', 1, pts);
    autoPost(u, g, `Deadline bouclée : « ${g.title} »${t <= g.due ? ', dans les temps' : ''}.`);
    save(); render(); afterValidation(g, pts, wasLit); save();
  } else {
    UI.modal = { type:'progress', id }; renderModal();
  }
}
// Publication automatique d'un palier : seulement si les fonctions sociales sont actives et l'objectif non privé
function autoPost(u, g, text){
  if (!socialOn(u) || g.visibility === 'private' || isBanned(u) || maintBlocks(u)) return;
  const p = { id:uid(), userId:u.id, text, visibility:g.visibility, goalId:g.id, kind:'milestone', at:Date.now(), likes:[], comments:[] };
  if (u.warned) p.status = 'pending';
  DB.posts.push(p); if (!p.status) demoReactions(p);
}
// Enregistre un encouragement reçu ; tous les FREEZE_EVERY encouragements reçus, l'auteur gagne un gel
function receiveCheer(author, postId, fromId){
  const key = postId + ':' + fromId;
  if (!author || author.id === fromId || author.cheersIn.includes(key)) return;
  author.cheersIn.push(key);
  if (author.cheersIn.length % FREEZE_EVERY === 0) {
    author.freezes++;
    notify(author.id, `Tu as reçu ${FREEZE_EVERY} encouragements de plus : un gel de série t'est offert !`, { type:'freeze' });
    if (me()?.id === author.id) setTimeout(() => toast('Nouveau gel de série gagné !', 'snow'), 60);
  }
}
// Les profils démo réagissent aux publications pour que l'on puisse tester les encouragements reçus
function demoReactions(p){
  DB.users.filter(x => x.demo && x.id !== p.userId && canSeePost(p, x.id)).forEach((x, i) => {
    if (Math.random() > .75) return;
    setTimeout(() => {
      const post = DB.posts.find(q => q.id === p.id), a = userById(p.userId);
      if (!post || post.likes.includes(x.id) || !a) return;
      post.likes.push(x.id);
      notify(a.id, `${x.name} a encouragé ta publication.`, { type:'like', view:'feed' });
      receiveCheer(a, post.id, x.id); save();
      const typing = ['INPUT','TEXTAREA','SELECT'].includes(document.activeElement?.tagName);
      if (!UI.modal && !typing) render();
    }, 2500 + i * 1800 + Math.random() * 1500);
  });
}
function addProgress(id, value){
  const g = goalById(id), u = me();
  if (EXT[g.type]?.progress) return EXT[g.type].progress(g, value);
  const wasLit = globalStreak(u.id).lit;
  let pts = TYPES[g.type].pts;
  addCheck(g, 'progress', value, pts);
  if (g.type === 'monthly') {
    const k = curMonth(); g.monthsDone = g.monthsDone || [];
    if (!g.monthsDone.includes(k) && monthProgress(g, k) >= g.target) {
      g.monthsDone.push(k); pts += MONTH_BONUS;
      bumpPts(DB.checkins[DB.checkins.length - 1], pts);
      notify(u.id, `Objectif de ${monthName(k)} atteint : « ${g.title} » ! +${MONTH_BONUS} flammes bonus.`, { type:'badge', goalId:g.id });
      autoPost(u, g, `Objectif de ${monthName(k)} atteint : ${g.target} ${g.unit || ''} pour « ${g.title} ».`.replace(/\s+/g, ' '));
    }
  } else if (!g.completedAt && objProgress(g) >= g.target) {
    g.completedAt = Date.now(); pts += 100;
    bumpPts(DB.checkins[DB.checkins.length - 1], pts);
    notify(u.id, `Objectif atteint : « ${g.title} » ! +100 flammes bonus.`, { type:'badge', goalId:g.id });
    autoPost(u, g, `Objectif atteint : ${g.target} ${g.unit || ''} pour « ${g.title} ».`);
  }
  UI.modal = null; save(); render(); afterValidation(g, pts, wasLit); save();
}
function relapse(id){
  const g = goalById(id);
  DB.checkins = DB.checkins.filter(c => !(c.goalId === id && c.date === today() && c.kind === 'done'));
  addCheck(g, 'relapse', 0, 0);
  g.milestones = [];
  UI.modal = { type:'goal', id }; save(); render();
  toast("Compteur remis à zéro. Un écart n'efface pas le chemin parcouru : tu repars dès demain.", 'repeat');
}
function sendRequest(to){
  const u = me(); if (friendship(u.id, to)) return;
  if (isBlockedPair(u.id, to)) { toast('Impossible d’ajouter ce compte.', 'ban'); return; }
  if (socialBlocked("d'envoyer des demandes d'amis")) return;

}

/* ================= types avancés ================= */
// Chaque type avancé déclare son comportement ici : plan du jour, ligne, fiche, formulaire, validation.
const isWin = c => c.kind !== 'relapse' && c.kind !== 'use';
const isMember = (g, id) => g.userId === id || (g.members || []).includes(id);
const myGoals = id => DB.goals.filter(g => isMember(g, id));
const sumKind = (g, kind, pred = () => true, who) => DB.checkins.filter(c => c.goalId === g.id && c.kind === kind && (!who || c.userId === who) && pred(c)).reduce((s, c) => s + Number(c.value || 0), 0);
const fmtClock = sec => { sec = Math.max(0, Math.round(sec)); const h = Math.floor(sec / 3600), m = Math.floor(sec % 3600 / 60), s = sec % 60; return h ? `${h}:${pad(m)}:${pad(s)}` : `${m}:${pad(s)}`; };
const nowHM = () => `${pad(new Date().getHours())}:${pad(new Date().getMinutes())}`;
const yday = () => ymd(addDays(new Date(), -1));
const round1 = n => Math.round(n * 10) / 10;
const daysLabel = days => days.length === 7 ? 'tous les jours' : days.join() === '0,1,2,3,4' ? 'en semaine' : days.join() === '5,6' ? 'le week-end' : days.slice().sort().map(i => WD_SHORT[i]).join(', ');
const endText = d => { const n = daysUntil(d); return n < 0 ? 'terminé' : n === 0 ? "se termine aujourd'hui" : `encore ${pl(n, 'jour', 'jours')}`; };
function untilTxt(hm){
  const [h, m] = hm.split(':').map(Number), now = new Date(), t = new Date(); t.setHours(h, m, 0, 0);
  const mins = Math.max(0, Math.round((t - now) / 60000));
  return mins >= 60 ? `${Math.floor(mins / 60)} h ${pad(mins % 60)}` : `${mins} min`;
}
// Jours consécutifs réussis ; le jour « en attente » ne casse pas la série
function dayStreak(g, isOk, isSched = () => true, pendKey = today(), from = new Date()){
  const start = ymd(g.createdAt); let d = new Date(from), n = 0;
  for (let i = 0; i < 800; i++) {
    const k = ymd(d); if (k < start) break;
    if (isSched(d)) { if (isOk(k)) n++; else if (k !== pendKey) break; }
    d = addDays(d, -1);
  }
  return n;
}
const todayDone = (g, date = today()) => DB.checkins.find(c => c.goalId === g.id && c.date === date && c.kind === 'done' && c.userId === me().id);
function undoDone(g, ex){ DB.checkins.splice(DB.checkins.indexOf(ex), 1); save(); render(); toast('Validation annulée.', 'x'); }
function winDone(g, pts, date){
  const u = me(), wasLit = globalStreak(u.id).lit;
  addCheck(g, 'done', 1, pts, date); UI.justDone = g.id;
  save(); render(); afterValidation(g, pts, wasLit); save(); checkPerfect();
}
function openProgress(g){ UI.modal = { type:'progress', id:g.id }; renderModal(); }
function bumpPts(c, pts){ if (c.pending) c.ptsPending = pts; else c.pts = pts; }
function softRender(){
  const typing = ['INPUT','TEXTAREA','SELECT'].includes(document.activeElement?.tagName);
  if (!typing && (!UI.modal || UI.modal.type === 'goal')) render(); else updateBell();
}
function avStack(ids){ return `<span class="avstack" aria-hidden="true">${ids.map(userById).filter(Boolean).slice(0, 4).map(u => avatar(u, 22)).join('')}</span>`; }
const rowBar = pct => `<span class="bar" style="margin-top:4px"><i style="width:${Math.max(0, Math.min(100, pct))}%"></i></span>`;
function pendingTag(g){
  const c = DB.checkins.find(c => c.goalId === g.id && c.pending && c.userId === me().id);
  return c ? `<span class="chip pend">${icon('clock')}En attente de ${esc(first(userById(g.buddy)?.name || ''))}</span>` : '';
}
function rowShell(x, metaHtml, right, opt = {}){

    <div class="row-acts">${right}</div></li>`;
}
function checkBtn(x, label, disabled){

}
const validateBtn = (g, done, label) => `<button class="btn ${done ? '' : 'btn-primary'}" data-act="validate" data-id="${g.id}">${icon('check')}${done ? 'Annuler la validation' : label}</button>`;
const h3 = t => `<h3 class="h2" style="font-size:14px;margin-bottom:8px">${t}</h3>`;
const unitOf = g => g.unit ? ' ' + esc(g.unit) : '';
const friendPicker = (name, type, checked) => {

// Célébration plein écran générique (fin de défi, de projet, victoire…)
function celebrateGoal(g, title, text){
  if (!g || !isMember(g, me()?.id)) return;
  setTimeout(() => fsCelebrate({ eyebrow:TYPES[g.type].label, title, text, icons:[g.icon], stats:[], share:`${title} ${g.icon} « ${g.title} » sur PepsGoal.` }), 600);

function finishWith(g, pts, msg, post){

const EXT = {
  /* ---------- Limite : ne pas dépasser X ---------- */
  limit: {
    used(g){ const t = today(); return g.period === 'week' ? sumKind(g, 'use', c => c.date >= ymd(weekStart(new Date())) && c.date <= t) : sumKind(g, 'use', c => c.date === t); },
    meta: g => `${g.max} ${g.unit} max par ${g.period === 'week' ? 'semaine' : 'jour'}`,
    streak: g => dayStreak(g, k => hasCheck(g.id, k)),
    stat(g){ const n = this.streak(g); return { v:n, l: n > 1 ? 'jours sous la limite' : 'jour sous la limite' }; },
    scheduled: () => true, calendar:true, daily:true,
    plan: g => ({ done:hasCheck(g.id, today()) }),
    row(x){
      const g = x.g, used = this.used(g), over = used > g.max;
      return rowShell(x, `<span class="${over ? 'urgent' : ''}">${fmtNum(used)}/${g.max} ${esc(g.unit)} ${g.period === 'week' ? 'cette semaine' : "aujourd'hui"}${over ? ' · limite dépassée' : ''}</span>`,
        `<button class="mini-btn" data-act="limit-add" data-id="${g.id}" aria-label="Noter 1 ${esc(g.unit)}">+1</button>${checkBtn(x, 'Valider ma journée sous la limite', over && !x.done)}`, { bar: used / Math.max(g.max, 1) * 100 });
    },
    validate(g){
      const ex = todayDone(g); if (ex) return undoDone(g, ex);
      if (this.used(g) > g.max) { toast(`Limite dépassée ${g.period === 'week' ? 'cette semaine' : "aujourd'hui"} : pas de validation. Tu repars à zéro ${g.period === 'week' ? 'lundi' : 'demain'}.`, 'x'); return; }
      winDone(g, TYPES.limit.pts);
    },
    actions(g){ return `<button class="btn" data-act="limit-add" data-id="${g.id}">${icon('plus')}Noter 1 ${esc(g.unit)}</button><button class="btn btn-ghost" data-act="limit-sub" data-id="${g.id}">Retirer 1</button>${validateBtn(g, hasCheck(g.id, today()), 'Valider ma journée')}`; },
    detail(g){
      let h = '';
      for (let i = 6; i >= 0; i--) {
        const k = ymd(addDays(new Date(), -i)), v = sumKind(g, 'use', c => c.date === k);
        h += `<li class="${g.period === 'day' && v > g.max ? 'over' : ''} ${i === 0 ? 'cur' : ''}"><span>${WD_SHORT[wdIdx(parseYmd(k))]}</span><span class="bar"><i style="width:${Math.min(100, v / Math.max(g.max, 1) * 100)}%"></i></span><span>${fmtNum(v)}/${g.max}</span></li>`;
      }
      return `<div class="t-limit">${g.period === 'week' ? `<p class="muted" style="margin-bottom:10px">Cette semaine : <b>${fmtNum(this.used(g))}/${g.max} ${esc(g.unit)}</b></p>` : ''}${h3('7 derniers jours')}<ul class="months">${h}</ul></div>`;
    },
    form: (v, g) => `<div class="field-row">
        <div class="field"><label for="l-max">Maximum</label><input type="number" id="l-max" name="lmax" min="0" step="any" value="${v('max', 2)}"></div>
        <div class="field"><label for="l-unit">Unité</label><input type="text" id="l-unit" name="lunit" maxlength="20" value="${v('unit')}" placeholder="cafés, h d'écran…"></div></div>
      <div class="seg" role="radiogroup" aria-label="Période"><label><input type="radio" name="lperiod" value="day" ${(g?.period || 'day') === 'day' ? 'checked' : ''}><span>Par jour</span></label><label><input type="radio" name="lperiod" value="week" ${g?.period === 'week' ? 'checked' : ''}><span>Par semaine</span></label></div>
      <small class="muted">Note chaque consommation avec « +1 », puis valide ta journée si tu es resté sous la limite.</small>`,
    parse(fd, g){ g.max = Number(fd.get('lmax')); g.unit = (fd.get('lunit') || '').trim() || 'unités'; g.period = fd.get('lperiod') || 'day'; if (!(g.max >= 0) || fd.get('lmax') === '') return 'Indique la limite à ne pas dépasser.'; }
  },

  /* ---------- Durée : minutes à cumuler, avec minuteur ---------- */
  duration: {
    mins: (g, k = today()) => sumKind(g, 'progress', c => c.date === k && c.userId === me().id),
    running: g => { const t = DB.timers?.[me()?.id]; return t && t.goalId === g.id ? t : null; },
    liveMins(g){ const t = this.running(g); return this.mins(g) + (t ? (Date.now() - t.start) / 60000 : 0); },
    meta: g => `${g.minutes} min par jour`,
    streak: g => dayStreak(g, k => hasCheck(g.id, k)),
    stat(g){ const n = this.streak(g); return { v:n, l: n > 1 ? 'jours réussis' : 'jour réussi' }; },
    scheduled: () => true, calendar:true, daily:true,
    plan: g => ({ done:hasCheck(g.id, today()) }),
    row(x){
      const g = x.g, r = this.running(g), m = this.liveMins(g);
      return rowShell(x, `<span><b data-timer="${g.id}">${fmtClock(m * 60)}</b> / ${g.minutes} min</span>`,
        `<button class="check timer ${r ? 'run' : ''} ${x.done && !r ? 'on' : ''}" data-act="timer" data-id="${g.id}" aria-label="${r ? 'Mettre en pause' : 'Démarrer le minuteur'} : ${esc(g.title)}">${icon(r ? 'pause' : x.done ? 'check' : 'play')}</button>`,
        { bar: m / g.minutes * 100 });
    },
    validate(g){ toggleTimer(g); },
    actions(g){ const r = this.running(g); return `<button class="btn btn-primary" data-act="timer" data-id="${g.id}">${icon(r ? 'pause' : 'play')}${r ? 'Mettre en pause' : 'Démarrer le minuteur'}</button><button class="btn" data-act="add-progress" data-id="${g.id}">${icon('plus')}Ajouter des minutes</button>`; },
    detail(g){ const m = this.liveMins(g); return `<div class="timer-big t-duration"><b data-timer="${g.id}">${fmtClock(m * 60)}</b><span class="muted">sur ${g.minutes} min aujourd'hui</span><span class="bar"><i data-timer-bar="${g.id}" style="width:${Math.min(100, m / g.minutes * 100)}%"></i></span></div>`; },
    progressInfo(g){ return { title:'Ajouter des minutes', info:`${fmtClock(this.mins(g) * 60)} / ${g.minutes} min aujourd'hui`, label:'Minutes', quick:[5, 10, 15, 30] }; },
    progress(g, v){ UI.modal = null; addTimeMinutes(g, v); },
    form: v => `<div class="field"><label for="d-min">Minutes par jour</label><input type="number" id="d-min" name="dmin" min="1" step="1" value="${v('minutes', 30)}"></div><small class="muted">Lance le minuteur depuis l'accueil : la journée se valide toute seule quand le temps est atteint.</small>`,
    parse(fd, g){ g.minutes = Number(fd.get('dmin')); if (!(g.minutes > 0)) return 'Indique une durée quotidienne en minutes.'; }
  },

  /* ---------- Mesure : une valeur qui fluctue, suivie en courbe ---------- */
  measure: {
    pts: g => DB.checkins.filter(c => c.goalId === g.id && c.kind === 'measure').sort((a, b) => a.date < b.date ? -1 : a.date > b.date ? 1 : a.at - b.at),
    fmt: (g, v) => g.timeFmt ? fmtClock(v) : fmtNum(Math.round(v * 100) / 100),
    better: (g, a, b) => g.dir === 'down' ? a < b : a > b,
    best(g){ return this.pts(g).reduce((b, c) => b == null || this.better(g, c.value, b) ? c.value : b, null); },
    meta(g){ const b = this.best(g); return `${g.dir === 'down' ? 'Plus bas = mieux' : 'Plus haut = mieux'}${g.target ? ` · cible ${this.fmt(g, g.target)}${g.timeFmt ? '' : ' ' + g.unit}` : ''}${b != null ? ` · record ${this.fmt(g, b)}` : ''}`; },
    stat(g){
      const p = this.pts(g); if (!p.length) return { v:'—', l:'aucune mesure' };
      const last = p[p.length - 1].value, d = last - p[0].value, u = g.timeFmt ? '' : ' ' + g.unit;
      return { v:this.fmt(g, last) + u, l: p.length < 2 ? 'première mesure' : d === 0 ? 'stable depuis le début' : `${this.better(g, last, p[0].value) ? 'en progrès' : 'en recul'} de ${this.fmt(g, Math.abs(d))}${g.timeFmt ? '' : ' ' + g.unit} depuis le début` };
    },
    plan: () => 'ongoing',
    row(x){ const g = x.g, s = this.stat(g); return rowShell(x, `<span>Dernière : ${esc(s.v)}</span>`, `<button class="mini-btn" data-act="validate" data-id="${g.id}">+ Mesure</button>`); },
    validate(g){ openProgress(g); },
    actions: g => `<button class="btn btn-primary" data-act="validate" data-id="${g.id}">${icon('plus')}Nouvelle mesure</button>`,
    card(g){ return this.spark(g); },
    detail(g){ const p = this.pts(g).slice(-5).reverse(); return `<div class="t-measure">${h3('Tendance')}${this.chart(g)}${p.length ? `${h3('Dernières mesures')}<ul class="months">${p.map(c => `<li><span>${esc(fmtDate(c.date))}</span><span></span><span>${this.fmt(g, c.value)}${unitOf(g)}</span></li>`).join('')}</ul>` : ''}</div>`; },
    spark(g){
      const p = this.pts(g); if (p.length < 2) return '';
      const vs = p.map(c => c.value), lo = Math.min(...vs), hi = Math.max(...vs), W = 110, H = 32;
      const pts = vs.map((v, i) => `${(i / (vs.length - 1) * (W - 6) + 3).toFixed(1)},${(hi === lo ? H / 2 : 3 + (hi - v) / (hi - lo) * (H - 6)).toFixed(1)}`);
      return `<svg class="spark" viewBox="0 0 ${W} ${H}" aria-hidden="true"><polyline points="${pts.join(' ')}" fill="none" stroke="var(--c-ink)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="${pts[pts.length - 1].split(',')[0]}" cy="${pts[pts.length - 1].split(',')[1]}" r="3.5" fill="var(--c-ink)"/></svg>`;
    },
    chart(g){
      const p = this.pts(g); if (p.length < 2) return `<p class="muted small" style="margin-bottom:14px">Ajoute au moins deux mesures pour voir ta courbe.</p>`;
      const W = 320, H = 160, L = 46, R = 14, T = 14, B = 24, vs = p.map(c => c.value);
      const dMin = Math.min(...vs), dMax = Math.max(...vs), tg = g.target ? Number(g.target) : null;
      let lo = Math.min(dMin, tg ?? dMin), hi = Math.max(dMax, tg ?? dMax); if (lo === hi) { lo -= 1; hi += 1; }
      const padv = (hi - lo) * .12; lo -= padv; hi += padv;
      const t0 = parseYmd(p[0].date).getTime(), t1 = parseYmd(p[p.length - 1].date).getTime();
      const X = c => L + (t1 === t0 ? (W - L - R) / 2 : (parseYmd(c.date).getTime() - t0) / (t1 - t0) * (W - L - R));
      const Y = v => T + (hi - v) / (hi - lo) * (H - T - B);
      const xy = p.map(c => [X(c), Y(c.value)]);
      const line = 'M' + xy.map(([x, y]) => `${x.toFixed(1)},${y.toFixed(1)}`).join('L');
      const area = `${line}L${xy[xy.length - 1][0].toFixed(1)},${H - B}L${xy[0][0].toFixed(1)},${H - B}Z`;
      const ticks = [...new Set([dMin, dMax])].map(v => `<line class="grid" x1="${L}" x2="${W - R}" y1="${Y(v).toFixed(1)}" y2="${Y(v).toFixed(1)}"/><text class="tick" x="${L - 6}" y="${(Y(v) + 3.5).toFixed(1)}" text-anchor="end">${this.fmt(g, v)}</text>`).join('');
      const target = tg != null ? `<line class="tgt" x1="${L}" x2="${W - R}" y1="${Y(tg).toFixed(1)}" y2="${Y(tg).toFixed(1)}"/><text class="tick" x="${W - R}" y="${(Y(tg) - 5).toFixed(1)}" text-anchor="end">cible ${this.fmt(g, tg)}</text>` : '';
      const short = k => parseYmd(k).toLocaleDateString('fr-FR', { day:'numeric', month:'short' });
      const [lx, ly] = xy[xy.length - 1];
      return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Courbe de ${p.length} mesures, de ${this.fmt(g, vs[0])} à ${this.fmt(g, vs[vs.length - 1])}">
        <defs><linearGradient id="ga-${g.id}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" style="stop-color:var(--c);stop-opacity:.45"/><stop offset="1" style="stop-color:var(--c);stop-opacity:0"/></linearGradient></defs>
        ${ticks}${target}
        <path d="${area}" fill="url(#ga-${g.id})"/>
        <path d="${line}" fill="none" stroke="var(--c-ink)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
        ${xy.slice(0, -1).map(([x, y]) => `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="2.6" fill="var(--c-ink)"/>`).join('')}
        <circle cx="${lx.toFixed(1)}" cy="${ly.toFixed(1)}" r="9" fill="var(--c)" opacity=".35"/><circle cx="${lx.toFixed(1)}" cy="${ly.toFixed(1)}" r="4.5" fill="var(--c-ink)"/>
        <text class="tick" x="${L}" y="${H - 6}">${short(p[0].date)}</text><text class="tick" x="${W - R}" y="${H - 6}" text-anchor="end">${short(p[p.length - 1].date)}</text>
      </svg>`;
    },
    parseInput(g, raw){
      raw = String(raw).trim().replace(',', '.'); if (!raw) return NaN;
      if (g.timeFmt) { if (raw.includes(':')) { const parts = raw.split(':').map(Number); if (parts.some(isNaN)) return NaN; return parts.reduce((s, x) => s * 60 + x, 0); } return Number(raw) * 60; }
      return Number(raw);
    },
    progressInfo(g){ const p = this.pts(g), last = p.length ? p[p.length - 1].value : null; return { title:'Nouvelle mesure', info:last != null ? `dernière mesure ${esc(this.fmt(g, last))}${unitOf(g)}` : 'première mesure', label: g.timeFmt ? 'Temps (mm:ss ou h:mm:ss)' : `Valeur${g.unit ? ` (${esc(g.unit)})` : ''}`, text:true, value: last != null ? this.fmt(g, last) : '', quick:[] }; },
    progress(g, v){
      const u = me(), wasLit = globalStreak(u.id).lit, prevBest = this.best(g);
      const pts = DB.checkins.some(c => c.goalId === g.id && c.kind === 'measure' && c.date === today()) ? 0 : TYPES.measure.pts;
      addCheck(g, 'measure', v, pts);
      let total = pts;
      if (prevBest != null && this.better(g, v, prevBest)) toast(`Nouveau record : ${this.fmt(g, v)}${g.timeFmt ? '' : ' ' + g.unit} !`, 'star');
      if (g.target && !g.targetHit && (v === Number(g.target) || this.better(g, v, Number(g.target)))) {
        g.targetHit = today(); total += 80;
        finishWith(g, 80, `Cible atteinte pour « ${g.title} » : ${this.fmt(g, v)} ! +80 flammes.`, `Cible atteinte : ${this.fmt(g, v)}${g.timeFmt ? '' : ' ' + g.unit} pour « ${g.title} ».`);
        celebrateGoal(g, 'Cible atteinte !', `${this.fmt(g, v)}${g.timeFmt ? '' : ' ' + g.unit} : tu as atteint ta cible.`);
      }
      UI.modal = null; save(); render(); if (total) afterValidation(g, total, wasLit); save();
    },
    form: (v, g) => `<label class="check-row" for="m-time"><span>Valeur en temps (mm:ss)<br><small class="muted" style="font-weight:500">Pour un chrono : temps au 10 km, gainage…</small></span><span class="switch"><input type="checkbox" id="m-time" name="mtime" ${g?.timeFmt ? 'checked' : ''}><span></span></span></label>
      <div class="field-row">
        <div class="field"><label for="m-unit">Unité</label><input type="text" id="m-unit" name="meunit" maxlength="20" value="${v('unit')}" placeholder="kg, mots/min…"></div>
        <div class="field"><label for="m-target">Cible (optionnelle)</label><input type="text" id="m-target" name="metarget" value="${g?.target ? esc(EXT.measure.fmt(g, g.target)) : ''}" placeholder="50:00 ou 70"></div></div>
      <div class="seg" role="radiogroup" aria-label="Sens du progrès"><label><input type="radio" name="mdir" value="down" ${(g?.dir || 'down') === 'down' ? 'checked' : ''}><span>Plus bas = mieux</span></label><label><input type="radio" name="mdir" value="up" ${g?.dir === 'up' ? 'checked' : ''}><span>Plus haut = mieux</span></label></div>`,
    parse(fd, g){
      g.timeFmt = fd.get('mtime') === 'on'; g.unit = (fd.get('meunit') || '').trim(); g.dir = fd.get('mdir') || 'down';
      const tr = (fd.get('metarget') || '').trim(); g.target = tr ? EXT.measure.parseInput(g, tr) : null;
      if (tr && !(g.target > 0)) return g.timeFmt ? 'Cible invalide : écris un temps comme 50:00.' : 'La cible doit être un nombre.';
      if (!g.timeFmt && !g.unit) return 'Indique une unité (kg, mots/min…), ou coche « valeur en temps ».';
    }
  },

  /* ---------- Horaire : avant ou après une heure ---------- */
  timed: {
    LBL: { before:'Avant', after:'Après', notafter:'Rien après' },
    vdate: g => g.mode === 'notafter' ? yday() : today(),
    meta(g){ return `${this.LBL[g.mode]} ${g.time} · ${daysLabel(g.days)}`; },
    scheduled: (g, d) => g.days.includes(wdIdx(d)), calendar:true, daily:true,
    streak(g){ const na = g.mode === 'notafter'; return dayStreak(g, k => hasCheck(g.id, k), d => g.days.includes(wdIdx(d)), na ? yday() : today(), na ? addDays(new Date(), -1) : new Date()); },
    stat(g){ const n = this.streak(g); return { v:n, l: n > 1 ? 'jours dans les temps' : 'jour dans les temps' }; },
    plan(g){ const k = this.vdate(g); if (!g.days.includes(wdIdx(parseYmd(k))) || k < ymd(g.createdAt)) return null; return { done:hasCheck(g.id, k) }; },
    window(g){
      const hm = nowHM();
      if (g.mode === 'before') return hm < g.time ? { open:true, txt:`Encore ${untilTxt(g.time)} pour valider` } : { open:false, txt:`Créneau fermé à ${g.time}` };
      if (g.mode === 'after') return hm >= g.time ? { open:true, txt:`Créneau ouvert depuis ${g.time}` } : { open:false, txt:`Ça compte à partir de ${g.time}` };
      return { open:true, txt:`Hier soir, rien après ${g.time} ?` };
    },
    row(x){ const w = this.window(x.g); return rowShell(x, `<span class="${!w.open && !x.done ? 'urgent' : ''}">${esc(w.txt)}</span>`, checkBtn(x, x.g.mode === 'notafter' ? "J'ai tenu hier soir" : 'Valider', !w.open && !x.done)); },
    validate(g){
      const k = this.vdate(g), ex = todayDone(g, k); if (ex) return undoDone(g, ex);
      if (!g.days.includes(wdIdx(parseYmd(k)))) { toast("Cet horaire n'est pas prévu aujourd'hui.", 'cal'); return; }
      const w = this.window(g);
      if (!w.open) { toast(g.mode === 'before' ? `Trop tard : c'était à faire avant ${g.time}. Demain sera le bon jour.` : `Patience : ça compte à partir de ${g.time}.`, 'clock'); return; }
      winDone(g, TYPES.timed.pts, k);
    },
    actions(g){ const k = this.vdate(g); return g.days.includes(wdIdx(parseYmd(k))) ? validateBtn(g, hasCheck(g.id, k), g.mode === 'notafter' ? "J'ai tenu hier soir" : "Valider aujourd'hui") : ''; },
    form: (v, g) => `<div class="seg" role="radiogroup" aria-label="Condition" style="flex-wrap:wrap">${[['before','Faire avant'],['after','Faire après'],['notafter','Ne rien faire après']].map(([k, l]) => `<label><input type="radio" name="tmode" value="${k}" ${(g?.mode || 'before') === k ? 'checked' : ''}><span>${l}</span></label>`).join('')}</div>
      <div class="field"><label for="t-time">Heure</label><input type="time" id="t-time" name="ttime" value="${v('time', '07:00')}" style="width:auto"></div>
      <fieldset class="field"><legend>Jours concernés</legend><div class="daychips">${WD.map((d, i) => `<label><input type="checkbox" name="tdays" value="${i}" ${(g ? g.days : [0,1,2,3,4,5,6]).includes(i) ? 'checked' : ''} aria-label="${WD_SHORT[i]}"><span>${d}</span></label>`).join('')}</div></fieldset>
      <small class="muted">« Ne rien faire après » (pas d'écran après 22 h…) se confirme le lendemain matin.</small>`,
    parse(fd, g){ g.mode = fd.get('tmode') || 'before'; g.time = fd.get('ttime') || '07:00'; g.days = fd.getAll('tdays').map(Number); if (!g.days.length) return 'Choisis au moins un jour.'; }
  },

  /* ---------- Projet : checklist d'étapes ---------- */
  project: {
    counts: g => { const t = g.tasks || []; return { d:t.filter(x => x.done).length, n:t.length }; },
    meta(g){ const { d, n } = this.counts(g); return `${d}/${n} étapes${g.due && !g.completedAt ? ' · ' + dueText(g.due) : ''}`; },
    stat(g){ const { d, n } = this.counts(g); return { v:(n ? Math.round(d / n * 100) : 0) + '%', l:'accompli' }; },
    plan: g => g.completedAt ? null : 'ongoing', closable:true,
    row(x){ const { d, n } = this.counts(x.g); return rowShell(x, `<span>${d}/${n} étapes</span>`, `<button class="mini-btn" data-act="open-goal" data-id="${x.g.id}">Ouvrir</button>`, { bar: n ? d / n * 100 : 0 }); },
    card(g){ const { d, n } = this.counts(g); return rowBar(n ? d / n * 100 : 0); },
    validate(g){ UI.modal = { type:'goal', id:g.id }; renderModal(); },
    actions: () => '',
    detail(g){
      const own = g.userId === me().id;
      const ts = g.tasks || [], n = ts.length, mv = own && n > 1;
      return `<div class="t-project">${h3('Étapes')}${mv ? `<p class="muted small tasks-tip">Fais glisser ${icon('grip')} ou utilise les flèches pour réordonner.</p>` : ''}<ul class="tasks" data-gid="${g.id}">${ts.map((t, i) => `<li class="${t.done ? 'done' : ''}" data-tid="${t.id}">${mv ? `<span class="task-grip" aria-hidden="true" title="Glisser pour déplacer">${icon('grip')}</span>` : ''}<label><input type="checkbox" data-act="task-toggle" data-id="${g.id}|${t.id}" ${t.done ? 'checked' : ''} ${own ? '' : 'disabled'}><span>${esc(t.t)}</span></label>${own ? `<span class="task-acts">${mv ? `<button class="icon-btn plain" data-act="task-move" data-id="${g.id}|${t.id}|-1" aria-label="Monter l'étape ${esc(t.t)}" ${i === 0 ? 'disabled' : ''}>${icon('up')}</button><button class="icon-btn plain" data-act="task-move" data-id="${g.id}|${t.id}|1" aria-label="Descendre l'étape ${esc(t.t)}" ${i === n - 1 ? 'disabled' : ''}>${icon('down')}</button>` : ''}<button class="icon-btn plain" data-act="task-del" data-id="${g.id}|${t.id}" aria-label="Supprimer l'étape ${esc(t.t)}">${icon('x')}</button></span>` : ''}</li>`).join('')}</ul>
        ${own ? `<form class="c-form" data-form="task" data-id="${g.id}" style="margin-bottom:16px"><label class="sr" for="task-new">Nouvelle étape</label><input type="text" id="task-new" name="t" placeholder="Ajouter une étape…" maxlength="120" autocomplete="off"><button class="btn sm" type="submit">Ajouter</button></form>` : ''}</div>`;
    },
    form: (v, g) => `${g ? `<p class="muted small">Ajoute, coche ou supprime les étapes depuis la fiche du projet.</p>` : `<div class="field"><label for="p-tasks">Étapes (une par ligne)</label><textarea id="p-tasks" name="ptasks" placeholder="Choisir un nom de domaine&#10;Maquetter la page d'accueil&#10;Mettre en ligne"></textarea></div>`}
      <div class="field"><label for="p-due">Échéance (optionnelle)</label><input type="date" id="p-due" name="pdue" value="${v('due')}"></div>`,
    parse(fd, g, g0){
      g.due = fd.get('pdue') || '';
      if (!g0) { g.tasks = String(fd.get('ptasks') || '').split('\n').map(s => s.trim()).filter(Boolean).slice(0, 60).map(t => ({ id:uid(), t, done:false })); if (!g.tasks.length) return 'Ajoute au moins une étape (une par ligne).'; }
    }
  },

  /* ---------- Challenge : X jours d'affilée, puis fin ---------- */
  challenge: {
    dayNum: g => Math.round((parseYmd(today()) - parseYmd(g.start)) / DAY) + 1,
    doneDays(g){ let n = 0; for (let i = 0, d = parseYmd(g.start); i < g.length; i++, d = addDays(d, 1)) if (hasCheck(g.id, ymd(d))) n++; return n; },
    meta(g){ if (g.completedAt) return `Réussi : ${g.length} jours sur ${g.length}`; if (g.failedAt) return `Interrompu au jour ${g.failDay}`; const k = this.dayNum(g); return k < 1 ? `Commence le ${fmtDate(g.start)}` : `Jour ${Math.min(k, g.length)} sur ${g.length}`; },
    stat(g){ return { v:`${this.doneDays(g)}/${g.length}`, l:'jours validés' }; },
    streak(g){ return this.doneDays(g); },
    scheduled: (g, d) => { const k = ymd(d); return k >= g.start && k < ymd(addDays(parseYmd(g.start), g.length)); }, closable:true, daily:true,
    plan(g){ if (g.completedAt || g.failedAt) return null; const k = this.dayNum(g); return k < 1 || k > g.length ? null : { done:hasCheck(g.id, today()) }; },
    row(x){ return rowShell(x, `<span>Jour ${this.dayNum(x.g)}/${x.g.length}</span>`, checkBtn(x, 'Valider le jour'), { bar: this.doneDays(x.g) / x.g.length * 100 }); },
    card(g){ return rowBar(this.doneDays(g) / g.length * 100); },
    validate(g){
      if (g.completedAt || g.failedAt) return;
      const ex = todayDone(g); if (ex) return undoDone(g, ex);
      const u = me(), wasLit = globalStreak(u.id).lit;
      addCheck(g, 'done', 1, TYPES.challenge.pts); UI.justDone = g.id;
      let pts = TYPES.challenge.pts;
      if (this.doneDays(g) >= g.length) {
        g.completedAt = Date.now(); pts += 150;
        finishWith(g, 150, `Challenge réussi : ${g.length} jours pour « ${g.title} » ! +150 flammes.`, `Challenge terminé : ${g.length} jours d'affilée pour « ${g.title} ».`);
        celebrateGoal(g, 'Challenge réussi !', `${g.length} jours d'affilée, sans lâcher. Chapeau.`);
      }
      save(); render(); afterValidation(g, pts, wasLit); save(); checkPerfect();
    },
    evaluate(g){
      if (g.completedAt || g.failedAt) return;
      for (let i = 0, d = parseYmd(g.start); i < g.length; i++, d = addDays(d, 1)) {
        const k = ymd(d); if (k >= today()) break;
        if (!hasCheck(g.id, k)) { g.failedAt = Date.now(); g.failDay = i + 1; notify(g.userId, `Challenge « ${g.title} » interrompu au jour ${i + 1}. Tu peux le relancer quand tu veux depuis sa fiche.`, { type:'deadline', goalId:g.id }); return true; }
      }
    },
    actions(g){
      if (g.failedAt || g.completedAt) return `<button class="btn btn-primary" data-act="challenge-restart" data-id="${g.id}">${icon('repeat')}${g.failedAt ? "Recommencer à partir d'aujourd'hui" : 'Relancer un nouveau challenge'}</button>`;
      return this.dayNum(g) >= 1 ? validateBtn(g, hasCheck(g.id, today()), 'Valider le jour') : '';
    },
    detail(g){
      let h = '';
      for (let i = 0, d = parseYmd(g.start); i < g.length; i++, d = addDays(d, 1)) {
        const k = ymd(d), on = hasCheck(g.id, k), t = today();
        h += `<span class="cal-c ${on ? 'on' : k > t ? 'fut' : k === t ? 'pending' : 'miss'} ${k === t ? 'is-today' : ''}" title="${fmtDate(k)}">${i + 1}</span>`;
      }
      return `<div class="t-challenge">${h3(`Les ${g.length} jours`)}<div class="chal">${h}</div><p class="muted small" style="margin-bottom:16px">Un jour manqué interrompt le challenge : la régularité, c'est tout le jeu.</p></div>`;
    },
    form: v => `<div class="field-row">
        <div class="field"><label for="c-len">Durée (jours)</label><input type="number" id="c-len" name="clen" min="2" max="365" step="1" value="${v('length', 30)}"></div>
        <div class="field"><label for="c-start">Début</label><input type="date" id="c-start" name="cstart" value="${v('start', today())}"></div></div>`,
    parse(fd, g){ g.length = Math.round(Number(fd.get('clen'))); g.start = fd.get('cstart') || today(); if (!(g.length >= 2 && g.length <= 365)) return 'La durée doit être comprise entre 2 et 365 jours.'; }
  },

  /* ---------- Paliers : une cible qui monte chaque semaine ---------- */
  program: {
    week: g => Math.round((weekStart(new Date()) - weekStart(parseYmd(g.start))) / (7 * DAY)) + 1,
    target: (g, w) => g.base + g.step * (w - 1),
    wsum(g, w){ const s = addDays(weekStart(parseYmd(g.start)), (w - 1) * 7), a = ymd(s), b = ymd(addDays(s, 6)); return sumKind(g, 'progress', c => c.date >= a && c.date <= b); },
    meta(g){ if (g.completedAt) return `Programme terminé : ${(g.weeksDone || []).length}/${g.weeks} semaines réussies`; const w = this.week(g); return w < 1 ? `Commence le ${fmtDate(g.start)}` : `Semaine ${w}/${g.weeks} · cible ${fmtNum(this.target(g, w))} ${g.unit}`; },
    stat(g){ const w = Math.min(Math.max(this.week(g), 1), g.weeks); return { v:Math.min(100, Math.round(this.wsum(g, w) / this.target(g, w) * 100)) + '%', l:`de la semaine ${w}` }; },
    streak: g => (g.weeksDone || []).length,
    plan(g){ if (g.completedAt) return null; const w = this.week(g); return w >= 1 && w <= g.weeks ? 'ongoing' : null; }, closable:true,

const CLOSABLE = new Set(['deadline', 'objective', ...Object.keys(EXT).filter(k => EXT[k].closable)]);
const isClosedGoal = g => g.archived || (CLOSABLE.has(g.type) && !!(g.completedAt || g.failedAt));

/* ---- minuteur (type Durée) ---- */
function toggleTimer(g){
  const u = me(); DB.timers = DB.timers || {};
  const t = DB.timers[u.id];
  if (t && t.goalId === g.id) return stopTimer(u);
  if (t) stopTimer(u, true);
  DB.timers[u.id] = { goalId:g.id, start:Date.now() };
  save(); render(); toast(`Minuteur lancé : ${g.title}`, 'clock');
}
function stopTimer(u, silent){
  const t = DB.timers?.[u.id]; if (!t) return;
  delete DB.timers[u.id];
  const g = goalById(t.goalId); if (!g) { save(); return; }
  let mins = Math.round((Date.now() - t.start) / 6000) / 10;
  if (mins > 240) { mins = 240; setTimeout(() => toast('Minuteur oublié ? La session a été plafonnée à 4 h.', 'clock'), 0); }
  if (mins >= .1) addTimeMinutes(g, mins, silent); else { save(); render(); }
}
function addTimeMinutes(g, mins, silent){
  const u = me(), wasLit = globalStreak(u.id).lit;
  addCheck(g, 'progress', mins, 0);
  if (!hasCheck(g.id, today()) && EXT.duration.mins(g) >= g.minutes) {
    addCheck(g, 'done', 1, TYPES.duration.pts); UI.justDone = g.id;
    save(); render(); afterValidation(g, TYPES.duration.pts, wasLit);
    toast(`${g.minutes} minutes atteintes pour « ${g.title} » !`, 'clock'); save(); checkPerfect(); return;
  }
  save(); render(); if (!silent) toast(`+${fmtNum(mins)} min enregistrées.`, 'clock');
}
setInterval(() => {
  const u = me(), t = u && DB.timers?.[u.id]; if (!t) return;
  const g = goalById(t.goalId); if (!g) return;
  const live = EXT.duration.liveMins(g);
  document.querySelectorAll(`[data-timer="${g.id}"]`).forEach(el => el.textContent = fmtClock(live * 60));
  document.querySelectorAll(`[data-timer-bar="${g.id}"]`).forEach(el => el.style.width = Math.min(100, live / g.minutes * 100) + '%');
  if (!hasCheck(g.id, today()) && live >= g.minutes) stopTimer(u);
}, 1000);

/* ---- binôme de motivation (accountability) ---- */
function requestVerify(g, c){
  const b = userById(g.buddy), owner = userById(g.userId); if (!b) return;
  notify(b.id, `${owner.name} te demande de confirmer « ${g.title} » (${fmtDate(c.date)}).`, { type:'verify', goalId:g.id });
  if (b.demo) setTimeout(() => confirmCheck(c.id, true), 3500 + Math.random() * 3000);
}
function confirmCheck(cid, ok){
  const c = DB.checkins.find(x => x.id === cid); if (!c || !c.pending) return;
  const g = goalById(c.goalId), b = userById(g?.buddy); if (!g || !b) return;
  if (ok) {
    c.pending = false; c.pts = c.ptsPending || 0; delete c.ptsPending;
    notify(c.userId, `${b.name} a confirmé « ${g.title} »${c.pts ? ` : +${c.pts} flammes` : ''}.`, { type:'verify', goalId:g.id });
  } else {
    DB.checkins.splice(DB.checkins.indexOf(c), 1);
    if (g.type === 'deadline' && c.kind === 'done') g.completedAt = null;
    notify(c.userId, `${b.name} n'a pas confirmé « ${g.title} » du ${fmtDate(c.date)}. La validation est retirée.`, { type:'verify', goalId:g.id });
  }
  save(); softRender();
}
function verifySection(){
  const u = me(), list = DB.checkins.filter(c => c.pending && goalById(c.goalId)?.buddy === u.id);
  if (!list.length) return '';
  const what = c => c.kind === 'done' ? 'validé' : c.kind === 'measure' ? 'mesure enregistrée' : `+${fmtNum(c.value)} ${goalById(c.goalId).unit || ''}`;
  return `<section class="glass card"><div class="card-h"><h2>À confirmer pour tes amis</h2><span class="count">${list.length}</span></div>
    <ul class="verify">${list.map(c => { const g = goalById(c.goalId), o = userById(c.userId); return `<li>${avatar(o, 36)}<span class="vt">${esc(o.name)} · ${esc(g.icon)} ${esc(g.title)}<small>${esc(fmtDate(c.date))} · ${esc(what(c))}</small></span><button class="btn btn-primary sm" data-act="verify-ok" data-id="${c.id}">Confirmer</button><button class="btn sm" data-act="verify-no" data-id="${c.id}">Refuser</button></li>`; }).join('')}</ul></section>`;
}
function buddyFields(g){
  const fr = friendsOf(me().id).map(userById).filter(Boolean);
  if (!socialOn() || !fr.length) return '';
  return `<fieldset class="field" data-buddy><legend>Binôme de motivation (optionnel)</legend>

// Évalue les fins de challenge, de duel, de programme… et prévient le binôme des oublis
function evaluateGoals(u, once){
  let changed = false;
  for (const g of myGoals(u.id).filter(g => !g.archived)) {
    if (EXT[g.type]?.evaluate && EXT[g.type].evaluate(g)) changed = true;
    if (g.userId === u.id && g.buddy && g.buddyMiss && !isClosedGoal(g)) {
      const yd = addDays(new Date(), -1), k = ymd(yd);
      const sched = g.type === 'timed' ? g.mode !== 'notafter' && g.days.includes(wdIdx(yd)) : EXT[g.type] ? (EXT[g.type].daily && (!EXT[g.type].scheduled || EXT[g.type].scheduled(g, yd))) : scheduled(g, yd);
      if (sched && k >= ymd(g.createdAt) && !DB.checkins.some(c => c.goalId === g.id && c.date === k && c.kind === 'done' && c.userId === u.id)) {
        once('miss' + g.id, () => {
          const b = userById(g.buddy); if (!b) return;
          notify(b.id, `${u.name} a raté « ${g.title} » hier. Un petit mot d'encouragement ?`, { type:'verify', goalId:g.id });
          notify(u.id, `Ton binôme ${b.name} a reçu une alerte pour ton oubli d'hier sur « ${g.title} ».`, { type:'verify', goalId:g.id });
        });
      }
    }
  }
  if (changed) { save(); softRender(); }
}

function weekStrip(id){
  const ws = weekStart(new Date()), days = activeDays(id), frozen = new Set(userById(id).frozenDays || []), t = today();
  let h = '';
  for (let i = 0; i < 7; i++) {
    const k = ymd(addDays(ws, i)), fut = k > t, on = days.has(k), fz = !on && frozen.has(k);

  }
  return `<div class="week">${h}</div>`;
}

    <circle class="trk" cx="54" cy="54" r="${r}" fill="none" stroke-width="12"/>
    <circle class="arc" cx="54" cy="54" r="${r}" fill="none" stroke="url(#gRing)" stroke-width="12" stroke-linecap="round" stroke-dasharray="${c * pct} ${c}" transform="rotate(-90 54 54)"/>

function viewGoals(){

  if (all.some(isFav)) F.splice(1, 0, ['fav', '★ Favoris']);
  const isClosed = isClosedGoal;
  if (UI.groupFilter !== 'all' && UI.groupFilter !== 'none' && !groupsOf(u).some(x => x.id === UI.groupFilter)) UI.groupFilter = 'all';
  const inGroup = g => UI.groupFilter === 'all' || (groupOfGoal(u, g.id)?.id || 'none') === UI.groupFilter;
  const list = all.filter(g => (UI.goalFilter === 'done' ? isClosed(g) : !isClosed(g) && (UI.goalFilter === 'all' || g.type === UI.goalFilter || (UI.goalFilter === 'fav' && isFav(g)))) && inGroup(g)).sort((a, b) => isFav(b) - isFav(a));

function gelProgress(u, compact){
  const c = u.cheersIn.length % FREEZE_EVERY, left = FREEZE_EVERY - c, social = socialOn(u);
  const txt = !social ? `Un gel protège automatiquement ta série un jour où tu n'as rien validé. Active les fonctions sociales pour en gagner d'autres.`
    : compact ? `Encore ${pl(left, 'encouragement reçu', 'encouragements reçus')} sur tes publications pour gagner un gel.`
    : `${c}/${FREEZE_EVERY} encouragements reçus avant ton prochain gel. Un gel protège automatiquement ta série un jour où tu n'as rien validé.`;
  return `<section class="glass card gel-card">
    <span class="gel-ico">${icon('snow')}</span>
    <div class="lvl"><b>${pl(u.freezes, 'gel de série', 'gels de série')}</b>
      ${social ? `<span class="bar t-objective"><i style="width:${c / FREEZE_EVERY * 100}%"></i></span>` : ''}
      <small class="muted">${txt}</small></div>
  </section>`;
}

function renderModal(){
  const m = UI.modal;
  if (!m || (!me() && !['importPreview','legal','a11y'].includes(m.type))) { modalRoot.innerHTML = ''; UI.modalKey = null; lockScroll(); return; }
  const body = { groupNew:mGroupNew, groupInfo:mGroupInfo, goalForm:mGoalForm, goal:mGoal, progress:mProgress, user:mUser, notifs:mNotifs, confirm:mConfirm, share:mShare, avatar:mAvatar, tuto:mTuto, importPreview:mImport, legal:mLegal, a11y:mA11y, shareText:mShareText, groups:mGroups, modUser:mModUser, appeal:mAppeal, report:mReport, chat:mChat, compose:mCompose, storyNew:mStoryNew, exportData:mExport, notes:mNotes, shareHub:mShareHub }[m.type]();
  // Même fenêtre redessinée (actualisation automatique, validation, favori…) : on garde la position de lecture et le focus
  const key = `${m.type}|${m.id || m.with || m.group || m.doc || ''}`, old = modalRoot.querySelector('.sheet'), same = !!old && UI.modalKey === key;
  const top = same ? old.scrollTop : 0, act = same && old.contains(document.activeElement) ? document.activeElement : null;
  const focusSel = act ? (act.id ? `#${CSS.escape(act.id)}` : act.dataset.act ? `[data-act="${act.dataset.act}"]${act.dataset.id ? `[data-id="${CSS.escape(act.dataset.id)}"]` : ''}` : null) : null;
  modalRoot.innerHTML = `<div class="overlay ${same ? 'still' : ''}" data-act="close-bg"><div class="sheet" role="dialog" aria-modal="true" aria-labelledby="m-title">${body}</div></div>`;
  UI.modalKey = key;
  lockScroll();
  if (m.type === 'goalForm') syncGoalForm();
  if (same) {
    const sh = modalRoot.querySelector('.sheet'); if (sh) sh.scrollTop = top;
    (focusSel && modalRoot.querySelector(focusSel) || sh)?.focus({ preventScroll:true });
    return;
  }
  const f = modalRoot.querySelector('[autofocus]') || modalRoot.querySelector('.sheet');
  if (f) { f.setAttribute('tabindex', f.getAttribute('tabindex') || '-1'); f.focus({ preventScroll:true }); }
}

function syncGoalForm(){
  const f = modalRoot.querySelector('form[data-form="goal"]'); if (!f) return;
  const type = f.querySelector('input[name="type"]:checked')?.value;
  f.querySelectorAll('[data-sec]').forEach(el => el.hidden = el.dataset.sec !== type);
  f.querySelectorAll('[data-buddy]').forEach(el => el.hidden = !!EXT[type]?.social);
  const mode = f.querySelector('input[name="mode"]:checked')?.value || 'days';
  f.querySelectorAll('[data-sub]').forEach(el => el.hidden = el.dataset.sub !== mode);
}
function calendar(g){
  const ws = weekStart(new Date()), start = addDays(ws, -28), end = addDays(ws, 6), t = today(), created = ymd(g.createdAt);
  let cells = WD.map(d => `<span class="hd">${d}</span>`).join('');
  for (let d = new Date(start); d <= end; d = addDays(d, 1)) {
    const k = ymd(d), fut = k > t;
    const on = DB.checkins.some(c => c.goalId === g.id && c.date === k && isWin(c)), rel = hasCheck(g.id, k, 'relapse');
    let cls = 'rest';
    if (rel) cls = 'relapse'; else if (on) cls = 'on'; else if (fut) cls = 'fut';
    else if (k >= created && scheduled(g, d) && !(g.type === 'abstinence' && k < g.since)) cls = k === t ? 'pending' : 'miss';

async function hashPw(pw, salt){
  try {
    if (crypto && crypto.subtle) {
      const enc = new TextEncoder();
      const key = await crypto.subtle.importKey('raw', enc.encode(pw), 'PBKDF2', false, ['deriveBits']);
      const bits = await crypto.subtle.deriveBits({ name:'PBKDF2', salt:enc.encode(salt), iterations:120000, hash:'SHA-256' }, key, 256);
      return [...new Uint8Array(bits)].map(b => b.toString(16).padStart(2, '0')).join('');
    }
  } catch(e){}
  let h1 = 0xdeadbeef, h2 = 0x41c6ce57; const s = salt + pw;
  for (let i = 0; i < s.length; i++) { const c = s.charCodeAt(i); h1 = Math.imul(h1 ^ c, 2654435761); h2 = Math.imul(h2 ^ c, 1597334677); }
  return 'w' + (h1 >>> 0).toString(16) + (h2 >>> 0).toString(16);
}

const FORMS = {
  async login(f){
    if (!NET.online) { UI.authError = 'Hors ligne : la connexion à un compte nécessite internet. Tu peux continuer sans compte en attendant.'; return render(); }
    const d = Object.fromEntries(new FormData(f)), un = (d.username || '').trim().toLowerCase();
    const u = DB.users.find(x => x.username === un);
    if (!un || !d.password) { UI.authError = "Indique ton nom d'utilisateur et ton mot de passe."; return render(); }
    if (!u) { UI.authError = "Aucun compte avec ce nom d'utilisateur. Crée un compte ou vérifie l'orthographe."; return render(); }
    if (u.role === 'official') { UI.authError = 'Le compte PepsGoal Officiel se gère depuis le compte admin (onglet Modération).'; return render(); }
    if (!u.passHash) { UI.authError = "Ce profil d'exemple n'a pas de mot de passe. Utilise le bouton « Mode démonstration »."; return render(); }
    if (await hashPw(d.password, u.salt) !== u.passHash) { UI.authError = 'Mot de passe incorrect.'; return render(); }
    enter(u);
  },
  async signup(f){
    if (!NET.online) { UI.authError = 'Hors ligne : la connexion à un compte nécessite internet. Tu peux continuer sans compte en attendant.'; return render(); }
    const d = Object.fromEntries(new FormData(f)), un = (d.username || '').trim().toLowerCase(), name = (d.name || '').trim();
    if (name.length < 2) { UI.authError = 'Indique ton nom (2 caractères minimum).'; return render(); }
    if (!/^[a-z0-9._]{3,20}$/.test(un)) { UI.authError = "Le nom d'utilisateur doit faire 3 à 20 caractères : lettres, chiffres, point ou tiret bas."; return render(); }
    if (DB.users.some(x => x.username === un)) { UI.authError = "Ce nom d'utilisateur est déjà pris."; return render(); }
    if ((d.password || '').length < 6) { UI.authError = 'Le mot de passe doit contenir au moins 6 caractères.'; return render(); }
    const salt = uid() + uid();
    const hue = Math.floor(Math.random() * ACCENTS.length);
    const u = Object.assign({ id:uid(), username:un, name, hue, bio:'', demo:false, salt, passHash: await hashPw(d.password, salt), createdAt:Date.now(), settings:defSettings(), milestones:[] }, newUserFields(hue));
    DB.users.push(u); welcomeOfficial(u);
    DB.notifs.push({ id:uid(), userId:u.id, type:'badge', text:'Bienvenue sur PepsGoal ! Crée ton premier objectif pour allumer ta flamme.', at:Date.now(), read:false });
    enter(u);
  },
  goal(f){
    const fd = new FormData(f), m = UI.modal, g0 = m.editId ? goalById(m.editId) : null;
    const type = g0 ? g0.type : fd.get('type'), err = f.querySelector('#g-err');
    const fail = msg => { err.textContent = msg; err.hidden = false; };
    const title = (fd.get('title') || '').trim();
    if (!title) return fail("Donne un intitulé à ton objectif.");
    const g = { title, icon:fd.get('icon') || '🎯', note:(fd.get('note') || '').trim(), visibility:fd.get('visibility') || 'friends' };
    if (type === 'monthly') {
      g.target = Number(fd.get('mtarget')); g.unit = (fd.get('munit') || '').trim(); g.cumulate = fd.get('cumulate') === 'on';
      if (!(g.target > 0)) return fail('La cible mensuelle doit être un nombre supérieur à zéro.');
    }
    if (type === 'objective') {
      g.target = Number(fd.get('target')); g.unit = (fd.get('unit') || '').trim(); g.endDate = fd.get('endDate') || '';
      if (!(g.target > 0)) return fail('La cible doit être un nombre supérieur à zéro.');
    }
    if (type === 'deadline') { g.due = fd.get('due'); if (!g.due) return fail('Choisis une date limite.'); }
    if (type === 'routine') {
      g.mode = fd.get('mode'); g.days = fd.getAll('days').map(Number); g.perWeek = Number(fd.get('perWeek'));
      if (g.mode === 'days' && !g.days.length) return fail('Choisis au moins un jour de la semaine.');
      if (g.mode === 'count' && !(g.perWeek >= 1 && g.perWeek <= 7)) return fail('Choisis entre 1 et 7 fois par semaine.');
    }
    if (type === 'abstinence') { g.since = fd.get('since') || today(); }
    if (EXT[type]) { const e = EXT[type].parse(fd, g, g0); if (e) return fail(e); }
    if (!EXT[type]?.social) {
      g.buddy = fd.get('buddy') || null; g.buddyVerify = !!g.buddy && fd.get('bverify') === 'on'; g.buddyMiss = !!g.buddy && fd.get('bmiss') === 'on';
      if (g.buddy && g.buddy !== g0?.buddy) notify(g.buddy, `${me().name} compte sur toi comme binôme pour « ${title} ».`, { type:'verify' });

const groupsOf = u => u.goalGroups || (u.goalGroups = []);
const groupOfGoal = (u, gid) => { const id = (u.goalGroupOf || {})[gid]; return id && groupsOf(u).find(x => x.id === id) || null; };
function setGoalGroup(u, gid, grp){ u.goalGroupOf = u.goalGroupOf || {}; if (grp) u.goalGroupOf[gid] = grp; else delete u.goalGroupOf[gid]; }
function groupSelect(g, id = 'g-group'){

// Chaque paire d'amis a sa propre clé AES-256-GCM, tirée au hasard sur l'appareil au premier message.
// Les clés sont rangées à part (KEYSTORE_KEY), jamais dans la base ni dans les sauvegardes complètes :
// la base ne contient que des messages chiffrés, liés à leur conversation (données associées). PepsGoal Officiel écrit en clair.
const KEYSTORE_KEY = 'pepsgoal.keys.v1';

const pairId = (a, b) => [a, b].sort().join('|');

}
function ksSave(){ if (SANDBOX) return; try { localStorage.setItem(KEYSTORE_KEY, JSON.stringify(ksLoad())); } catch(e){ toast('Stockage plein : la clé de conversation n’a pas pu être enregistrée.', 'lock'); } }

      if (!k || typeof k.keyId !== 'string' || typeof k.k !== 'string' || !/^[A-Za-z0-9+/]{43}=$/.test(k.k) || cur.some(x => x.keyId === k.keyId)) continue;

// Nouvelle version de clé (un membre a quitté un groupe) : les anciennes restent pour relire l'historique

// Déchiffre les messages pas encore en cache, puis rafraîchit l'affichage

// Messages en clair des versions précédentes (et données d'exemple) : chiffrés une fois pour toutes
async function encryptLegacy(){

  for (const m of [...(db.messages || [])]) {
    if (m.official || m.e2e || !m.text) continue;

  await decryptPending();
}

/* ---- pièces jointes : chiffrées sur l'appareil avec une clé aléatoire, transmise dans le message chiffré ---- */
const ATT = new Map(), ATT_LOADING = new Set();   // id du message → URL locale (blob:) du fichier déchiffré
async function attEncrypt(blob){
  const key = crypto.getRandomValues(new Uint8Array(32)), iv = crypto.getRandomValues(new Uint8Array(12));
  const ck = await crypto.subtle.importKey('raw', key, 'AES-GCM', false, ['encrypt']);
  const ct = await crypto.subtle.encrypt({ name:'AES-GCM', iv }, ck, await blob.arrayBuffer());
  return { meta:{ alg:'gcm', k:b64e(key), iv:b64e(iv) }, data:b64e(ct) };
}
// Fichier déchiffré d'un message (la version connectée le télécharge depuis le serveur)
async function fetchAttachment(m, a){
  if (!a || a.alg !== 'gcm' || !m.att) return null;
  const ck = await crypto.subtle.importKey('raw', b64d(a.k), 'AES-GCM', false, ['decrypt']);
  return new Blob([await crypto.subtle.decrypt({ name:'AES-GCM', iv:b64d(a.iv) }, ck, b64d(m.att))], { type:a.mime || 'application/octet-stream' });
}
function attSrc(m, b){
  if (ATT.has(m.id)) return ATT.get(m.id);
  if (b?.a && !ATT_LOADING.has(m.id)) {
    ATT_LOADING.add(m.id);
    fetchAttachment(m, b.a).then(blob => { if (blob) { ATT.set(m.id, URL.createObjectURL(blob)); updateChat(); } })
      .catch(() => {}).finally(() => ATT_LOADING.delete(m.id));
  }
  return '';
}
const blobToDataUrl = blob => new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(String(r.result)); r.onerror = rej; r.readAsDataURL(blob); });
// Photo redimensionnée et compressée (côté le plus long : max px)
function shrinkImage(file, max, q){
  return new Promise((res, rej) => {
    const url = URL.createObjectURL(file), img = new Image();
    img.onload = () => {
      const k = Math.min(1, max / Math.max(img.naturalWidth, img.naturalHeight)), c = document.createElement('canvas');
      c.width = Math.max(1, Math.round(img.naturalWidth * k)); c.height = Math.max(1, Math.round(img.naturalHeight * k));
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url);
      c.toBlob(b => b ? res({ blob:b, w:c.width, h:c.height }) : rej(), 'image/jpeg', q);
    };
    img.onerror = () => { URL.revokeObjectURL(url); rej(); };
    img.src = url;
  });
}
function openPhotoViewer(src, alt){

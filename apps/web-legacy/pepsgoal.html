<title>PepsGoal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700;800&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* Layout: barre latérale vitrée + colonne principale sur desktop ; barre du haut + barre d'onglets en bas sur mobile. Des halos vifs flottent sous des panneaux givrés. */
:root{
  --font-display:"Unbounded","Arial Black",system-ui,sans-serif;
  --font-body:"Manrope","Segoe UI",system-ui,-apple-system,sans-serif;

  --bg:#ECEEFF;
  --blob-1:#FF8A3D; --blob-2:#FF3D96; --blob-3:#2BC8FF; --blob-4:#C6FF3D; --blob-op:.55;
  --ink:#0D0E2B; --ink-2:#34375F; --ink-3:#575A86;
  --glass:rgba(255,255,255,.58); --glass-strong:rgba(255,255,255,.86); --glass-edge:rgba(255,255,255,.95);
  --line:rgba(13,14,43,.13); --scrim:rgba(13,14,43,.38); --glass-card:rgba(255,255,255,.7);
  --shadow:0 14px 44px -16px rgba(40,24,110,.32);
  --flame:#FF4A12; --flame-2:#FFB000; --pink:#FF3D96; --on-accent:#10102A;
  --focus:#0057D9;
  --t-goal:#22D3FF; --t-goal-ink:#00627E;
  --t-deadline:#FF4FA3; --t-deadline-ink:#B0005A;
  --t-routine:#B6FF2E; --t-routine-ink:#3A7300;
  --t-abst:#A98BFF; --t-abst-ink:#5530CF;
  --t-month:#FFD23F; --t-month-ink:#7A4E00;
  --t-limit:#FF8A3D; --t-limit-ink:#A33D00; --t-dur:#2EF2B0; --t-dur-ink:#00704F; --t-proj:#4D9BFF; --t-proj-ink:#0B4FC2;
  --t-meas:#FF7AD9; --t-meas-ink:#A3007A; --t-group:#7CFF6B; --t-group-ink:#1F7A10; --t-duel:#FF5A5A; --t-duel-ink:#B3121F;
  --t-chal:#FFB000; --t-chal-ink:#8A5300; --t-prog:#7C8CFF; --t-prog-ink:#2F3FBF; --t-timed:#E3B98A; --t-timed-ink:#7A4B12;
  --ok:#1E8E3E; --danger:#C8102E;
  --r-lg:24px; --r-md:16px; --r-sm:12px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#07081A; --blob-op:.42;
  --ink:#F4F5FF; --ink-2:#C9CCF2; --ink-3:#9C9FD0;
  --glass:rgba(24,26,66,.55); --glass-strong:rgba(28,30,76,.9); --glass-edge:rgba(255,255,255,.14);
  --line:rgba(255,255,255,.13); --scrim:rgba(3,3,14,.62); --glass-card:rgba(24,26,66,.72);
  --shadow:0 18px 50px -18px rgba(0,0,0,.7);
  --focus:#6FE3FF;
  --t-goal-ink:#5FE0FF; --t-deadline-ink:#FF7DBB; --t-routine-ink:#C6FF5C; --t-abst-ink:#BFA8FF; --t-month-ink:#FFE07A;
  --t-limit-ink:#FFB07A; --t-dur-ink:#5FF5C4; --t-proj-ink:#8CBDFF; --t-meas-ink:#FF9FE4; --t-group-ink:#9DFF90; --t-duel-ink:#FF8A8A; --t-chal-ink:#FFC94D; --t-prog-ink:#A9B3FF; --t-timed-ink:#F0CFA6;
  --ok:#5BE38A; --danger:#FF6B81;
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#07081A; --blob-op:.42;
  --ink:#F4F5FF; --ink-2:#C9CCF2; --ink-3:#9C9FD0;
  --glass:rgba(24,26,66,.55); --glass-strong:rgba(28,30,76,.9); --glass-edge:rgba(255,255,255,.14);
  --line:rgba(255,255,255,.13); --scrim:rgba(3,3,14,.62); --glass-card:rgba(24,26,66,.72);
  --shadow:0 18px 50px -18px rgba(0,0,0,.7);
  --focus:#6FE3FF;
  --t-goal-ink:#5FE0FF; --t-deadline-ink:#FF7DBB; --t-routine-ink:#C6FF5C; --t-abst-ink:#BFA8FF; --t-month-ink:#FFE07A;
  --t-limit-ink:#FFB07A; --t-dur-ink:#5FF5C4; --t-proj-ink:#8CBDFF; --t-meas-ink:#FF9FE4; --t-group-ink:#9DFF90; --t-duel-ink:#FF8A8A; --t-chal-ink:#FFC94D; --t-prog-ink:#A9B3FF; --t-timed-ink:#F0CFA6;
  --ok:#5BE38A; --danger:#FF6B81;
  color-scheme:dark;
}

*{box-sizing:border-box}
html,body{min-height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px;border-radius:10px}
h1,h2,h3{margin:0;text-wrap:balance}
p{margin:0}
ul{margin:0;padding:0;list-style:none}
.muted{color:var(--ink-2)}
.small{font-size:13px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
/* barres de défilement masquées partout : le défilement reste actif (molette, tactile, clavier) */
html,body,*{scrollbar-width:none;-ms-overflow-style:none}
html::-webkit-scrollbar,body::-webkit-scrollbar,*::-webkit-scrollbar{display:none;width:0;height:0}

/* fond */
.backdrop{position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none}
.blob{position:absolute;border-radius:50%;opacity:var(--blob-op);will-change:transform;transform:translateZ(0)}
.b1{width:60vmax;height:60vmax;background:radial-gradient(closest-side,var(--blob-1),transparent);top:-24vmax;left:-22vmax}
.b2{width:54vmax;height:54vmax;background:radial-gradient(closest-side,var(--blob-2),transparent);top:12vh;right:-24vmax}
.b3{width:52vmax;height:52vmax;background:radial-gradient(closest-side,var(--blob-3),transparent);bottom:-26vmax;left:10vw}
.b4{width:30vmax;height:30vmax;background:radial-gradient(closest-side,var(--blob-4),transparent);top:2vh;left:40vw;opacity:calc(var(--blob-op)*.6)}

.glass{background:var(--glass);border:1px solid var(--glass-edge);-webkit-backdrop-filter:blur(16px) saturate(160%);backdrop-filter:blur(16px) saturate(160%);box-shadow:var(--shadow);border-radius:var(--r-lg)}
.card{padding:20px}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}
.card-h h2,.h2{font-family:var(--font-display);font-size:17px;font-weight:700;letter-spacing:-.01em}
.eyebrow{font-size:12px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-2)}
.count{font-weight:800;font-variant-numeric:tabular-nums;color:var(--ink-2)}

/* marque */
.logo{display:inline-flex;align-items:center;gap:8px;font-family:var(--font-display);font-weight:800;font-size:21px;letter-spacing:-.02em;color:var(--ink);text-decoration:none}
.logo .grad{background:linear-gradient(100deg,var(--flame-2),var(--flame) 45%,var(--pink));-webkit-background-clip:text;background-clip:text;color:transparent}
.logo svg{width:28px;height:28px}

/* boutons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:999px;padding:11px 18px;font-weight:800;font-size:14px;border:1px solid var(--line);background:var(--glass-strong);color:var(--ink);transition:transform .15s ease,box-shadow .15s ease}
.btn:hover{transform:translateY(-1px)}
.btn:active{transform:translateY(0) scale(.98)}
.btn svg{width:18px;height:18px}
.btn.sm{padding:8px 14px;font-size:13px}
.btn-primary{background:linear-gradient(120deg,var(--flame-2),var(--flame) 50%,var(--pink));color:var(--on-accent);border-color:transparent;box-shadow:0 8px 24px -10px var(--flame)}
.btn-ghost{background:transparent;border-color:transparent;color:var(--ink-2)}
.btn-danger{color:var(--danger);border-color:color-mix(in srgb,var(--danger) 40%,transparent);background:transparent}
.btn.block{width:100%}
.icon-btn{position:relative;display:inline-grid;place-items:center;width:42px;height:42px;border-radius:50%;border:1px solid var(--line);background:var(--glass-strong);color:var(--ink)}
.icon-btn svg{width:20px;height:20px}
.icon-btn.plain{background:transparent;border-color:transparent;width:36px;height:36px;color:var(--ink-2)}
.badge{position:absolute;top:-4px;right:-4px;min-width:20px;height:20px;padding:0 5px;border-radius:999px;background:var(--pink);color:var(--on-accent);font-size:11px;font-weight:800;display:grid;place-items:center;border:2px solid var(--bg)}
svg.i{fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

/* couleurs par type */
.t-objective{--c:var(--t-goal);--c-ink:var(--t-goal-ink)}
.t-deadline{--c:var(--t-deadline);--c-ink:var(--t-deadline-ink)}
.t-routine{--c:var(--t-routine);--c-ink:var(--t-routine-ink)}
.t-abstinence{--c:var(--t-abst);--c-ink:var(--t-abst-ink)}
.t-monthly{--c:var(--t-month);--c-ink:var(--t-month-ink)}
.t-limit{--c:var(--t-limit);--c-ink:var(--t-limit-ink)}
.t-duration{--c:var(--t-dur);--c-ink:var(--t-dur-ink)}
.t-project{--c:var(--t-proj);--c-ink:var(--t-proj-ink)}
.t-measure{--c:var(--t-meas);--c-ink:var(--t-meas-ink)}
.t-group{--c:var(--t-group);--c-ink:var(--t-group-ink)}
.t-duel{--c:var(--t-duel);--c-ink:var(--t-duel-ink)}
.t-challenge{--c:var(--t-chal);--c-ink:var(--t-chal-ink)}
.t-program{--c:var(--t-prog);--c-ink:var(--t-prog-ink)}
.t-timed{--c:var(--t-timed);--c-ink:var(--t-timed-ink)}
.row-acts{display:flex;align-items:center;gap:8px;flex:none}
.check[aria-disabled="true"]{opacity:.45;border-style:dashed;cursor:not-allowed}
.check.timer svg{opacity:1;stroke-width:2.6}
.check.timer.run{background:var(--c);color:var(--on-accent)}
.chip.pend{--c:var(--ink-3);--c-ink:var(--ink-2)}
.months li.over span:last-child{color:var(--danger)}
.months li.over .bar>i{background:var(--danger)}
.months li.cur{outline:2px solid var(--c);outline-offset:3px;border-radius:6px}
.months li.fut{opacity:.5}
.tasks{display:flex;flex-direction:column;gap:6px;margin-bottom:10px}
.tasks li{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:12px;background:color-mix(in srgb,var(--ink) 5%,transparent)}
.tasks label{flex:1;display:flex;align-items:center;gap:10px;cursor:pointer;min-width:0;font-weight:600}
.tasks input{width:20px;height:20px;accent-color:var(--t-proj);flex:none}
.tasks li.done span{text-decoration:line-through;color:var(--ink-3)}
.chart{width:100%;height:auto;display:block;margin-bottom:14px;overflow:visible}
.chart .grid{stroke:var(--line);stroke-width:1}
.chart .tick{fill:var(--ink-3);font-size:10px;font-family:var(--font-body);font-weight:700}
.chart .tgt{stroke:var(--ink-2);stroke-width:1.5;stroke-dasharray:4 4}
.spark{width:110px;height:32px;display:block}
.timer-big{display:flex;flex-direction:column;align-items:center;gap:6px;padding:18px;border-radius:var(--r-md);background:color-mix(in srgb,var(--c) 14%,transparent);margin-bottom:16px}
.timer-big b{font-family:var(--font-display);font-size:44px;font-variant-numeric:tabular-nums;color:var(--c-ink);line-height:1}
.timer-big .bar{width:100%}
.versus{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);align-items:center;gap:10px;text-align:center;margin-bottom:14px}
.versus .side{display:flex;flex-direction:column;align-items:center;gap:6px;min-width:0}
.versus .side span{font-weight:700;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:100%}
.versus b{font-family:var(--font-display);font-size:34px;font-variant-numeric:tabular-nums;line-height:1}
.versus .lead b{color:var(--c-ink)}
.versus .vs{font-family:var(--font-display);font-weight:800;color:var(--ink-3)}
.avstack{display:inline-flex;vertical-align:middle}
.avstack .av{margin-left:-6px;box-shadow:0 0 0 2px var(--glass-strong)}
.avstack .av:first-child{margin-left:0}
.pick-people{display:flex;flex-wrap:wrap;gap:8px}
.person-pick{position:relative;display:inline-flex;align-items:center;gap:8px;padding:5px 12px 5px 5px;border-radius:999px;border:2px solid var(--line);cursor:pointer;font-weight:700;font-size:13px}
.person-pick input{position:absolute;opacity:0;pointer-events:none}
.person-pick:has(input:checked){border-color:var(--c,var(--flame));background:color-mix(in srgb,var(--c,var(--flame)) 18%,transparent)}
.person-pick:has(input:focus-visible){outline:3px solid var(--focus)}
.chal{display:grid;grid-template-columns:repeat(auto-fill,minmax(34px,1fr));gap:5px;margin-bottom:8px}
.verify li{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);flex-wrap:wrap}
.verify li:last-child{border-bottom:0}
.verify .vt{flex:1;min-width:0;font-weight:600}
.verify .vt small{display:block;color:var(--ink-3)}
.types .tg-lab{grid-column:1/-1;margin:6px 0 -2px;font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3)}
.type-tile.wide{grid-column:1/-1}
/* groupes d'objectifs */
.grp-bar{margin-top:-6px}
.fchip .muted{font-weight:700;margin-left:2px}
.fchip.ghost{background:transparent;border-style:dashed;display:inline-flex;align-items:center;gap:6px}
.fchip svg{width:15px;height:15px;vertical-align:-2px;margin-right:4px}
.fchip.ghost svg{margin-right:0}
.grp-sec{display:flex;flex-direction:column;gap:12px}
.grp-h{display:flex;align-items:center;gap:10px;padding:6px 4px;border:0;background:none;text-align:left;width:100%}
.grp-h b{font-family:var(--font-display);font-size:16px}
.grp-ic{display:grid;place-items:center;width:34px;height:34px;border-radius:11px;background:var(--glass-strong);border:1px solid var(--line);font-size:18px}
.grp-h .chev{margin-left:auto;color:var(--ink-3);font-size:14px}
.grp-list{display:flex;flex-direction:column;gap:8px}
.grp-list li{display:flex;align-items:center;gap:8px}
.grp-list input{flex:1;min-width:0}
.grp-icon-sel{width:auto;padding:8px 6px;font-size:18px}
/* modération */
.st-ban{--c:var(--danger);--c-ink:var(--danger)}
.st-warn{--c:var(--t-limit);--c-ink:var(--t-limit-ink)}
.mod-list{display:flex;flex-direction:column;gap:10px}
.mod-post{display:flex;flex-direction:column;gap:8px;padding:12px;border-radius:var(--r-md);background:var(--glass-strong);border:1px solid var(--line)}
.mp-h{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.mod-block{display:flex;flex-direction:column;align-items:flex-start;gap:6px;padding:12px;border-radius:var(--r-md);border:1px solid var(--line)}
.mod-block .set-row{width:100%}
.mod-block.danger{border-color:color-mix(in srgb,var(--danger) 45%,transparent)}
.ban-card{border-color:color-mix(in srgb,var(--danger) 45%,transparent)}
.ban-card h2{display:flex;align-items:center;gap:8px;color:var(--danger)}
.ban-card h2 svg{width:20px;height:20px}
.pend-post{border:2px dashed var(--t-limit)}
.post-tools{display:flex;gap:2px}
.nav-a .nb,.tab .nb{margin-left:auto;min-width:20px;height:20px;padding:0 6px;border-radius:999px;background:var(--pink);color:var(--on-accent);font-size:11px;font-weight:800;display:inline-grid;place-items:center}
.tab{position:relative}
.tab .nb{position:absolute;top:2px;right:calc(50% - 22px);margin:0}
.badge.static{position:static;border:0}
/* messagerie */
.chat-log{display:flex;flex-direction:column;gap:6px;height:min(52vh,440px);overflow-y:auto;padding:4px 2px;margin-bottom:12px}
.msg{max-width:78%;padding:8px 12px;border-radius:18px;font-size:14.5px;line-height:1.4;overflow-wrap:anywhere}
.msg small{display:block;font-size:10.5px;opacity:.72;margin-top:2px;text-align:right}
.msg.me{align-self:flex-end;background:linear-gradient(120deg,var(--flame-2),var(--flame) 60%,var(--pink));color:var(--on-accent);border-bottom-right-radius:5px}
.msg.them{align-self:flex-start;background:color-mix(in srgb,var(--ink) 8%,transparent);border-bottom-left-radius:5px}
.chat-day{align-self:center;font-size:11.5px;font-weight:800;color:var(--ink-3);text-transform:uppercase;letter-spacing:.08em;margin:6px 0 2px}
.chat-empty{margin:auto;text-align:center}
.typing{display:flex;gap:4px;padding:12px 14px}
.typing i{width:7px;height:7px;border-radius:50%;background:var(--ink-3)}
.who.conv small.unread{color:var(--ink);font-weight:800}
.person .badge.static{flex:none}
.mod-tabs{padding-bottom:2px}
/* performances : les cartes du contenu n'ont pas de flou d'arrière-plan (le fond est déjà flou) ; seuls les bandeaux et fenêtres le gardent */
.main .glass:not(.topbar){-webkit-backdrop-filter:none;backdrop-filter:none;background:var(--glass-card)}
.post{content-visibility:auto;contain-intrinsic-size:auto 280px}
.check{position:relative}
.feed-more{margin-top:4px}
.net-note{border-style:solid;border-color:var(--ink-3)}
.net-pill{color:var(--ink-2)}
/* documents légaux */
.legal{display:flex;flex-direction:column;gap:6px}
.legal h3{font-family:var(--font-display);font-size:15px;font-weight:700;margin:14px 0 2px;scroll-margin-top:12px}
.legal p,.legal li{color:var(--ink-2);font-size:14.5px;line-height:1.6}
.legal p+p{margin-top:8px}
.legal ul{list-style:disc;padding-left:20px;display:flex;flex-direction:column;gap:4px;margin:6px 0}
.legal b{color:var(--ink)}
.legal-toc{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 4px}
.legal-toc a{font-size:12.5px;font-weight:700;color:var(--ink-2);padding:4px 10px;border-radius:999px;border:1px solid var(--line);text-decoration:none}
.legal-toc a:hover{color:var(--ink);border-color:var(--ink-3)}
.legal-other{display:flex;flex-wrap:wrap;gap:8px;margin-top:18px;padding-top:14px;border-top:1px solid var(--line)}
.linkbtn{background:none;border:0;padding:0;color:inherit;font:inherit;font-weight:700;text-decoration:underline;text-underline-offset:2px;cursor:pointer}
.auth-legal{font-size:12.5px;color:var(--ink-3);line-height:1.5}
/* barre de titre : ne s'élargit jamais */
.tb-brand{min-width:0;overflow:hidden}
.tb-actions{flex:none}
.tb-actions > *{flex:none}
@media (max-width:400px){ .topbar{padding-left:14px} .topbar .logo{font-size:18px} .topbar .logo svg{width:24px;height:24px} .tb-actions{gap:8px} }
/* stories */
.stories-card{padding:14px 16px}
.stories{display:flex;gap:14px;overflow-x:auto;align-items:flex-start}
.st-item{position:relative;flex:none;display:flex;flex-direction:column;align-items:center;gap:5px;width:70px;font-size:12px;font-weight:700;color:var(--ink-2);text-align:center}
.st-item > span{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.st-btn{padding:0;border:0;background:none;border-radius:50%}
.st-ring{display:grid;place-items:center;padding:3px;border-radius:50%;background:conic-gradient(from 200deg,var(--flame-2),var(--flame),var(--pink),var(--flame-2))}
.st-ring .av{box-shadow:0 0 0 3px var(--bg)}
.st-ring.seen{background:var(--line)}
.st-ring.none{background:transparent;border:2px dashed var(--line);padding:1px}
.st-add{position:absolute;top:44px;right:2px;display:grid;place-items:center;width:24px;height:24px;border-radius:50%;border:2px solid var(--bg);background:var(--ink);color:var(--bg);padding:0}
.st-add svg{width:14px;height:14px;stroke-width:3}
.st-empty{align-self:center;max-width:260px}
.feed-top{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.sv{background:#05060F;color:#fff;cursor:pointer;-webkit-user-select:none;user-select:none;padding-top:calc(78px + env(safe-area-inset-top,0px))}
.sv .st-bars i{background:rgba(255,255,255,.28);overflow:hidden}
.sv .st-bars i.done{background:rgba(255,255,255,.28)}
.sv .st-bars i b{display:block;height:100%;width:0;background:#fff;border-radius:inherit}
.sv .st-bars i.done b{width:100%}
.sv-head{position:absolute;top:calc(28px + env(safe-area-inset-top,0px));left:16px;right:70px;display:flex;align-items:center;gap:10px;z-index:2}
.sv-head small{display:block;color:rgba(255,255,255,.75);font-size:12px}
.sv-body{display:flex;flex-direction:column;align-items:center;gap:14px;width:min(420px,100%);max-height:100%}
.sv-media{width:100%;aspect-ratio:9/14;max-height:66vh;border-radius:24px;overflow:hidden;background:#000;display:grid;place-items:center}
.sv-media img{width:100%;height:100%;object-fit:contain}
.sv-card{width:100%;aspect-ratio:9/14;max-height:66vh;border-radius:24px;padding:24px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center;color:#10102A;overflow:hidden}
.sv-card .eyebrow{color:rgba(16,16,42,.72)}
.sv-card p{color:rgba(16,16,42,.85)}
.sv-card .st-card{text-align:left}
.sv-card .bar{width:100%;background:rgba(16,16,42,.15)}
.sv-card .bar>i{background:#10102A}
.sv-cap{font-size:16px;font-weight:600;text-align:center;color:#fff;max-width:40ch}
.sv-foot{position:absolute;bottom:calc(16px + env(safe-area-inset-bottom,0px));left:0;right:0;display:flex;justify-content:center;gap:10px}
.sv .btn{background:rgba(255,255,255,.14);color:#fff;border-color:rgba(255,255,255,.3)}
.sv-seen{position:absolute;left:16px;right:16px;bottom:calc(66px + env(safe-area-inset-bottom,0px));max-width:420px;margin:auto;padding:16px;border-radius:20px;background:rgba(20,22,50,.96);display:flex;flex-direction:column;gap:10px;cursor:default}
.sv-seen ul{display:flex;flex-direction:column;gap:8px;max-height:30vh;overflow:auto}
.sv-seen li{display:flex;align-items:center;gap:10px}
.sv-preview{display:flex;justify-content:center}
.sv-preview > *{width:min(240px,100%)}
.sv-preview .sv-card{padding:16px;gap:6px}
.sv-preview .st-emoji{font-size:48px}
.sv-preview .st-big{font-size:40px!important}
.sv-preview .st-mid{font-size:19px}
.sv-preview .st-card{padding:10px;gap:8px}
.sv-preview .st-card b{font-size:16px}
.sv-empty{aspect-ratio:9/14;border-radius:24px;border:2px dashed var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;color:var(--ink-3);padding:16px;text-align:center}
.sv-empty svg{width:32px;height:32px}
/* paramètres */
.set-cats{display:flex;flex-direction:column}
.set-cat{display:flex;align-items:center;gap:14px;padding:14px 8px;border:0;border-bottom:1px solid var(--line);background:none;text-align:left;width:100%}
.set-cat:last-child{border-bottom:0}
.set-cat:hover{background:color-mix(in srgb,var(--ink) 4%,transparent);border-radius:12px}
.sc-ic{flex:none;display:grid;place-items:center;width:42px;height:42px;border-radius:14px;background:color-mix(in srgb,var(--flame) 18%,transparent);color:var(--ink)}
.sc-ic svg{width:21px;height:21px}
.sc-txt{flex:1;min-width:0}
.sc-txt b{display:block;font-weight:800}
.sc-txt small{color:var(--ink-2)}
.set-cat .chev{font-size:22px;color:var(--ink-3)}
.set-title{font-family:var(--font-display);font-size:22px;font-weight:800;letter-spacing:-.02em}
.prof-main{min-width:0}
.prof-top{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.mod-tabs .fchip{display:inline-flex;align-items:center;gap:6px}
.mod-tabs .fchip svg{width:16px;height:16px;margin:0}
.mod-tabs .nb{min-width:20px;height:20px;padding:0 6px;border-radius:999px;background:var(--pink);color:var(--on-accent);font-size:11px;font-weight:800;display:inline-grid;place-items:center}
.mod-tabs .fchip[aria-pressed="true"] .nb{background:var(--bg);color:var(--ink)}
.maint-note{border-style:solid;border-color:var(--t-limit);background:color-mix(in srgb,var(--t-limit) 12%,transparent);color:var(--ink)}
.demo-note svg{width:18px;height:18px;flex:none}
.verified{display:inline-grid;place-items:center;width:17px;height:17px;border-radius:50%;background:var(--t-proj);color:var(--on-accent);margin-left:5px;vertical-align:-3px}
.verified svg{width:11px;height:11px;stroke-width:3.6}
.msg .chip{display:flex;width:max-content;margin-bottom:5px}
.msg.official{background:color-mix(in srgb,var(--t-proj) 14%,var(--glass-strong));border:1px solid color-mix(in srgb,var(--t-proj) 35%,transparent)}
.who-h{display:flex;align-items:center;gap:8px}
.person.pinned{background:color-mix(in srgb,var(--t-proj) 9%,transparent);border-radius:14px;padding-inline:8px;border-bottom-color:transparent}
.months{display:flex;flex-direction:column;gap:8px;margin-bottom:16px}
.months li{display:grid;grid-template-columns:72px minmax(0,1fr) auto;gap:10px;align-items:center;font-size:13.5px;font-weight:700}
.months li span:last-child{font-variant-numeric:tabular-nums;color:var(--ink-2)}
.months li.hit span:last-child{color:var(--c-ink)}
.cumul{display:flex;align-items:baseline;gap:8px;padding:12px 14px;border-radius:var(--r-md);border:1.5px dashed var(--c);margin-bottom:16px}
.cumul b{font-family:var(--font-display);font-size:22px;color:var(--c-ink);font-variant-numeric:tabular-nums}
.check-row{display:flex;align-items:center;gap:12px;justify-content:space-between}
.check-row span:first-child{font-weight:700}
.chip{display:inline-flex;align-items:center;gap:5px;padding:2px 9px;border-radius:999px;font-size:12px;font-weight:800;background:color-mix(in srgb,var(--c,var(--ink-3)) 22%,transparent);color:var(--c-ink,var(--ink-2));white-space:nowrap}
.chip svg{width:13px;height:13px}
.vis{display:inline-flex;align-items:center;gap:4px;font-size:12px;color:var(--ink-3);font-weight:700}
.vis svg{width:13px;height:13px}
.demo{display:inline-block;margin-left:6px;padding:0 6px;border-radius:6px;font-size:10px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;border:1px dashed var(--ink-3);color:var(--ink-3);vertical-align:2px}

/* shell */
.shell{position:relative;z-index:1;display:grid;grid-template-columns:248px minmax(0,1fr);gap:24px;max-width:1180px;margin:0 auto;padding-inline:20px;padding-block:20px}
.side{position:sticky;top:calc(20px + env(safe-area-inset-top,0px));align-self:start;height:calc(100vh - 40px);display:flex;flex-direction:column;gap:6px;padding:22px 14px}
.side .logo{padding:0 10px 18px}
.nav-a{display:flex;align-items:center;gap:12px;padding:11px 14px;border-radius:14px;border:0;background:transparent;color:var(--ink-2);font-weight:700;text-align:left;width:100%}
.nav-a svg{width:21px;height:21px}
.nav-a:hover{background:color-mix(in srgb,var(--ink) 6%,transparent);color:var(--ink)}
.nav-a[aria-current="page"]{background:var(--ink);color:var(--bg)}
.side-foot{margin-top:auto;display:flex;flex-direction:column;gap:10px}
.me-mini{display:flex;align-items:center;gap:10px;padding:10px;border-radius:16px;border:1px solid var(--line);background:transparent;text-align:left;width:100%}
.me-mini small{display:block;color:var(--ink-3);font-size:12px}
.main{min-width:0;display:flex;flex-direction:column;gap:18px;padding-bottom:40px}
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;display:flex;align-items:center;gap:12px;padding:10px 12px 10px 20px;border-radius:20px}
.tb-title{font-family:var(--font-display);font-size:18px;font-weight:700;flex:1;min-width:0}
.tb-brand{display:none;flex:1}
.tb-actions{display:flex;align-items:center;gap:10px}
.tabbar{display:none}
.fab{display:none}

@media (max-width:860px){
  .shell{grid-template-columns:minmax(0,1fr);padding-inline:16px;padding-block:10px 0}
  .side{display:none}
  .tb-title{display:none}
  .tb-brand{display:block}
  .desktop-only{display:none!important}
  .main{padding-bottom:120px}
  .tabbar{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;position:fixed;z-index:30;left:10px;right:10px;bottom:calc(10px + env(safe-area-inset-bottom,0px));padding:6px;border-radius:24px}
  .tab{display:flex;flex-direction:column;align-items:center;gap:2px;padding:7px 2px;border-radius:18px;border:0;background:transparent;color:var(--ink-2);font-size:11px;font-weight:800}
  .tab svg{width:22px;height:22px}
  .tab[aria-current="page"]{background:var(--ink);color:var(--bg)}
  .fab{display:grid;place-items:center;position:fixed;z-index:29;right:20px;bottom:calc(96px + env(safe-area-inset-bottom,0px));width:58px;height:58px;border-radius:50%;border:0;background:linear-gradient(120deg,var(--flame-2),var(--flame) 50%,var(--pink));color:var(--on-accent);box-shadow:0 12px 30px -8px var(--flame)}
  .fab svg{width:26px;height:26px;stroke-width:2.6}
}

/* avatar */
.av{--s:40px;flex:none;display:inline-grid;place-items:center;width:var(--s);height:var(--s);border-radius:50%;color:#10102A;font-weight:800;font-size:calc(var(--s)*.38);font-family:var(--font-display);letter-spacing:-.02em;box-shadow:inset 0 0 0 2px rgba(255,255,255,.45);overflow:hidden}
.av.photo{padding:max(2px,calc(var(--s)*.05))}
.av img{width:100%;height:100%;object-fit:cover;border-radius:50%;display:block}
.av svg{width:56%;height:56%;fill:none;stroke:#10102A;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.av .emo{font-size:calc(var(--s)*.54);line-height:1;font-family:"Segoe UI Emoji","Apple Color Emoji","Noto Color Emoji",sans-serif}
.av-btn{position:relative;padding:0;border:0;background:none;border-radius:50%}
.av-btn .edit{position:absolute;right:-2px;bottom:-2px;display:grid;place-items:center;width:28px;height:28px;border-radius:50%;background:var(--ink);color:var(--bg);border:2px solid var(--bg)}
.av-btn .edit svg{width:14px;height:14px}
.av-preview{display:grid;place-items:center;padding:6px 0 18px}
.swatches{display:flex;flex-wrap:wrap;gap:10px}
.swatches label{position:relative}
.swatches input{position:absolute;opacity:0;pointer-events:none}
.sw{display:block;width:40px;height:40px;border-radius:50%;border:3px solid transparent;box-shadow:inset 0 0 0 2px rgba(255,255,255,.45),0 0 0 1px var(--line);cursor:pointer;padding:0}
.swatches input:checked+.sw,.sw[aria-pressed="true"]{border-color:var(--ink);box-shadow:inset 0 0 0 3px var(--bg)}
.swatches input:focus-visible+.sw{outline:3px solid var(--focus);outline-offset:2px}
.pick-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(48px,1fr));gap:8px}
.pick{display:grid;place-items:center;aspect-ratio:1;max-width:100%;border-radius:14px;border:2px solid transparent;background:color-mix(in srgb,var(--ink) 6%,transparent);font-size:24px;color:var(--ink)}
.pick svg{width:24px;height:24px}
.pick[aria-pressed="true"]{border-color:var(--flame);background:color-mix(in srgb,var(--flame) 16%,transparent)}
.freeze-pill{display:inline-flex;align-items:center;gap:3px;font-weight:800;font-variant-numeric:tabular-nums;font-size:13px;color:var(--t-goal-ink)}
.freeze-pill svg{width:18px;height:18px;stroke-width:2.4}
.wd.frozen{color:var(--t-goal-ink)}
.wd.frozen svg.i{width:22px;height:22px;stroke-width:2.4}
.gel-card{display:flex;align-items:center;gap:16px}
.gel-ico{flex:none;display:grid;place-items:center;width:64px;height:64px;border-radius:20px;background:color-mix(in srgb,var(--t-goal) 22%,transparent);color:var(--t-goal-ink)}
.gel-ico svg{width:34px;height:34px;stroke-width:2.2}
.gel-card .lvl b{font-family:var(--font-display)}
/* tutoriel */
.tuto{display:flex;flex-direction:column;gap:16px;text-align:center}
.tuto-top{display:flex;justify-content:space-between;align-items:center}
.tuto-visual{display:grid;place-items:center;min-height:170px;padding:16px;border-radius:var(--r-lg);background:color-mix(in srgb,var(--flame) 10%,transparent);border:1px solid var(--line)}
.tuto h2{font-family:var(--font-display);font-size:22px;font-weight:800;letter-spacing:-.02em}
.tuto p{color:var(--ink-2);max-width:44ch;margin-inline:auto}
.tuto .steps{display:flex;gap:6px;justify-content:center}
.tuto .steps i{width:8px;height:8px;border-radius:999px;background:color-mix(in srgb,var(--ink) 18%,transparent);transition:width .2s}
.tuto .steps i.on{width:24px;background:var(--flame)}
.tuto-types{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;width:100%;text-align:left}
.tuto-types div{display:flex;align-items:center;gap:8px;padding:10px;border-radius:14px;background:var(--glass-strong);border-left:5px solid var(--c);font-weight:800;font-size:13.5px}
.tuto-types svg{width:20px;height:20px;color:var(--c-ink)}
.gel-big{position:relative;display:grid;place-items:center;width:110px;height:110px;border-radius:32px;background:color-mix(in srgb,var(--t-goal) 25%,transparent);color:var(--t-goal-ink)}
.gel-big svg{width:60px;height:60px;stroke-width:2}
.gel-big b{position:absolute;right:-12px;bottom:-10px;font-family:var(--font-display);font-size:22px;padding:4px 10px;border-radius:999px;background:var(--ink);color:var(--bg)}

/* aujourd'hui */
.hero{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:20px;align-items:center;padding:26px}
.hero-main{display:flex;flex-direction:column;gap:10px;min-width:0}
.hello{font-family:var(--font-display);font-size:clamp(26px,4.4vw,38px);font-weight:800;letter-spacing:-.03em;line-height:1.05}
.hero-flame{display:grid;justify-items:center;gap:0;min-width:130px;text-align:center}
.hero-flame .fl{width:92px;height:92px;filter:drop-shadow(0 10px 22px color-mix(in srgb,var(--flame) 60%,transparent))}
.hero-flame.dim .fl{filter:grayscale(1) opacity(.45)}
.streak-num{font-family:var(--font-display);font-size:44px;font-weight:800;line-height:1;font-variant-numeric:tabular-nums;margin-top:-6px}
.streak-lbl{font-size:12px;font-weight:800;color:var(--ink-2);text-transform:uppercase;letter-spacing:.08em}
.week{display:grid;grid-template-columns:repeat(7,minmax(0,44px));gap:6px;margin-top:6px}
.wd{display:grid;justify-items:center;gap:3px;padding:6px 0;border-radius:12px;border:1px solid transparent;font-size:11px;font-weight:800;color:var(--ink-3)}
.wd svg{width:22px;height:22px}
.wd.off svg{filter:grayscale(1) opacity(.3)}
.wd.fut{opacity:.55}
.wd.today{border-color:var(--ink);color:var(--ink)}
@media (prefers-reduced-motion:no-preference){
  .hero-flame.lit .fl{animation:flick 2.4s ease-in-out infinite;transform-origin:50% 90%;will-change:transform}
  @keyframes flick{0%,100%{transform:scale(1) rotate(0)}30%{transform:scale(1.05,.97) rotate(-2deg)}60%{transform:scale(.97,1.04) rotate(2deg)}}
}
.grid-2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:18px}
@media (max-width:700px){.grid-2{grid-template-columns:minmax(0,1fr)}.hero{grid-template-columns:minmax(0,1fr)}.hero-flame{grid-row:1;justify-self:start;grid-template-columns:auto auto;align-items:center;column-gap:12px;text-align:left}.hero-flame .fl{grid-row:span 2;width:64px;height:64px}.streak-num{margin:0;font-size:38px}}
.ring-wrap{display:flex;align-items:center;gap:18px}
.ring{width:108px;height:108px;flex:none}
.ring .trk{stroke:color-mix(in srgb,var(--ink) 10%,transparent)}
.ring-txt{font-family:var(--font-display);font-weight:800;font-size:22px;fill:var(--ink)}
.lvl{display:flex;flex-direction:column;gap:6px;min-width:0;flex:1}
.lvl b{font-family:var(--font-display);font-size:16px}
.bar{height:10px;border-radius:999px;background:color-mix(in srgb,var(--ink) 10%,transparent);overflow:hidden}
.bar>i{display:block;height:100%;border-radius:inherit;background:var(--c,linear-gradient(90deg,var(--flame-2),var(--flame),var(--pink)))}
.board li{display:flex;align-items:center;gap:10px;padding:7px 0;border-bottom:1px solid var(--line)}
.board li:last-child{border-bottom:0}
.board .rank{width:18px;font-weight:800;color:var(--ink-3);font-variant-numeric:tabular-nums}
.board .nm{flex:1;min-width:0;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;background:none;border:0;padding:0;text-align:left}
.board .fc{display:inline-flex;align-items:center;gap:3px;font-weight:800;font-variant-numeric:tabular-nums}
.board .fc svg{width:18px;height:18px}
.board .me-row{background:color-mix(in srgb,var(--flame) 16%,transparent);border-radius:12px;padding-inline:6px;border-bottom-color:transparent}

.items{display:flex;flex-direction:column;gap:10px}
.item{display:flex;align-items:center;gap:12px;padding:10px 10px 10px 12px;border-radius:var(--r-md);background:var(--glass-strong);border:1px solid var(--line);border-left:5px solid var(--c)}
.item-main{flex:1;min-width:0;display:flex;align-items:center;gap:12px;background:none;border:0;padding:0;text-align:left}
.gi{flex:none;display:grid;place-items:center;width:44px;height:44px;border-radius:14px;font-size:22px;background:color-mix(in srgb,var(--c) 26%,transparent)}
.item-txt{display:flex;flex-direction:column;gap:3px;min-width:0}
.item-txt b{font-weight:800;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item-txt small{display:flex;flex-wrap:wrap;align-items:center;gap:6px;color:var(--ink-2);font-size:13px;font-weight:600}
.item.done .item-txt b{text-decoration:line-through;text-decoration-thickness:2px;text-decoration-color:var(--c)}
.check{flex:none;display:grid;place-items:center;width:50px;height:50px;border-radius:50%;border:3px solid var(--c);background:transparent;color:var(--c-ink);transition:transform .15s ease,background .15s ease}
.check svg{width:24px;height:24px;stroke-width:3;opacity:.35}
.check:hover{transform:scale(1.06)}
.check.on{background:var(--c);color:var(--on-accent)}
.check.on svg{opacity:1}
.mini-btn{flex:none;border-radius:999px;border:2px solid var(--c);background:transparent;color:var(--c-ink);font-weight:800;padding:8px 12px;font-size:13px}
.countdown{font-weight:800;font-variant-numeric:tabular-nums}
.urgent{color:var(--danger)}
.empty{display:grid;justify-items:center;gap:10px;text-align:center;padding:26px 12px;color:var(--ink-2)}
.empty b{color:var(--ink);font-family:var(--font-display);font-size:16px}
.starters{display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:12px}
.starter{display:flex;flex-direction:column;align-items:flex-start;gap:6px;padding:16px;border-radius:var(--r-md);border:1px solid var(--line);background:var(--glass-strong);text-align:left;border-top:5px solid var(--c)}
.starter svg{width:24px;height:24px;color:var(--c-ink)}
.starter b{font-family:var(--font-display);font-size:14px}
.starter small{color:var(--ink-2);font-size:12.5px}

/* objectifs */
.filters{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.filters::-webkit-scrollbar{display:none}
.fchip{flex:none;padding:8px 14px;border-radius:999px;border:1px solid var(--line);background:var(--glass-strong);font-weight:800;font-size:13px;color:var(--ink-2)}
.fchip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.ggrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.gcard{display:flex;flex-direction:column;gap:12px;padding:18px;border-radius:var(--r-lg);text-align:left;border:1px solid var(--glass-edge);position:relative;overflow:hidden}
.gcard::before{content:"";position:absolute;inset:0 0 auto 0;height:5px;background:var(--c)}
.gcard-h{display:flex;align-items:flex-start;gap:12px}
.gcard-h b{font-weight:800;font-size:16px;line-height:1.25}
.gcard .big{display:flex;align-items:baseline;gap:8px}
.gcard .big span:first-child{font-family:var(--font-display);font-weight:800;font-size:30px;font-variant-numeric:tabular-nums;color:var(--c-ink)}
.gcard .big span:last-child{font-weight:700;color:var(--ink-2);font-size:13px}
.gcard-f{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
.dots{display:flex;gap:4px}
.dots i{width:12px;height:12px;border-radius:4px;background:color-mix(in srgb,var(--ink) 10%,transparent)}
.dots i.on{background:var(--c)}
.dots i.rel{background:var(--danger)}

/* feed */
.composer{display:flex;flex-direction:column;gap:12px}
.composer-top{display:flex;gap:12px;align-items:flex-start}
textarea,input[type=text],input[type=password],input[type=number],input[type=date],input[type=time],input[type=search],select{width:100%;border-radius:14px;border:1.5px solid var(--line);background:var(--glass-strong);padding:11px 14px;color:var(--ink)}
textarea{resize:vertical;min-height:80px}
textarea:focus,input:focus,select:focus{outline:none;border-color:var(--focus);box-shadow:0 0 0 3px color-mix(in srgb,var(--focus) 25%,transparent)}
.composer-f{display:flex;flex-wrap:wrap;align-items:center;gap:10px;justify-content:space-between}
.composer-f .opts{display:flex;flex-wrap:wrap;gap:10px;align-items:center;flex:1;min-width:0}
.composer-f select{width:auto;max-width:100%;padding:8px 12px;font-size:13px;font-weight:700}
.seg{display:inline-flex;padding:4px;gap:4px;border-radius:999px;background:color-mix(in srgb,var(--ink) 8%,transparent)}

.attach{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:var(--r-md);border:1px solid var(--line);background:color-mix(in srgb,var(--c) 12%,var(--glass-strong));text-align:left;width:100%}

.comments{display:flex;flex-direction:column;gap:8px}

.gform{display:flex;flex-direction:column;gap:16px}

.type-tile{position:relative;display:flex;flex-direction:column;gap:3px;padding:12px 14px;border-radius:var(--r-md);border:2px solid var(--line);background:var(--glass);cursor:pointer}
.type-tile input{position:absolute;opacity:0;pointer-events:none}
.type-tile svg{width:22px;height:22px;color:var(--c-ink)}
.type-tile b{font-weight:800}
.type-tile small{font-size:12px;color:var(--ink-2);line-height:1.35}
.type-tile:has(input:checked){border-color:var(--c);background:color-mix(in srgb,var(--c) 18%,var(--glass-strong))}

.emoji-pick{display:flex;flex-wrap:wrap;gap:6px}
.emoji-pick label{position:relative}
.emoji-pick input{position:absolute;opacity:0;pointer-events:none}
.emoji-pick span{display:grid;place-items:center;width:42px;height:42px;border-radius:12px;font-size:21px;border:2px solid transparent;background:color-mix(in srgb,var(--ink) 6%,transparent);cursor:pointer}
.emoji-pick input:checked+span{border-color:var(--flame);background:color-mix(in srgb,var(--flame) 14%,transparent)}
.emoji-pick input:focus-visible+span{outline:3px solid var(--focus)}
.daychips{display:flex;gap:6px;flex-wrap:wrap}
.daychips label{position:relative}
.daychips input{position:absolute;opacity:0;pointer-events:none}
.daychips span{display:grid;place-items:center;width:42px;height:42px;border-radius:50%;font-weight:800;border:2px solid var(--line);cursor:pointer}

.daychips input:focus-visible+span{outline:3px solid var(--focus)}
.form-err{color:var(--danger);font-weight:700;font-size:13.5px}
.sheet-f{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap}
.detail-hero{display:flex;align-items:center;gap:14px;padding:16px;border-radius:var(--r-md);background:color-mix(in srgb,var(--c) 18%,transparent);margin-bottom:16px}

.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px}
.cal .hd{font-size:11px;font-weight:800;color:var(--ink-3);text-align:center}
.cal-c{display:grid;place-items:center;aspect-ratio:1;border-radius:10px;font-size:12px;font-weight:700;color:var(--ink-3);background:color-mix(in srgb,var(--ink) 5%,transparent);max-width:100%}
.cal-c.on{background:var(--c);color:var(--on-accent)}
.cal-c.miss{background:transparent;border:2px dashed color-mix(in srgb,var(--ink) 25%,transparent)}
.cal-c.pending{background:transparent;border:2px solid var(--c)}
.cal-c.relapse{background:var(--danger);color:#fff}
.cal-c.fut{opacity:.35}
.cal-c.is-today{box-shadow:0 0 0 2px var(--ink)}
.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:12px;color:var(--ink-2);font-weight:700;margin-top:8px}
.legend i{display:inline-block;width:12px;height:12px;border-radius:4px;vertical-align:-2px;margin-right:4px}
.dl{display:grid;grid-template-columns:auto minmax(0,1fr);gap:6px 14px;font-size:14px;margin:14px 0}
.dl dt{color:var(--ink-3);font-weight:700}
.dl dd{margin:0;font-weight:700}
.quick{display:flex;gap:8px;flex-wrap:wrap}
.notif{display:flex;gap:12px;padding:12px;border-radius:var(--r-md);align-items:flex-start}
.notif.unread{background:color-mix(in srgb,var(--flame) 10%,transparent)}
.notif .nic{flex:none;display:grid;place-items:center;width:36px;height:36px;border-radius:12px;background:color-mix(in srgb,var(--ink) 7%,transparent)}
.notif .nic svg{width:19px;height:19px}
.notif p{font-weight:600}

/* auth */
.auth{position:relative;z-index:1;min-height:100vh;display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,440px);gap:40px;align-items:center;max-width:1100px;margin:0 auto;padding-inline:20px;padding-block:32px}
.auth-hero{display:flex;flex-direction:column;gap:22px}

.auth-hero h1 em{font-style:normal;background:linear-gradient(100deg,var(--flame-2),var(--flame) 45%,var(--pink));-webkit-background-clip:text;background-clip:text;color:transparent}

/* récaps (accès) */
.recap-row{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.recap-btn{display:flex;flex-direction:column;align-items:flex-start;gap:2px;padding:14px;border-radius:var(--r-md);border:0;color:#10102A;text-align:left;background:var(--rb);min-width:0}

.recap-btn span{font-size:12px;font-weight:700;opacity:.82}
.recap-btn svg{width:22px;height:22px;margin-bottom:4px}
.perfect-chip{display:inline-flex;align-items:center;gap:6px;margin-top:4px;padding:6px 12px;border-radius:999px;border:0;font-weight:800;font-size:12.5px;background:linear-gradient(120deg,var(--flame-2),var(--flame) 50%,var(--pink));color:var(--on-accent)}
.perfect-chip svg{width:15px;height:15px}

/* plein écran : journée parfaite et récaps (univers volontairement unique, indépendant du thème) */
.fs{position:fixed;inset:0;z-index:100;display:grid;place-items:center;overflow:hidden;color:#fff;background:radial-gradient(120% 80% at 50% 0%,color-mix(in srgb,var(--flame) 55%,#0B0B22) 0%,#0B0B22 72%);padding:calc(56px + env(safe-area-inset-top,0px)) 16px calc(40px + env(safe-area-inset-bottom,0px))}
.fs canvas{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.fs-inner{position:relative;display:flex;flex-direction:column;align-items:center;gap:14px;text-align:center;max-width:520px;width:100%;max-height:100%;overflow:auto}
.fs-title{font-family:var(--font-display);font-weight:800;font-size:clamp(34px,8vw,56px);letter-spacing:-.04em;line-height:1}
.fs p{color:rgba(255,255,255,.88);font-size:16px;max-width:40ch}
.fs .eyebrow{color:rgba(255,255,255,.78)}
.pf-stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;width:100%;margin-top:6px}
.pf-stats div{padding:14px 6px;border-radius:18px;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.22);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
.pf-stats b{display:block;font-family:var(--font-display);font-size:26px;font-variant-numeric:tabular-nums}
.pf-stats span{font-size:12px;font-weight:700;color:rgba(255,255,255,.82)}
.pf-icons{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;font-size:30px}
.fs-actions{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-top:8px}
.fs .btn{background:rgba(255,255,255,.14);color:#fff;border-color:rgba(255,255,255,.32)}
.fs .btn-primary{background:#fff;color:#10102A;border-color:#fff;box-shadow:0 10px 30px -10px rgba(0,0,0,.5)}
.fs .fs-close{position:absolute;top:calc(14px + env(safe-area-inset-top,0px));right:14px;z-index:3;color:#fff;background:rgba(255,255,255,.14);border-color:rgba(255,255,255,.32)}
.story{color:#10102A;background:var(--sbg);cursor:pointer;-webkit-user-select:none;user-select:none}
.story .fs-close{color:#10102A;background:rgba(255,255,255,.45);border-color:rgba(16,16,42,.2)}
.story p{color:rgba(16,16,42,.82)}
.story .eyebrow{color:rgba(16,16,42,.72)}
.story .btn{background:rgba(255,255,255,.55);color:#10102A;border-color:rgba(16,16,42,.2)}
.story .btn-primary{background:#10102A;color:#fff;border-color:#10102A}
.st-bars{position:absolute;top:calc(14px + env(safe-area-inset-top,0px));left:16px;right:70px;display:flex;gap:4px;z-index:2}
.st-bars i{flex:1;height:4px;border-radius:4px;background:rgba(16,16,42,.2)}
.st-bars i.done{background:#10102A}
.st-big{font-family:var(--font-display);font-weight:800;font-size:clamp(64px,18vw,124px);line-height:.95;letter-spacing:-.05em;font-variant-numeric:tabular-nums}
.st-mid{font-family:var(--font-display);font-weight:800;font-size:clamp(24px,6vw,38px);letter-spacing:-.03em;line-height:1.08}
.st-emoji{font-size:clamp(72px,20vw,116px);line-height:1}
.st-badge{display:grid;place-items:center;width:150px;height:150px;border-radius:50%;background:rgba(255,255,255,.45);box-shadow:inset 0 0 0 2px rgba(255,255,255,.7)}
.st-card{width:100%;padding:16px;border-radius:24px;background:rgba(255,255,255,.45);border:1px solid rgba(255,255,255,.65);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);text-align:left;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.st-card b{display:block;font-family:var(--font-display);font-size:24px;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.st-card span{font-size:12.5px;font-weight:700;color:rgba(16,16,42,.75)}
.st-dots{display:flex;flex-wrap:wrap;gap:var(--g,4px);justify-content:center;max-width:100%}
.st-dots i{width:var(--d,14px);height:var(--d,14px);border-radius:30%;background:rgba(16,16,42,.16)}
.st-dots i.on{background:#10102A}
.st-hint{position:absolute;left:0;right:0;bottom:calc(14px + env(safe-area-inset-bottom,0px));text-align:center;font-size:12.5px;font-weight:700;opacity:.7}

/* animations : discrètes, désactivées si l'utilisateur réduit les animations */
@media (prefers-reduced-motion:no-preference){
  @keyframes fadeUp{from{opacity:0;transform:translateY(16px)}}
  @keyframes grow{from{transform:scaleX(0)}}
  @keyframes ringIn{from{stroke-dasharray:0 999}}
  @keyframes pop{0%{transform:scale(1)}35%{transform:scale(1.28)}65%{transform:scale(.92)}100%{transform:scale(1)}}
  @keyframes flash{from{box-shadow:0 0 0 0 color-mix(in srgb,var(--c) 70%,transparent)}to{box-shadow:0 0 0 16px transparent}}
  @keyframes wiggle{0%,100%{transform:rotate(0)}20%{transform:rotate(-14deg)}40%{transform:rotate(12deg)}60%{transform:rotate(-8deg)}80%{transform:rotate(5deg)}}
  @keyframes bump{0%,100%{transform:scale(1)}40%{transform:scale(1.4)}}
  @keyframes drift1{50%{transform:translate(6vw,4vh) scale(1.08)}}
  @keyframes drift2{50%{transform:translate(-5vw,6vh) scale(.94)}}
  @keyframes floaty{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
  @keyframes popIn{from{opacity:0;transform:scale(.3)}}
  @keyframes shine{from{background-position:0 0}to{background-position:200% 0}}
  .b1{animation:drift1 38s ease-in-out infinite}
  .b2{animation:drift2 46s ease-in-out infinite}
  .b3{animation:drift1 52s ease-in-out infinite reverse}
  .b4{animation:drift2 30s ease-in-out infinite}
  .main.enter > *:not(.topbar){animation:fadeUp .5s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--i,0) * 60ms)}
  .main.enter .bar>i{transform-origin:left center;animation:grow .9s cubic-bezier(.2,.8,.2,1) .15s both}
  .main.enter .ring .arc{animation:ringIn 1.1s cubic-bezier(.2,.8,.2,1) .1s both}
  .check.just{animation:pop .5s ease}
  @keyframes blink{0%,80%,100%{opacity:.25;transform:translateY(0)}40%{opacity:1;transform:translateY(-3px)}}
  .typing i{animation:blink 1.2s infinite}.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
  .msg.me:last-child,.msg.them:last-child{animation:fadeUp .3s ease both}
  .sv .st-bars i.cur b{width:100%;transform-origin:left center;animation:svfill 6s linear forwards}
  @keyframes svfill{from{transform:scaleX(0)}to{transform:scaleX(1)}}
  .sv-body{animation:fadeUp .35s ease both}
  @keyframes pulseRing{from{transform:scale(1);opacity:.7}to{transform:scale(1.55);opacity:0}}
  .check.timer.run::after{content:"";position:absolute;inset:-3px;border-radius:50%;border:3px solid var(--c);animation:pulseRing 1.6s ease-out infinite;pointer-events:none}
  .item.just{animation:flash .9s ease-out}
  .cheer.just svg{animation:pop .5s ease}
  #bell.shake svg{animation:wiggle .7s ease;transform-origin:50% 15%}
  .streak-pill.bump svg{animation:bump .6s ease}
  .gcard,.starter,.recap-btn{transition:transform .2s ease,box-shadow .2s ease}
  .gcard:hover,.starter:hover,.recap-btn:hover{transform:translateY(-3px)}
  .fab svg{transition:transform .25s ease}
  .fab:hover svg{transform:rotate(90deg)}

function seedNews(db){
  const off = db.users.find(u => u.role === 'official'); if (!off) return;
  db.news = db.news || [];
  NEWS_SEED.forEach(([h, tag, text]) => {
    const bid = uid(), at = Date.now() - h * 3600e3;

  const once = (key, fn) => { const k = `${u.id}|${t}|${key}`; if (!DB.reminderLog[k]) { DB.reminderLog[k] = 1; fn(); fired = true; } };
  const s = u.settings;
  if (s.morning.on && hm >= s.morning.time && plan.due.length) once('morning', () => {
    const text = `Rappel du jour : ${pl(plan.due.length, 'validation prévue', 'validations prévues')}. ${st.n ? `Ta série de ${pl(st.n, 'jour', 'jours')} t'attend.` : 'Allume ta flamme !'}`;
    notify(u.id, text, { type:'reminder', view:'today' }); toast(text, 'bell');
  });
  if (s.evening.on && hm >= s.evening.time && pending) once('evening', () => {
    const text = `Il te reste ${pl(pending, 'validation', 'validations')} avant minuit${st.n && !st.lit ? ` pour garder ta série de ${pl(st.n, 'jour', 'jours')}` : ''}.`;
    notify(u.id, text, { type:'reminder', view:'today' }); toast(text, 'bell');
  });
  if (wdIdx(new Date()) === 6 && hm >= '18:00') once('recap' + ymd(weekStart(new Date())), () => {
    notify(u.id, 'Ton récap de la semaine est prêt : retrouve-le sur l\u2019accueil.', { type:'badge' }); toast('Ton récap de la semaine est prêt !', 'star');
  });
  for (const x of plan.ongoing) if (x.g.type === 'deadline') {
    const n = daysUntil(x.g.due);
    if (n === 0 || n === 1) once('dl' + x.g.id, () => notify(u.id, `Deadline « ${x.g.title} » : ${n === 0 ? "c'est aujourd'hui" : "c'est demain"}.`, { type:'deadline', goalId:x.g.id }));
  }
  evaluateGoals(u, once);
  if (fired) save();
}

/* ================= actions métier ================= */
function addCheck(g, kind, value, pts, date = today(), userId = me()?.id || g.userId){
  const c = { id:uid(), goalId:g.id, userId, date, kind, value, pts, at:Date.now() };
  if (g.buddy && g.buddyVerify && userId === g.userId && ['done','progress','measure'].includes(kind)) { c.pending = true; c.ptsPending = pts; c.pts = 0; }
  DB.checkins.push(c);
  if (c.pending) requestVerify(g, c);
  return c;
}
function afterValidation(g, pts, wasLit){
  celebrate(pts);
  const u = me(), st = globalStreak(u.id);
  if (!wasLit) toast(st.n > 1 ? `Flamme allumée : ${pl(st.n, 'jour', 'jours')} de série !` : 'Flamme allumée ! Ta série commence.', 'flame');
  const n = goalStreak(g);
  if (MILESTONES.includes(n) && !g.milestones.includes(n) && ['routine','abstinence','limit','duration','timed'].includes(g.type)) {
    g.milestones.push(n);
    const unit = statBig(g).l;
    notify(u.id, `Palier débloqué : ${n} ${unit} pour « ${g.title} ».`, { type:'badge', goalId:g.id });
    autoPost(u, g, `${n} ${unit} pour « ${g.title} ». La flamme tient bon.`);
  }
  u.milestones = u.milestones || [];
  if ([3,7,14,30,60,100,365].includes(st.n) && !u.milestones.includes(st.n + '@' + today())) {
    u.milestones.push(st.n + '@' + today());
    notify(u.id, `Série de ${st.n} jours ! Tu gagnes un nouveau palier de flamme.`, { type:'badge' });
  }
}
function validate(id){
  const g = goalById(id), u = me(); if (!g || !isMember(g, u.id)) return;
  if (EXT[g.type]) return EXT[g.type].validate(g);
  const t = today(), wasLit = globalStreak(u.id).lit;
  if (g.type === 'routine' || g.type === 'abstinence') {
    const ex = DB.checkins.find(c => c.goalId === id && c.date === t && c.kind === 'done');
    if (ex) { DB.checkins.splice(DB.checkins.indexOf(ex), 1); save(); render(); toast('Validation annulée.', 'x'); return; }
    if (g.type === 'routine' && g.mode === 'days' && !g.days.includes(wdIdx(new Date()))) { toast("Cette routine n'est pas prévue aujourd'hui.", 'cal'); return; }
    addCheck(g, 'done', 1, TYPES[g.type].pts);
    UI.justDone = id;
    save(); render(); afterValidation(g, TYPES[g.type].pts, wasLit); save();
    checkPerfect();
  } else if (g.type === 'deadline') {
    if (g.completedAt) return;
    const pts = TYPES.deadline.pts + (t <= g.due ? 20 : 0);
    g.completedAt = Date.now(); addCheck(g, 'done', 1, pts);
    autoPost(u, g, `Deadline bouclée : « ${g.title} »${t <= g.due ? ', dans les temps' : ''}.`);
    save(); render(); afterValidation(g, pts, wasLit); save();
  } else {
    UI.modal = { type:'progress', id }; renderModal();
  }
}
// Publication automatique d'un palier : seulement si les fonctions sociales sont actives et l'objectif non privé
function autoPost(u, g, text){
  if (!socialOn(u) || g.visibility === 'private' || isBanned(u) || maintBlocks(u)) return;
  const p = { id:uid(), userId:u.id, text, visibility:g.visibility, goalId:g.id, kind:'milestone', at:Date.now(), likes:[], comments:[] };
  if (u.warned) p.status = 'pending';
  DB.posts.push(p); if (!p.status) demoReactions(p);
}
// Enregistre un encouragement reçu ; tous les FREEZE_EVERY encouragements reçus, l'auteur gagne un gel
function receiveCheer(author, postId, fromId){
  const key = postId + ':' + fromId;
  if (!author || author.id === fromId || author.cheersIn.includes(key)) return;
  author.cheersIn.push(key);
  if (author.cheersIn.length % FREEZE_EVERY === 0) {
    author.freezes++;
    notify(author.id, `Tu as reçu ${FREEZE_EVERY} encouragements de plus : un gel de série t'est offert !`, { type:'freeze' });
    if (me()?.id === author.id) setTimeout(() => toast('Nouveau gel de série gagné !', 'snow'), 60);
  }
}
// Les profils démo réagissent aux publications pour que l'on puisse tester les encouragements reçus
function demoReactions(p){
  DB.users.filter(x => x.demo && x.id !== p.userId && canSeePost(p, x.id)).forEach((x, i) => {
    if (Math.random() > .75) return;
    setTimeout(() => {
      const post = DB.posts.find(q => q.id === p.id), a = userById(p.userId);
      if (!post || post.likes.includes(x.id) || !a) return;
      post.likes.push(x.id);
      notify(a.id, `${x.name} a encouragé ta publication.`, { type:'like', view:'feed' });
      receiveCheer(a, post.id, x.id); save();
      const typing = ['INPUT','TEXTAREA','SELECT'].includes(document.activeElement?.tagName);
      if (!UI.modal && !typing) render();
    }, 2500 + i * 1800 + Math.random() * 1500);
  });
}
function addProgress(id, value){
  const g = goalById(id), u = me();
  if (EXT[g.type]?.progress) return EXT[g.type].progress(g, value);
  const wasLit = globalStreak(u.id).lit;
  let pts = TYPES[g.type].pts;
  addCheck(g, 'progress', value, pts);
  if (g.type === 'monthly') {
    const k = curMonth(); g.monthsDone = g.monthsDone || [];
    if (!g.monthsDone.includes(k) && monthProgress(g, k) >= g.target) {
      g.monthsDone.push(k); pts += MONTH_BONUS;
      bumpPts(DB.checkins[DB.checkins.length - 1], pts);
      notify(u.id, `Objectif de ${monthName(k)} atteint : « ${g.title} » ! +${MONTH_BONUS} flammes bonus.`, { type:'badge', goalId:g.id });
      autoPost(u, g, `Objectif de ${monthName(k)} atteint : ${g.target} ${g.unit || ''} pour « ${g.title} ».`.replace(/\s+/g, ' '));
    }
  } else if (!g.completedAt && objProgress(g) >= g.target) {
    g.completedAt = Date.now(); pts += 100;
    bumpPts(DB.checkins[DB.checkins.length - 1], pts);
    notify(u.id, `Objectif atteint : « ${g.title} » ! +100 flammes bonus.`, { type:'badge', goalId:g.id });
    autoPost(u, g, `Objectif atteint : ${g.target} ${g.unit || ''} pour « ${g.title} ».`);
  }
  UI.modal = null; save(); render(); afterValidation(g, pts, wasLit); save();
}
function relapse(id){
  const g = goalById(id);
  DB.checkins = DB.checkins.filter(c => !(c.goalId === id && c.date === today() && c.kind === 'done'));
  addCheck(g, 'relapse', 0, 0);

function sendRequest(to){

/* ================= types avancés ================= */
// Chaque type avancé déclare son comportement ici : plan du jour, ligne, fiche, formulaire, validation.
const isWin = c => c.kind !== 'relapse' && c.kind !== 'use';
const isMember = (g, id) => g.userId === id || (g.members || []).includes(id);
const myGoals = id => DB.goals.filter(g => isMember(g, id));
const sumKind = (g, kind, pred = () => true, who) => DB.checkins.filter(c => c.goalId === g.id && c.kind === kind && (!who || c.userId === who) && pred(c)).reduce((s, c) => s + Number(c.value || 0), 0);
const fmtClock = sec => { sec = Math.max(0, Math.round(sec)); const h = Math.floor(sec / 3600), m = Math.floor(sec % 3600 / 60), s = sec % 60; return h ? `${h}:${pad(m)}:${pad(s)}` : `${m}:${pad(s)}`; };
const nowHM = () => `${pad(new Date().getHours())}:${pad(new Date().getMinutes())}`;
const yday = () => ymd(addDays(new Date(), -1));
const round1 = n => Math.round(n * 10) / 10;
const daysLabel = days => days.length === 7 ? 'tous les jours' : days.join() === '0,1,2,3,4' ? 'en semaine' : days.join() === '5,6' ? 'le week-end' : days.slice().sort().map(i => WD_SHORT[i]).join(', ');
const endText = d => { const n = daysUntil(d); return n < 0 ? 'terminé' : n === 0 ? "se termine aujourd'hui" : `encore ${pl(n, 'jour', 'jours')}`; };
function untilTxt(hm){
  const [h, m] = hm.split(':').map(Number), now = new Date(), t = new Date(); t.setHours(h, m, 0, 0);
  const mins = Math.max(0, Math.round((t - now) / 60000));
  return mins >= 60 ? `${Math.floor(mins / 60)} h ${pad(mins % 60)}` : `${mins} min`;
}
// Jours consécutifs réussis ; le jour « en attente » ne casse pas la série
function dayStreak(g, isOk, isSched = () => true, pendKey = today(), from = new Date()){
  const start = ymd(g.createdAt); let d = new Date(from), n = 0;
  for (let i = 0; i < 800; i++) {
    const k = ymd(d); if (k < start) break;
    if (isSched(d)) { if (isOk(k)) n++; else if (k !== pendKey) break; }
    d = addDays(d, -1);
  }
  return n;
}
const todayDone = (g, date = today()) => DB.checkins.find(c => c.goalId === g.id && c.date === date && c.kind === 'done' && c.userId === me().id);
function undoDone(g, ex){ DB.checkins.splice(DB.checkins.indexOf(ex), 1); save(); render(); toast('Validation annulée.', 'x'); }
function winDone(g, pts, date){
  const u = me(), wasLit = globalStreak(u.id).lit;
  addCheck(g, 'done', 1, pts, date); UI.justDone = g.id;
  save(); render(); afterValidation(g, pts, wasLit); save(); checkPerfect();
}
function openProgress(g){ UI.modal = { type:'progress', id:g.id }; renderModal(); }
function bumpPts(c, pts){ if (c.pending) c.ptsPending = pts; else c.pts = pts; }
function softRender(){

}

function pendingTag(g){

function celebrateGoal(g, title, text){

function finishWith(g, pts, msg, post){

const EXT = {
  /* ---------- Limite : ne pas dépasser X ---------- */
  limit: {
    used(g){ const t = today(); return g.period === 'week' ? sumKind(g, 'use', c => c.date >= ymd(weekStart(new Date())) && c.date <= t) : sumKind(g, 'use', c => c.date === t); },
    meta: g => `${g.max} ${g.unit} max par ${g.period === 'week' ? 'semaine' : 'jour'}`,
    streak: g => dayStreak(g, k => hasCheck(g.id, k)),
    stat(g){ const n = this.streak(g); return { v:n, l: n > 1 ? 'jours sous la limite' : 'jour sous la limite' }; },
    scheduled: () => true, calendar:true, daily:true,
    plan: g => ({ done:hasCheck(g.id, today()) }),
    row(x){
      const g = x.g, used = this.used(g), over = used > g.max;
      return rowShell(x, `<span class="${over ? 'urgent' : ''}">${fmtNum(used)}/${g.max} ${esc(g.unit)} ${g.period === 'week' ? 'cette semaine' : "aujourd'hui"}${over ? ' · limite dépassée' : ''}</span>`,
        `<button class="mini-btn" data-act="limit-add" data-id="${g.id}" aria-label="Noter 1 ${esc(g.unit)}">+1</button>${checkBtn(x, 'Valider ma journée sous la limite', over && !x.done)}`, { bar: used / Math.max(g.max, 1) * 100 });
    },
    validate(g){
      const ex = todayDone(g); if (ex) return undoDone(g, ex);
      if (this.used(g) > g.max) { toast(`Limite dépassée ${g.period === 'week' ? 'cette semaine' : "aujourd'hui"} : pas de validation. Tu repars à zéro ${g.period === 'week' ? 'lundi' : 'demain'}.`, 'x'); return; }
      winDone(g, TYPES.limit.pts);
    },
    actions(g){ return `<button class="btn" data-act="limit-add" data-id="${g.id}">${icon('plus')}Noter 1 ${esc(g.unit)}</button><button class="btn btn-ghost" data-act="limit-sub" data-id="${g.id}">Retirer 1</button>${validateBtn(g, hasCheck(g.id, today()), 'Valider ma journée')}`; },
    detail(g){
      let h = '';
      for (let i = 6; i >= 0; i--) {
        const k = ymd(addDays(new Date(), -i)), v = sumKind(g, 'use', c => c.date === k);
        h += `<li class="${g.period === 'day' && v > g.max ? 'over' : ''} ${i === 0 ? 'cur' : ''}"><span>${WD_SHORT[wdIdx(parseYmd(k))]}</span><span class="bar"><i style="width:${Math.min(100, v / Math.max(g.max, 1) * 100)}%"></i></span><span>${fmtNum(v)}/${g.max}</span></li>`;
      }
      return `<div class="t-limit">${g.period === 'week' ? `<p class="muted" style="margin-bottom:10px">Cette semaine : <b>${fmtNum(this.used(g))}/${g.max} ${esc(g.unit)}</b></p>` : ''}${h3('7 derniers jours')}<ul class="months">${h}</ul></div>`;
    },
    form: (v, g) => `<div class="field-row">
        <div class="field"><label for="l-max">Maximum</label><input type="number" id="l-max" name="lmax" min="0" step="any" value="${v('max', 2)}"></div>
        <div class="field"><label for="l-unit">Unité</label><input type="text" id="l-unit" name="lunit" maxlength="20" value="${v('unit')}" placeholder="cafés, h d'écran…"></div></div>
      <div class="seg" role="radiogroup" aria-label="Période"><label><input type="radio" name="lperiod" value="day" ${(g?.period || 'day') === 'day' ? 'checked' : ''}><span>Par jour</span></label><label><input type="radio" name="lperiod" value="week" ${g?.period === 'week' ? 'checked' : ''}><span>Par semaine</span></label></div>
      <small class="muted">Note chaque consommation avec « +1 », puis valide ta journée si tu es resté sous la limite.</small>`,
    parse(fd, g){ g.max = Number(fd.get('lmax')); g.unit = (fd.get('lunit') || '').trim() || 'unités'; g.period = fd.get('lperiod') || 'day'; if (!(g.max >= 0) || fd.get('lmax') === '') return 'Indique la limite à ne pas dépasser.'; }
  },

  /* ---------- Durée : minutes à cumuler, avec minuteur ---------- */
  duration: {
    mins: (g, k = today()) => sumKind(g, 'progress', c => c.date === k && c.userId === me().id),
    running: g => { const t = DB.timers?.[me()?.id]; return t && t.goalId === g.id ? t : null; },
    liveMins(g){ const t = this.running(g); return this.mins(g) + (t ? (Date.now() - t.start) / 60000 : 0); },
    meta: g => `${g.minutes} min par jour`,
    streak: g => dayStreak(g, k => hasCheck(g.id, k)),
    stat(g){ const n = this.streak(g); return { v:n, l: n > 1 ? 'jours réussis' : 'jour réussi' }; },
    scheduled: () => true, calendar:true, daily:true,
    plan: g => ({ done:hasCheck(g.id, today()) }),
    row(x){
      const g = x.g, r = this.running(g), m = this.liveMins(g);
      return rowShell(x, `<span><b data-timer="${g.id}">${fmtClock(m * 60)}</b> / ${g.minutes} min</span>`,
        `<button class="check timer ${r ? 'run' : ''} ${x.done && !r ? 'on' : ''}" data-act="timer" data-id="${g.id}" aria-label="${r ? 'Mettre en pause' : 'Démarrer le minuteur'} : ${esc(g.title)}">${icon(r ? 'pause' : x.done ? 'check' : 'play')}</button>`,
        { bar: m / g.minutes * 100 });
    },
    validate(g){ toggleTimer(g); },
    actions(g){ const r = this.running(g); return `<button class="btn btn-primary" data-act="timer" data-id="${g.id}">${icon(r ? 'pause' : 'play')}${r ? 'Mettre en pause' : 'Démarrer le minuteur'}</button><button class="btn" data-act="add-progress" data-id="${g.id}">${icon('plus')}Ajouter des minutes</button>`; },
    detail(g){ const m = this.liveMins(g); return `<div class="timer-big t-duration"><b data-timer="${g.id}">${fmtClock(m * 60)}</b><span class="muted">sur ${g.minutes} min aujourd'hui</span><span class="bar"><i data-timer-bar="${g.id}" style="width:${Math.min(100, m / g.minutes * 100)}%"></i></span></div>`; },
    progressInfo(g){ return { title:'Ajouter des minutes', info:`${fmtClock(this.mins(g) * 60)} / ${g.minutes} min aujourd'hui`, label:'Minutes', quick:[5, 10, 15, 30] }; },
    progress(g, v){ UI.modal = null; addTimeMinutes(g, v); },
    form: v => `<div class="field"><label for="d-min">Minutes par jour</label><input type="number" id="d-min" name="dmin" min="1" step="1" value="${v('minutes', 30)}"></div><small class="muted">Lance le minuteur depuis l'accueil : la journée se valide toute seule quand le temps est atteint.</small>`,
    parse(fd, g){ g.minutes = Number(fd.get('dmin')); if (!(g.minutes > 0)) return 'Indique une durée quotidienne en minutes.'; }
  },

  /* ---------- Mesure : une valeur qui fluctue, suivie en courbe ---------- */
  measure: {
    pts: g => DB.checkins.filter(c => c.goalId === g.id && c.kind === 'measure').sort((a, b) => a.date < b.date ? -1 : a.date > b.date ? 1 : a.at - b.at),
    fmt: (g, v) => g.timeFmt ? fmtClock(v) : fmtNum(Math.round(v * 100) / 100),
    better: (g, a, b) => g.dir === 'down' ? a < b : a > b,
    best(g){ return this.pts(g).reduce((b, c) => b == null || this.better(g, c.value, b) ? c.value : b, null); },
    meta(g){ const b = this.best(g); return `${g.dir === 'down' ? 'Plus bas = mieux' : 'Plus haut = mieux'}${g.target ? ` · cible ${this.fmt(g, g.target)}${g.timeFmt ? '' : ' ' + g.unit}` : ''}${b != null ? ` · record ${this.fmt(g, b)}` : ''}`; },
    stat(g){

      const last = p[p.length - 1].value, d = last - p[0].value, u = g.timeFmt ? '' : ' ' + g.unit;
      return { v:this.fmt(g, last) + u, l: p.length < 2 ? 'première mesure' : d === 0 ? 'stable depuis le début' : `${this.better(g, last, p[0].value) ? 'en progrès' : 'en recul'} de ${this.fmt(g, Math.abs(d))}${g.timeFmt ? '' : ' ' + g.unit} depuis le début` };
    },
    plan: () => 'ongoing',
    row(x){ const g = x.g, s = this.stat(g); return rowShell(x, `<span>Dernière : ${esc(s.v)}</span>`, `<button class="mini-btn" data-act="validate" data-id="${g.id}">+ Mesure</button>`); },
    validate(g){ openProgress(g); },
    actions: g => `<button class="btn btn-primary" data-act="validate" data-id="${g.id}">${icon('plus')}Nouvelle mesure</button>`,
    card(g){ return this.spark(g); },
    detail(g){ const p = this.pts(g).slice(-5).reverse(); return `<div class="t-measure">${h3('Tendance')}${this.chart(g)}${p.length ? `${h3('Dernières mesures')}<ul class="months">${p.map(c => `<li><span>${esc(fmtDate(c.date))}</span><span></span><span>${this.fmt(g, c.value)}${unitOf(g)}</span></li>`).join('')}</ul>` : ''}</div>`; },
    spark(g){
      const p = this.pts(g); if (p.length < 2) return '';
      const vs = p.map(c => c.value), lo = Math.min(...vs), hi = Math.max(...vs), W = 110, H = 32;
      const pts = vs.map((v, i) => `${(i / (vs.length - 1) * (W - 6) + 3).toFixed(1)},${(hi === lo ? H / 2 : 3 + (hi - v) / (hi - lo) * (H - 6)).toFixed(1)}`);
      return `<svg class="spark" viewBox="0 0 ${W} ${H}" aria-hidden="true"><polyline points="${pts.join(' ')}" fill="none" stroke="var(--c-ink)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="${pts[pts.length - 1].split(',')[0]}" cy="${pts[pts.length - 1].split(',')[1]}" r="3.5" fill="var(--c-ink)"/></svg>`;
    },
    chart(g){
      const p = this.pts(g); if (p.length < 2) return `<p class="muted small" style="margin-bottom:14px">Ajoute au moins deux mesures pour voir ta courbe.</p>`;
      const W = 320, H = 160, L = 46, R = 14, T = 14, B = 24, vs = p.map(c => c.value);
      const dMin = Math.min(...vs), dMax = Math.max(...vs), tg = g.target ? Number(g.target) : null;
      let lo = Math.min(dMin, tg ?? dMin), hi = Math.max(dMax, tg ?? dMax); if (lo === hi) { lo -= 1; hi += 1; }
      const padv = (hi - lo) * .12; lo -= padv; hi += padv;
      const t0 = parseYmd(p[0].date).getTime(), t1 = parseYmd(p[p.length - 1].date).getTime();
      const X = c => L + (t1 === t0 ? (W - L - R) / 2 : (parseYmd(c.date).getTime() - t0) / (t1 - t0) * (W - L - R));
      const Y = v => T + (hi - v) / (hi - lo) * (H - T - B);
      const xy = p.map(c => [X(c), Y(c.value)]);
      const line = 'M' + xy.map(([x, y]) => `${x.toFixed(1)},${y.toFixed(1)}`).join('L');
      const area = `${line}L${xy[xy.length - 1][0].toFixed(1)},${H - B}L${xy[0][0].toFixed(1)},${H - B}Z`;
      const ticks = [...new Set([dMin, dMax])].map(v => `<line class="grid" x1="${L}" x2="${W - R}" y1="${Y(v).toFixed(1)}" y2="${Y(v).toFixed(1)}"/><text class="tick" x="${L - 6}" y="${(Y(v) + 3.5).toFixed(1)}" text-anchor="end">${this.fmt(g, v)}</text>`).join('');
      const target = tg != null ? `<line class="tgt" x1="${L}" x2="${W - R}" y1="${Y(tg).toFixed(1)}" y2="${Y(tg).toFixed(1)}"/><text class="tick" x="${W - R}" y="${(Y(tg) - 5).toFixed(1)}" text-anchor="end">cible ${this.fmt(g, tg)}</text>` : '';
      const short = k => parseYmd(k).toLocaleDateString('fr-FR', { day:'numeric', month:'short' });
      const [lx, ly] = xy[xy.length - 1];
      return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Courbe de ${p.length} mesures, de ${this.fmt(g, vs[0])} à ${this.fmt(g, vs[vs.length - 1])}">
        <defs><linearGradient id="ga-${g.id}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" style="stop-color:var(--c);stop-opacity:.45"/><stop offset="1" style="stop-color:var(--c);stop-opacity:0"/></linearGradient></defs>
        ${ticks}${target}
        <path d="${area}" fill="url(#ga-${g.id})"/>
        <path d="${line}" fill="none" stroke="var(--c-ink)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
        ${xy.slice(0, -1).map(([x, y]) => `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="2.6" fill="var(--c-ink)"/>`).join('')}
        <circle cx="${lx.toFixed(1)}" cy="${ly.toFixed(1)}" r="9" fill="var(--c)" opacity=".35"/><circle cx="${lx.toFixed(1)}" cy="${ly.toFixed(1)}" r="4.5" fill="var(--c-ink)"/>
        <text class="tick" x="${L}" y="${H - 6}">${short(p[0].date)}</text><text class="tick" x="${W - R}" y="${H - 6}" text-anchor="end">${short(p[p.length - 1].date)}</text>
      </svg>`;
    },
    parseInput(g, raw){
      raw = String(raw).trim().replace(',', '.'); if (!raw) return NaN;
      if (g.timeFmt) { if (raw.includes(':')) { const parts = raw.split(':').map(Number); if (parts.some(isNaN)) return NaN; return parts.reduce((s, x) => s * 60 + x, 0); } return Number(raw) * 60; }
      return Number(raw);
    },
    progressInfo(g){ const p = this.pts(g), last = p.length ? p[p.length - 1].value : null; return { title:'Nouvelle mesure', info:last != null ? `dernière mesure ${esc(this.fmt(g, last))}${unitOf(g)}` : 'première mesure', label: g.timeFmt ? 'Temps (mm:ss ou h:mm:ss)' : `Valeur${g.unit ? ` (${esc(g.unit)})` : ''}`, text:true, value: last != null ? this.fmt(g, last) : '', quick:[] }; },
    progress(g, v){

    form: (v, g) => `<label class="check-row" for="m-time"><span>Valeur en temps (mm:ss)<br><small class="muted" style="font-weight:500">Pour un chrono : temps au 10 km, gainage…</small></span><span class="switch"><input type="checkbox" id="m-time" name="mtime" ${g?.timeFmt ? 'checked' : ''}><span></span></span></label>

  /* ---------- Horaire : avant ou après une heure ---------- */
  timed: {
    LBL: { before:'Avant', after:'Après', notafter:'Rien après' },
    vdate: g => g.mode === 'notafter' ? yday() : today(),
    meta(g){ return `${this.LBL[g.mode]} ${g.time} · ${daysLabel(g.days)}`; },
    scheduled: (g, d) => g.days.includes(wdIdx(d)), calendar:true, daily:true,
    streak(g){ const na = g.mode === 'notafter'; return dayStreak(g, k => hasCheck(g.id, k), d => g.days.includes(wdIdx(d)), na ? yday() : today(), na ? addDays(new Date(), -1) : new Date()); },
    stat(g){ const n = this.streak(g); return { v:n, l: n > 1 ? 'jours dans les temps' : 'jour dans les temps' }; },
    plan(g){ const k = this.vdate(g); if (!g.days.includes(wdIdx(parseYmd(k))) || k < ymd(g.createdAt)) return null; return { done:hasCheck(g.id, k) }; },
    window(g){
      const hm = nowHM();
      if (g.mode === 'before') return hm < g.time ? { open:true, txt:`Encore ${untilTxt(g.time)} pour valider` } : { open:false, txt:`Créneau fermé à ${g.time}` };
      if (g.mode === 'after') return hm >= g.time ? { open:true, txt:`Créneau ouvert depuis ${g.time}` } : { open:false, txt:`Ça compte à partir de ${g.time}` };
      return { open:true, txt:`Hier soir, rien après ${g.time} ?` };
    },
    row(x){ const w = this.window(x.g); return rowShell(x, `<span class="${!w.open && !x.done ? 'urgent' : ''}">${esc(w.txt)}</span>`, checkBtn(x, x.g.mode === 'notafter' ? "J'ai tenu hier soir" : 'Valider', !w.open && !x.done)); },
    validate(g){
      const k = this.vdate(g), ex = todayDone(g, k); if (ex) return undoDone(g, ex);
      if (!g.days.includes(wdIdx(parseYmd(k)))) { toast("Cet horaire n'est pas prévu aujourd'hui.", 'cal'); return; }
      const w = this.window(g);
      if (!w.open) { toast(g.mode === 'before' ? `Trop tard : c'était à faire avant ${g.time}. Demain sera le bon jour.` : `Patience : ça compte à partir de ${g.time}.`, 'clock'); return; }

      <small class="muted">« Ne rien faire après » (pas d'écran après 22 h…) se confirme le lendemain matin.</small>`,
    parse(fd, g){ g.mode = fd.get('tmode') || 'before'; g.time = fd.get('ttime') || '07:00'; g.days = fd.getAll('tdays').map(Number); if (!g.days.length) return 'Choisis au moins un jour.'; }
  },

  /* ---------- Projet : checklist d'étapes ---------- */
  project: {
    counts: g => { const t = g.tasks || []; return { d:t.filter(x => x.done).length, n:t.length }; },
    meta(g){ const { d, n } = this.counts(g); return `${d}/${n} étapes${g.due && !g.completedAt ? ' · ' + dueText(g.due) : ''}`; },
    stat(g){ const { d, n } = this.counts(g); return { v:(n ? Math.round(d / n * 100) : 0) + '%', l:'accompli' }; },
    plan: g => g.completedAt ? null : 'ongoing', closable:true,

    detail(g){

        ${own ? `<form class="c-form" data-form="task" data-id="${g.id}" style="margin-bottom:16px"><label class="sr" for="task-new">Nouvelle étape</label><input type="text" id="task-new" name="t" placeholder="Ajouter une étape…" maxlength="120" autocomplete="off"><button class="btn sm" type="submit">Ajouter</button></form>` : ''}</div>`;
    },
    form: (v, g) => `${g ? `<p class="muted small">Ajoute, coche ou supprime les étapes depuis la fiche du projet.</p>` : `<div class="field"><label for="p-tasks">Étapes (une par ligne)</label><textarea id="p-tasks" name="ptasks" placeholder="Choisir un nom de domaine&#10;Maquetter la page d'accueil&#10;Mettre en ligne"></textarea></div>`}

  /* ---------- Challenge : X jours d'affilée, puis fin ---------- */
  challenge: {
    dayNum: g => Math.round((parseYmd(today()) - parseYmd(g.start)) / DAY) + 1,
    doneDays(g){ let n = 0; for (let i = 0, d = parseYmd(g.start); i < g.length; i++, d = addDays(d, 1)) if (hasCheck(g.id, ymd(d))) n++; return n; },
    meta(g){ if (g.completedAt) return `Réussi : ${g.length} jours sur ${g.length}`; if (g.failedAt) return `Interrompu au jour ${g.failDay}`; const k = this.dayNum(g); return k < 1 ? `Commence le ${fmtDate(g.start)}` : `Jour ${Math.min(k, g.length)} sur ${g.length}`; },
    stat(g){ return { v:`${this.doneDays(g)}/${g.length}`, l:'jours validés' }; },
    streak(g){ return this.doneDays(g); },
    scheduled: (g, d) => { const k = ymd(d); return k >= g.start && k < ymd(addDays(parseYmd(g.start), g.length)); }, closable:true, daily:true,
    plan(g){ if (g.completedAt || g.failedAt) return null; const k = this.dayNum(g); return k < 1 || k > g.length ? null : { done:hasCheck(g.id, today()) }; },
    row(x){ return rowShell(x, `<span>Jour ${this.dayNum(x.g)}/${x.g.length}</span>`, checkBtn(x, 'Valider le jour'), { bar: this.doneDays(x.g) / x.g.length * 100 }); },
    card(g){ return rowBar(this.doneDays(g) / g.length * 100); },
    validate(g){
      if (g.completedAt || g.failedAt) return;
      const ex = todayDone(g); if (ex) return undoDone(g, ex);
      const u = me(), wasLit = globalStreak(u.id).lit;
      addCheck(g, 'done', 1, TYPES.challenge.pts); UI.justDone = g.id;
      let pts = TYPES.challenge.pts;
      if (this.doneDays(g) >= g.length) {
        g.completedAt = Date.now(); pts += 150;
        finishWith(g, 150, `Challenge réussi : ${g.length} jours pour « ${g.title} » ! +150 flammes.`, `Challenge terminé : ${g.length} jours d'affilée pour « ${g.title} ».`);
        celebrateGoal(g, 'Challenge réussi !', `${g.length} jours d'affilée, sans lâcher. Chapeau.`);
      }
      save(); render(); afterValidation(g, pts, wasLit); save(); checkPerfect();
    },
    evaluate(g){
      if (g.completedAt || g.failedAt) return;
      for (let i = 0, d = parseYmd(g.start); i < g.length; i++, d = addDays(d, 1)) {
        const k = ymd(d); if (k >= today()) break;
        if (!hasCheck(g.id, k)) { g.failedAt = Date.now(); g.failDay = i + 1; notify(g.userId, `Challenge « ${g.title} » interrompu au jour ${i + 1}. Tu peux le relancer quand tu veux depuis sa fiche.`, { type:'deadline', goalId:g.id }); return true; }
      }
    },
    actions(g){

      return this.dayNum(g) >= 1 ? validateBtn(g, hasCheck(g.id, today()), 'Valider le jour') : '';
    },
    detail(g){
      let h = '';

      }
      return `<div class="t-challenge">${h3(`Les ${g.length} jours`)}<div class="chal">${h}</div><p class="muted small" style="margin-bottom:16px">Un jour manqué interrompt le challenge : la régularité, c'est tout le jeu.</p></div>`;
    },
    form: v => `<div class="field-row">

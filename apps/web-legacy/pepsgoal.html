/* ---- messages vocaux : lecteur intégré ---- */
const WAVE_BARS = 32;
// Forme d'onde : calculée à l'enregistrement (envoyée chiffrée avec le message), sinon dérivée de l'identifiant
function waveOf(m, b){
  const w = Array.isArray(b.a?.wave) && b.a.wave.length ? b.a.wave : null;
  if (w) return Array.from({ length:WAVE_BARS }, (_, i) => Math.max(1, Math.min(9, Number(w[Math.floor(i * w.length / WAVE_BARS)]) || 1)));
  let h = 0; for (const c of m.id) h = (h * 31 + c.charCodeAt(0)) >>> 0;
  return Array.from({ length:WAVE_BARS }, (_, i) => { h = (h * 1103515245 + 12345) >>> 0; return 2 + (h >>> 16) % 7 - (i < 3 || i > WAVE_BARS - 4 ? 1 : 0); });
}
function voicePlayer(m, b){
  const src = attSrc(m, b), bars = waveOf(m, b).map(v => `<i style="--h:${v}"></i>`).join(''), dur = b.a?.dur || 0;
  const rate = UI.voiceRate || 1;
  return `<span class="vplay ${src ? '' : 'wait'}" data-mid="${m.id}" style="--p:0">
    <button type="button" class="vp-btn" data-act="voice-toggle" data-id="${m.id}" aria-label="Écouter le message vocal (${fmtDur(dur)})" ${src ? '' : 'disabled'}>${src ? icon('play') : '<span class="vp-spin" aria-hidden="true"></span>'}</button>
    <span class="vp-wave" data-act="voice-seek" data-id="${m.id}" role="slider" aria-label="Position dans le message vocal" aria-valuemin="0" aria-valuemax="${Math.round(dur)}" aria-valuenow="0" tabindex="${src ? 0 : -1}"><span class="vp-bars">${bars}</span><span class="vp-bars on" aria-hidden="true">${bars}</span></span>
    <span class="vp-side"><span class="vp-time">${fmtDur(dur)}</span><button type="button" class="vp-rate" data-act="voice-rate" aria-label="Vitesse de lecture">${rate === 1 ? '1' : String(rate).replace('.', ',')}×</button></span>
    ${src ? `<audio preload="metadata" src="${esc(src)}" hidden></audio>` : ''}
  </span>`;
}
const vpOf = el => el?.closest?.('.vplay');
function vpSync(a){
  const vp = vpOf(a); if (!vp) return;
  const d = isFinite(a.duration) && a.duration > 0 ? a.duration : 0, t = a.currentTime || 0;
  vp.style.setProperty('--p', d ? Math.min(1, t / d) : 0);
  const time = vp.querySelector('.vp-time'), total = Number(vp.closest('.msg') && vp.querySelector('.vp-wave')?.getAttribute('aria-valuemax')) || d;
  if (time) time.textContent = fmtDur(!a.paused || t > 0 ? t : total);
  vp.querySelector('.vp-wave')?.setAttribute('aria-valuenow', Math.round(t));
  const btn = vp.querySelector('.vp-btn');
  if (btn && !btn.disabled) { const playing = !a.paused && !a.ended; if (btn.dataset.state !== String(playing)) { btn.dataset.state = String(playing); btn.innerHTML = icon(playing ? 'pause' : 'play'); btn.setAttribute('aria-label', playing ? 'Mettre en pause' : 'Écouter le message vocal'); } vp.classList.toggle('playing', playing); }
}
['timeupdate', 'play', 'pause', 'loadedmetadata'].forEach(ev => document.addEventListener(ev, e => { if (e.target.tagName === 'AUDIO') vpSync(e.target); }, true));
document.addEventListener('ended', e => { if (e.target.tagName !== 'AUDIO') return; e.target.currentTime = 0; vpSync(e.target); }, true);
function vpSeek(vp, ratio){
  const a = vp?.querySelector('audio'); if (!a || !isFinite(a.duration) || !a.duration) return;
  a.currentTime = Math.max(0, Math.min(1, ratio)) * a.duration; vpSync(a);
}
document.addEventListener('pointerdown', e => {
  const wave = e.target.closest?.('.vp-wave'); if (!wave) return;
  const r = wave.getBoundingClientRect(); vpSeek(vpOf(wave), (e.clientX - r.left) / r.width);
});
document.addEventListener('keydown', e => {
  const wave = e.target.closest?.('.vp-wave'); if (!wave || !['ArrowLeft', 'ArrowRight'].includes(e.key)) return;
  const a = vpOf(wave)?.querySelector('audio'); if (!a?.duration) return;
  e.preventDefault(); a.currentTime = Math.max(0, Math.min(a.duration, a.currentTime + (e.key === 'ArrowRight' ? 5 : -5))); vpSync(a);
});
// Forme d'onde réelle d'un enregistrement (32 niveaux de 1 à 9)
async function waveform(blob){
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const buf = await ctx.decodeAudioData(await blob.arrayBuffer()); ctx.close?.();
    const data = buf.getChannelData(0), step = Math.max(1, Math.floor(data.length / WAVE_BARS)), peaks = [];
    for (let i = 0; i < WAVE_BARS; i++) { let mx = 0; for (let j = i * step; j < Math.min(data.length, (i + 1) * step); j += 16) mx = Math.max(mx, Math.abs(data[j])); peaks.push(mx); }
    const top = Math.max(...peaks) || 1;
    return peaks.map(v => Math.max(1, Math.round(v / top * 9)));
  } catch(e){ return null; }
}

// Destinataire de la conversation ouverte, vérifié (ami non bloqué, ou groupe dont je suis membre)
function chatTarget(){
  const u = me(), m0 = UI.modal; if (m0?.type !== 'chat') return null;
  if (socialBlocked("d'envoyer des messages")) return null;
  if (m0.group) { const g = chatById(m0.group); if (!g || !g.members.includes(u.id)) { toast('Tu ne fais plus partie de ce groupe.', 'comment'); return null; } return { chat:g.id }; }
  const x = userById(m0.with);
  if (!x || x.role || !areFriends(u.id, x.id) || isBlockedPair(u.id, x.id)) { toast('Ce compte ne reçoit pas de messages.', 'comment'); return null; }
  return { to:x.id };
}
// Chiffre et enregistre un message (texte ou objet), avec sa pièce jointe éventuelle. Remplacé par l'envoi au serveur dans la version connectée.
async function deliverMessage(target, body, blob){
  const u = me(), id = uid();
  if (!window.crypto?.subtle) { toast('Ce navigateur ne permet pas le chiffrement : message non envoyé.', 'lock'); return null; }
  const msg = { id, from:u.id, to:target.to || null, at:Date.now(), read:false };
  if (target.chat) { msg.chat = target.chat; msg.readBy = [u.id]; }
  if (blob) { const enc = await attEncrypt(blob); body.a = Object.assign({}, body.a, enc.meta, { mime:blob.type }); msg.att = enc.data; ATT.set(id, URL.createObjectURL(blob)); }
  const raw = typeof body === 'string' ? body : packMsg(body);
  msg.e2e = await e2eEncryptConv(target.chat ? grpKeyId(target.chat) : pairId(u.id, target.to), raw);
  E2E.cache.set(id, raw);
  DB.messages = DB.messages || [];
  DB.messages.push(msg);
  // Mentions dans un groupe : les membres cités sont prévenus
  if (target.chat && Array.isArray(body?.mn)) body.mn.forEach(x => notify(x, `${u.name} t’a mentionné dans ${chatById(target.chat)?.name || 'un groupe'}.`, { type:'mention' }));
  save(); updateChat(!SILENT_K.includes(body?.k)); updateBadges();
  return msg;
}
// Profils de démonstration : réponse automatique
function demoReply(to){
  const u = me(), x = userById(to); if (!x?.demo) return;
  setTimeout(() => { UI.typing = to; updateChat(); }, 700);
  setTimeout(async () => {
    UI.typing = null;
    const rid = uid(), reply = DEMO_REPLIES[Math.floor(Math.random() * DEMO_REPLIES.length)];
    E2E.cache.set(rid, reply);
    DB.messages.push({ id:rid, from:to, to:u.id, e2e:await e2eEncrypt(to, u.id, reply), at:Date.now(), read:false });
    save();
    if (UI.modal?.type === 'chat' && UI.modal.with === to) updateChat();
    else { toast(`Nouveau message de ${first(x.name)}`, 'comment'); updateBadges(); if (UI.view === 'friends') softRender(); }
  }, 2200 + Math.random() * 1800);
}
async function sendMessage(to, text){ await deliverMessage({ to }, text); demoReply(to); }
async function sendRich(body, blob){
  const target = chatTarget(); if (!target) return;
  try { await deliverMessage(target, body, blob); if (target.to) demoReply(target.to); }
  catch(e){ toast(e?.message || 'Envoi impossible, réessaie.', 'x'); }
}

/* ---- messages vocaux ---- */
function recMime(){
  if (!window.MediaRecorder) return null;
  return ['audio/webm;codecs=opus', 'audio/mp4', 'audio/webm', 'audio/ogg;codecs=opus'].find(t => MediaRecorder.isTypeSupported?.(t)) || '';
}
async function startRec(){
  if (UI.rec) return;
  const mime = recMime();
  if (mime === null || !navigator.mediaDevices?.getUserMedia) { toast('L’enregistrement audio n’est pas disponible sur cet appareil.', 'x'); return; }
  let stream;
  try { stream = await navigator.mediaDevices.getUserMedia({ audio:true }); }
  catch(e){ toast('Autorise l’accès au micro pour enregistrer un message vocal.', 'lock'); return; }
  const mr = new MediaRecorder(stream, mime ? { mimeType:mime, audioBitsPerSecond:32000 } : undefined), chunks = [];
  mr.ondataavailable = e => { if (e.data?.size) chunks.push(e.data); };
  UI.rec = { mr, chunks, stream, start:Date.now(), secs:0, timer:setInterval(() => {
    if (!UI.rec) return;
    if (UI.modal?.type !== 'chat') { stopRec(true); return; }
    UI.rec.secs = (Date.now() - UI.rec.start) / 1000;
    const el = document.getElementById('rec-time'); if (el) el.textContent = fmtDur(UI.rec.secs);
    if (UI.rec.secs >= MAX_VOICE) stopRec(false);
  }, 250) };
  mr.start(250);
  UI.chatPanel = null; refreshChatExtra();
}
function stopRec(cancel){
  const r = UI.rec; if (!r) return;
  UI.rec = null; clearInterval(r.timer);
  const secs = Math.min(MAX_VOICE, (Date.now() - r.start) / 1000);
  r.mr.onstop = () => {
    r.stream.getTracks().forEach(t => t.stop());
    if (cancel) return;
    if (secs < 1) { toast('Message vocal trop court.', 'mic'); return; }
    const blob = new Blob(r.chunks, { type:(r.mr.mimeType || 'audio/webm').split(';')[0] });
    void waveform(blob).then(wave => sendRich({ k:'voice', a:Object.assign({ dur:Math.round(secs * 10) / 10 }, wave ? { wave } : {}) }, blob));
  };
  try { r.mr.stop(); } catch(e){ r.stream.getTracks().forEach(t => t.stop()); }
  refreshChatExtra();
}

// Opérations sur les groupes et les blocages : locales ici, envoyées au serveur dans la version connectée (cloud.js)
async function groupCreate(name, emoji, members){
  const u = me(), g = { id:uid(), name, emoji, owner:u.id, members:[u.id, ...members], at:Date.now(), changedAt:Date.now() };
  DB.chats = DB.chats || []; DB.chats.push(g);
  members.forEach(id => notify(id, `${u.name} t’a ajouté au groupe « ${name} ».`, { type:'group', view:'friends' }));
  save();
  return g;
}
async function groupRemoveMember(gid, userId){
  const g = chatById(gid); if (!g) return;
  g.members = g.members.filter(x => x !== userId); g.changedAt = Date.now();
  // Nouvelle version de la clé : l'ancien membre ne lit pas les messages suivants
  ksRotate(grpKeyId(gid));
  if (g.owner === userId) g.owner = g.members[0] || null;
  if (!g.members.length) { DB.chats = DB.chats.filter(c => c !== g); DB.messages = DB.messages.filter(m => m.chat !== gid); }
  save();
}
async function groupDelete(gid){ DB.chats = (DB.chats || []).filter(c => c.id !== gid); DB.messages = DB.messages.filter(m => m.chat !== gid); save(); }
async function groupUpdate(gid, patch){ const g = chatById(gid); if (g) { Object.assign(g, patch); save(); } }
async function groupAddMembers(gid, ids){
  const g = chatById(gid); if (!g) return;
  ids.forEach(id => { if (!g.members.includes(id)) { g.members.push(id); notify(id, `${me().name} t’a ajouté au groupe « ${g.name} ».`, { type:'group', view:'friends' }); } });
  save();
}

}

/* ---- liste des conversations ---- */
function messagesSection(u){
  const dms = [...new Set((DB.messages || []).filter(m => !m.chat && (m.from === u.id || m.to === u.id)).map(m => m.from === u.id ? m.to : m.from))].filter(id => userById(id) && !blockedBy(u.id, id));
  const rows = [
    ...dms.map(id => { const c = convo(u.id, id); return { kind:'dm', x:userById(id), last:c[c.length - 1], n:unreadFrom(u.id, id) }; }),
    ...myChats(u.id).map(g => { const c = groupConvo(g.id, u.id); return { kind:'grp', g, last:c[c.length - 1] || null, n:unreadGroup(u.id, g.id) }; })
  ].sort((a, b) => ((b.kind === 'dm' && isOfficial(b.x)) - (a.kind === 'dm' && isOfficial(a.x))) || ((b.last?.at || b.g?.at || 0) - (a.last?.at || a.g?.at || 0)));
  const canGroup = socialOn(u) && !isGuest(u) && !isBanned(u) && friendsOf(u.id).length > 0;
  if (!rows.length && !canGroup) return '';
  const total = unreadMsgs(u.id), cut = s => s.length > 60 ? s.slice(0, 60) + '…' : s;
  return `<section class="glass card">${e2eNotice()}<div class="card-h"><h2>Messages</h2><div class="card-h-tools">${total ? `<span class="chip t-deadline">${total} non lus</span>` : ''}${canGroup ? `<button class="btn btn-ghost sm" data-act="group-new">${icon('group')}Nouveau groupe</button>` : ''}</div></div>
    ${rows.length ? `<ul class="people">${rows.map(r => r.kind === 'dm'
      ? `<li class="person ${isOfficial(r.x) ? 'pinned' : ''}"><button class="who conv" data-act="open-chat" data-id="${r.x.id}">${avatar(r.x, 44)}<span><b>${esc(r.x.name)}${isOfficial(r.x) ? verified() : ''}</b><small class="${r.n ? 'unread' : ''}">${r.last.from === u.id ? 'Toi : ' : ''}${esc(cut(msgPreview(r.last)))} · ${ago(r.last.at)}</small></span></button>${r.n ? `<span class="badge static">${r.n}</span>` : ''}</li>`
      : `<li class="person"><button class="who conv" data-act="open-group" data-id="${r.g.id}"><span class="grp-av" style="--s:44px" aria-hidden="true">${esc(r.g.emoji)}</span><span><b>${esc(r.g.name)}</b><small class="${r.n ? 'unread' : ''}">${r.last ? `${r.last.from === u.id ? 'Toi' : esc(first(userById(r.last.from)?.name || '?'))} : ${esc(cut(msgPreview(r.last)))} · ${ago(r.last.at)}` : `Groupe · ${pl(r.g.members.length, 'membre', 'membres')}`}</small></span></button>${r.n ? `<span class="badge static">${r.n}</span>` : ''}</li>`).join('')}</ul>`
      : `<p class="muted small">Écris à un ami depuis la liste ci-dessous, ou crée un groupe de discussion.</p>`}</section>`;
}
// Met à jour les pastilles de navigation sans reconstruire la page
function updateBadges(){
  const u = me(); if (!u) return;
  const n = DB.friendships.filter(f => f.to === u.id && f.status === 'pending').length + unreadMsgs(u.id);
  document.querySelectorAll('[data-badge="friends"]').forEach(el => { el.textContent = n; el.hidden = !n; });
  const m = modCount();
  document.querySelectorAll('[data-badge="mod"]').forEach(el => { el.textContent = m; el.hidden = !m; });
}

async function blockUser(id){
  const u = me();
  if (!blockedBy(u.id, id)) { DB.blocks = DB.blocks || []; DB.blocks.push({ by:u.id, who:id, at:Date.now() }); }
  DB.friendships = DB.friendships.filter(f => !((f.from === u.id && f.to === id) || (f.from === id && f.to === u.id)));
  save();
}
async function unblockUser(id){ const u = me(); DB.blocks = (DB.blocks || []).filter(b => !(b.by === u.id && b.who === id)); save(); }

// Insère du texte à la position du curseur, sans dépasser la longueur maximale du champ
function insertAtCursor(t, text){
  if (!t) return;
  const max = t.maxLength > 0 ? t.maxLength : Infinity, s = t.selectionStart ?? t.value.length, en = t.selectionEnd ?? s;
  if (t.value.length - (en - s) + text.length > max) { toast('Message trop long.', 'x'); return; }
  t.setRangeText(text, s, en, 'end'); t.dispatchEvent(new Event('input', { bubbles:true }));
  t.focus({ preventScroll:true });
}

// Lecture du sondage d'un formulaire : { options, multi, hours } ou message d'erreur
function readPoll(fd){
  const options = fd.getAll('popt').map(s => String(s).trim()).filter(Boolean);
  if (options.length < 2) return 'Ajoute au moins deux choix au sondage.';
  if (new Set(options.map(o => o.toLowerCase())).size !== options.length) return 'Deux choix du sondage sont identiques.';
  return { options:options.slice(0, 6), multi:fd.get('pmulti') === 'on', hours:Math.max(1, Math.min(336, Number(fd.get('phours')) || 24)) };
}
function fmtLeft(ms){
  if (ms >= DAY) return `dans ${pl(Math.round(ms / DAY), 'jour', 'jours')}`;
  if (ms >= 3600e3) return `dans ${Math.round(ms / 3600e3)} h`;
  return `dans ${Math.max(1, Math.round(ms / 60e3))} min`;
}
// Votes : liste des votants (hors ligne) ou nombres fournis par le serveur (n, mine, voters)
const pollCount = o => o.n ?? (o.votes || []).length;
const pollMine = (o, uid) => o.mine ?? (o.votes || []).includes(uid);
function pollHtml(p){
  const u = me(), poll = p.poll, closed = Date.now() >= poll.endsAt;
  const voters = poll.voters ?? new Set(poll.options.flatMap(o => o.votes || [])).size;
  const voted = poll.options.some(o => pollMine(o, u.id)), showRes = closed || voted || p.userId === u.id;
  const top = Math.max(0, ...poll.options.map(pollCount));
  return `<div class="poll ${showRes ? 'res' : ''}" role="group" aria-label="Sondage">
    ${poll.options.map(o => {
      const n = pollCount(o), pct = voters ? Math.round(n / voters * 100) : 0, on = pollMine(o, u.id);
      return `<button type="button" class="poll-opt ${on ? 'on' : ''} ${showRes && n && n === top ? 'lead' : ''}" data-act="poll-vote" data-id="${p.id}|${o.id}" aria-pressed="${on}" ${closed ? 'disabled' : ''} style="--pct:${showRes ? pct : 0}%"><span class="po-t">${on ? icon('check') : ''}${esc(o.t)}</span>${showRes ? `<span class="po-n">${pct} %</span>` : ''}</button>`;
    }).join('')}
    <p class="poll-meta">${pl(voters, 'votant', 'votants')} · ${poll.multi ? 'plusieurs réponses' : 'une réponse'} · ${closed ? 'sondage terminé' : `se termine ${fmtLeft(poll.endsAt - Date.now())}`}${!closed && !voted && p.userId !== u.id ? ' · vote pour voir les résultats' : ''}</p>
  </div>`;
}
// Vote (remplacé par l'envoi au serveur dans la version connectée)
async function votePoll(p, oid){
  const uid = me().id, poll = p.poll, o = poll.options.find(x => x.id === oid); if (!o) return;
  const on = o.votes.includes(uid);
  if (!poll.multi) poll.options.forEach(x => { x.votes = x.votes.filter(v => v !== uid); });
  if (on) o.votes = o.votes.filter(v => v !== uid); else o.votes.push(uid);
  save(); render();
}

/* ---- sondages de la messagerie : chiffrés comme les messages ; chaque vote est un message chiffré invisible ---- */
function chatPollVotes(m){
  const list = m.chat ? groupConvo(m.chat, me().id) : convo(m.from, m.to), by = new Map();
  for (const x of list) { if (x.at < m.at) continue; const b = msgBody(x); if (b?.k === 'vote' && b.p === m.id) by.set(x.from, Array.isArray(b.o) ? b.o : []); }
  return by;
}
function chatPollHtml(m, b){
  const u = me(), votes = chatPollVotes(m), mine = votes.get(u.id) || [], opts = Array.isArray(b.o) ? b.o.slice(0, 6) : [];
  const voters = [...votes.values()].filter(v => v.length).length, counts = {};
  votes.forEach(v => v.forEach(id => { counts[id] = (counts[id] || 0) + 1; }));
  const names = id => [...votes.entries()].filter(([, v]) => v.includes(id)).map(([w]) => w === u.id ? 'toi' : first(userById(w)?.name || '?')).join(', ');
  return `<div class="poll in-chat res"><p class="poll-q">${icon('poll')}<b>${esc(b.q || 'Sondage')}</b></p>
    ${opts.map(o => { const n = counts[o.id] || 0, pct = voters ? Math.round(n / voters * 100) : 0, on = mine.includes(o.id);
      return `<button type="button" class="poll-opt ${on ? 'on' : ''}" data-act="chat-poll-vote" data-id="${m.id}|${o.id}" aria-pressed="${on}" style="--pct:${pct}%" ${n ? `title="${esc(names(o.id))}"` : ''}><span class="po-t">${on ? icon('check') : ''}${esc(o.t)}</span><span class="po-n">${n}</span></button>`; }).join('')}
    <p class="poll-meta">${pl(voters, 'votant', 'votants')} · ${b.multi ? 'plusieurs réponses' : 'une réponse'}</p></div>`;
}

/* ---- conversation : mise à jour ligne par ligne (les photos, vocaux et emojis déjà affichés ne sont pas recréés) ---- */
function chatRows(){
  const u = me(), m0 = UI.modal, g = m0.group ? chatById(m0.group) : null;
  const all = g ? groupConvo(g.id, u.id) : convo(u.id, m0.with), reacts = reactionsOf(all);
  const list = all.filter(m => !SILENT_K.includes(msgBody(m)?.k));
  const rows = []; let lastDay = '', lastFrom = '';
  for (const m of list) {
    const d = ymd(m.at);
    if (d !== lastDay) { rows.push({ k:'d:' + d, h:`<p class="chat-day">${d === today() ? "Aujourd'hui" : esc(fmtDate(d))}</p>` }); lastFrom = ''; lastDay = d; }
    const mine = m.from === u.id, who = g && !mine && m.from !== lastFrom ? (userById(m.from)?.name || 'Ancien membre') : null;
    lastFrom = m.from;
    const kind = (m.e2e && !E2E.cache.has(m.id)) ? 'text' : (msgBody(m)?.k || 'text');
    const b = (m.e2e && !E2E.cache.has(m.id)) ? null : msgBody(m), canAct = !m.official && !!b && !isBanned(u);
    rows.push({ k:'m:' + m.id, h:`${who ? `<p class="msg-who">${esc(who)}</p>` : ''}<div class="msg ${mine ? 'me' : 'them'} ${m.official ? 'official' : ''} k-${kind} ${b?.mn?.includes(u.id) ? 'mentioned' : ''}">${m.official && OFFICIAL_TAGS[m.tag] ? otag(m.tag) : ''}${msgInner(m)}<small>${new Date(m.at).toLocaleTimeString('fr-FR', { hour:'2-digit', minute:'2-digit' })}</small>${canAct ? `<button class="msg-act" data-act="msg-menu" data-id="${m.id}" aria-label="Réagir ou répondre" aria-expanded="${UI.msgMenu === m.id}">${icon('smile')}</button>` : ''}</div>${reactChips(m, reacts, mine)}${canAct && UI.msgMenu === m.id ? msgMenuHtml(m, reacts, mine) : ''}` });
  }
  if (!rows.length) rows.push({ k:'empty', h:`<p class="muted small chat-empty">${g ? 'Aucun message pour l’instant. Dis bonjour au groupe !' : "Aucun message pour l'instant. Lance la conversation !"}</p>` });

  return rows;
}

  const keys = new Set(rows.map(r => r.k));
  const mk = r => { const t = document.createElement('div'); t.className = 'mrow'; t.dataset.k = r.k; t.innerHTML = r.h; t._h = r.h; return t; };
  let changed = false, i = 0;
  for (const r of rows) {
    let cur = el.children[i];
    while (cur && !keys.has(cur.dataset.k)) { cur.remove(); changed = true; cur = el.children[i]; }
    if (cur && cur.dataset.k === r.k) {
      if (cur._h === undefined) cur._h = r.h;
      else if (cur._h !== r.h) { cur.replaceWith(mk(r)); changed = true; }
      i++; continue;
    }
    const prev = [...el.children].find(c => c.dataset.k === r.k);
    if (prev) prev.remove();
    const nw = prev && prev._h === r.h ? prev : mk(r); if (!prev) nw.classList.add('new');
    el.insertBefore(nw, cur || null);
    changed = true; i++;
  }
  while (el.children[i]) { el.children[i].remove(); changed = true; }
  return changed;
}

    const cur = fd.get('cur') || '', next = fd.get('next') || '', next2 = fd.get('next2') || '';

function purgeStories(){
  const n = (DB.stories || []).length, now = Date.now(), byUser = {};
  DB.stories = (DB.stories || []).filter(s => userById(s.userId) && (now - s.at < STORY_TTL || now - s.at < 365 * DAY))

  return n !== DB.stories.length;
}
function storyUsers(v){
  const live = liveStories().filter(s => canSeeStory(s, v) && (s.userId === v || !isBanned(userById(s.userId))));
  return [...new Set(live.map(s => s.userId))].map(id => {
    const list = live.filter(s => s.userId === id).sort((a, b) => a.at - b.at);
    return { u:userById(id), list, unseen:id !== v && list.some(s => !s.seenBy.includes(v)), last:list[list.length - 1].at };

function resizeStoryPhoto(file){
  return new Promise((res, rej) => {
    const url = URL.createObjectURL(file), img = new Image();
    img.onload = () => {
      const k = Math.min(1, 900 / Math.max(img.naturalWidth, img.naturalHeight)), c = document.createElement('canvas');
      c.width = Math.round(img.naturalWidth * k); c.height = Math.round(img.naturalHeight * k);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url); res(c.toDataURL('image/jpeg', .8));
    };
    img.onerror = () => { URL.revokeObjectURL(url); rej(); };
    img.src = url;
  });
}

    ${own && f.showSeen ? `<div class="sv-seen"><b>Vu par ${pl(s.seenBy.length, 'ami', 'amis')}</b>${s.seenBy.length ? `<ul>${s.seenBy.map(userById).filter(Boolean).map(x => `<li>${avatar(x, 30)}<span>${esc(x.name)}</span>${(s.likes || s.likers || []).includes(x.id) ? `<span class="sv-liker" aria-label="a encouragé">${flame(16)}</span>` : ''}</li>`).join('')}</ul>` : '<p class="small">Personne pour l’instant.</p>'}<button class="btn sm" data-act="story-seen">Fermer</button></div>` : ''}
  </div>`;
  lockScroll();
  if (!f.showSeen) UI.svTimer = setTimeout(() => svStep(1), STORY_MS);
}
function svStep(d){
  const f = UI.fs; if (!f || f.type !== 'storyview') return;
  f.showSeen = false;
  let ui = f.ui, si = f.si + d;
  if (si >= f.groups[ui].list.length) { ui++; si = 0; }
  else if (si < 0) { if (ui === 0) si = 0; else { ui--; si = f.groups[ui].list.length - 1; } }
  if (ui >= f.groups.length) { closeFs(); return; }
  f.ui = ui; f.si = si; renderStoryView();
}

    const keys = scope === 'account' ? JSON.parse(await zip.file('keys.json')?.async('string') || 'null') : null;
    UI.importData = { scope, clean:scope === 'full' ? sanitizeDB(data) : sanitizeAccount(data), man, keys:keys && typeof keys === 'object' ? keys.pairs : null };

function importAccount(a){
  const id = a.user.id, prev = userById(id);
  if (DB.users.some(x => x.username === a.user.username && x.id !== id) || prev?.role) return false;
  const oldGoals = new Set(DB.goals.filter(g => g.userId === id).map(g => g.id));
  DB.goals = DB.goals.filter(g => g.userId !== id);
  DB.checkins = DB.checkins.filter(c => !(c.userId === id && oldGoals.has(c.goalId)) && !oldGoals.has(c.goalId));
  DB.posts = DB.posts.filter(p => p.userId !== id);
  DB.stories = (DB.stories || []).filter(s => s.userId !== id);
  DB.messages = (DB.messages || []).filter(m => m.from !== id && m.to !== id);
  const taken = new Set([...DB.goals, ...DB.checkins, ...DB.posts, ...DB.stories, ...DB.messages].map(x => x.id));
  const fresh = list => list.filter(x => !taken.has(x.id));
  if (prev) Object.assign(prev, a.user, { role:undefined }); else DB.users.push(a.user);
  if (prev && !prev.role) delete prev.role;
  DB.goals.push(...fresh(a.goals)); DB.checkins.push(...fresh(a.checkins)); DB.posts.push(...fresh(a.posts));
  DB.stories.push(...fresh(a.stories)); DB.messages.push(...fresh(a.messages));
  repairRefs(DB);
  return true;
}

  document.querySelectorAll(`[data-a11y="${k}"]`).forEach(i => { if (i === e.target) return; if (i.type === 'checkbox') i.checked = !!A11Y[k]; else i.value = A11Y[k] || ''; });

});

/* ---------------- étapes de projet : réordonner (flèches ou glisser) ---------------- */
function moveTask(gid, tid, to){
  const g = goalById(gid); if (!g || g.userId !== me().id || !Array.isArray(g.tasks)) return false;
  const i = g.tasks.findIndex(t => t.id === tid); if (i < 0) return false;
  const j = Math.max(0, Math.min(g.tasks.length - 1, to)); if (i === j) return false;
  const [t] = g.tasks.splice(i, 1); g.tasks.splice(j, 0, t);
  return true;
}
function afterTaskMove(gid, tid, dir){
  save(); render();
  const li = document.querySelector(`.tasks li[data-tid="${tid}"]`); li?.classList.add('moved');
  const b = document.querySelector(`[data-act="task-move"][data-id="${gid}|${tid}|${dir}"]:not([disabled])`) || document.querySelector(`[data-act="task-move"][data-id="${gid}|${tid}|${-dir}"]`);
  b?.focus({ preventScroll:true });
}
document.addEventListener('pointerdown', e => {
  const grip = e.target.closest?.('.task-grip'); if (!grip || e.button > 0) return;
  const li = grip.closest('li'), ul = li?.parentElement; if (!ul?.dataset.gid) return;
  e.preventDefault();
  const before = [...ul.children].map(x => x.dataset.tid);
  li.classList.add('dragging');
  // Écoute sur le document : déplacer l'élément dans la page ferait perdre la capture du pointeur
  const move = ev => {
    if (ev.pointerId !== e.pointerId) return;
    const over = document.elementFromPoint(ev.clientX, ev.clientY)?.closest?.('.tasks li');
    if (!over || over === li || over.parentElement !== ul) return;
    const r = over.getBoundingClientRect();
    ul.insertBefore(li, ev.clientY < r.top + r.height / 2 ? over : over.nextSibling);
  };
  const end = ev => {
    if (ev.pointerId !== e.pointerId) return;
    document.removeEventListener('pointermove', move); document.removeEventListener('pointerup', end); document.removeEventListener('pointercancel', end);
    li.classList.remove('dragging');
    const order = [...ul.children].map(x => x.dataset.tid), g = goalById(ul.dataset.gid);
    if (!g || order.join() === before.join()) return;
    g.tasks.sort((a, b) => order.indexOf(a.id) - order.indexOf(b.id));
    save(); render(); toast('Étapes réordonnées.', 'list');
  };
  document.addEventListener('pointermove', move); document.addEventListener('pointerup', end); document.addEventListener('pointercancel', end);
});

function extractPalette(img, n = 6){

async function loadBgFile(file){

  if (file.size > 30 * 1024 * 1024) { toast('Image trop lourde (30 Mo maximum).', 'image'); return; }
  const url = URL.createObjectURL(file);
  try {
    const img = await loadImg(url), palette = extractPalette(img);
    for (const [max, q] of [[1920, .82], [1440, .75], [1080, .7]]) {
      const k = Math.min(1, max / Math.max(img.naturalWidth, img.naturalHeight)), c = document.createElement('canvas');

function friendSuggestions(u){
  const mine = new Set(friendsOf(u.id)), score = new Map();
  const ok = x => x && x.id !== u.id && !x.role && !x.guest && !friendship(u.id, x.id) && !isBlockedPair(u.id, x.id) && x.settings?.social !== false && !x.settings?.noSuggest;
  const add = (id, k, via) => { const x = userById(id); if (!ok(x)) return; const e = score.get(id) || { user:x, mutual:0, via:[], groups:0 }; if (k === 'm') { e.mutual++; if (via) e.via.push(via); } else e.groups++; score.set(id, e); };
  for (const f of mine) for (const ff of friendsOf(f)) if (!mine.has(ff)) add(ff, 'm', userById(f)?.name);
  for (const c of myChats(u.id)) for (const id of c.members) if (!mine.has(id)) add(id, 'g');
  const list = [...score.values()].sort((a, b) => b.mutual - a.mutual || b.groups - a.groups);
  if (list.length < 6) DB.users.filter(x => ok(x) && !score.has(x.id)).sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0)).slice(0, 6 - list.length).forEach(x => list.push({ user:x, mutual:0, via:[], groups:0 }));
  return list.map(s => Object.assign(s, { reason:s.mutual ? 'mutual' : s.groups ? 'group' : 'new' }));
}

  const list = friendSuggestions(u).filter(s => !hidden.has(s.user.id)).slice(0, 8);
  if (!list.length) return '';
  return `<section class="glass card sugg-card"><div class="card-h"><h2>Suggestions d’amis</h2><button class="btn btn-ghost sm" data-act="set-cat-go" data-id="privacy" aria-label="Réglages des suggestions">${icon('gear')}</button></div>
    <ul class="sugg-list">${list.map((s, i) => `<li class="sugg" style="--i:${i}"><button class="sugg-x icon-btn plain" data-act="suggest-hide" data-id="${s.user.id}" aria-label="Ne plus suggérer ${esc(s.user.name)}">${icon('x')}</button>

}

function reactionsOf(list){
  const map = new Map();
  for (const m of list) {
    const b = msgBody(m); if (b?.k !== 'react' || !b.p || !b.e) continue;
    const per = map.get(b.p) || new Map(); const set = per.get(b.e) || new Set();
    if (b.on === false) set.delete(m.from); else set.add(m.from);
    per.set(b.e, set); map.set(b.p, per);
  }
  return map;
}

TYPES.period = { label:'Période', desc:'Certains jours de la semaine ou du mois, sur une tranche horaire', pts:10 };
TYPE_ICON.period = 'period';
TYPE_GROUPS[0][1].splice(1, 0, 'period');
const PERIOD_GRACE = 60;   // minutes de rattrapage après la fin de la tranche
const addHM = (hm, n) => { const [h, m] = hm.split(':').map(Number), t = Math.max(0, Math.min(23 * 60 + 59, h * 60 + m + n)); return `${pad(Math.floor(t / 60))}:${pad(t % 60)}`; };
const lastDom = d => new Date(d.getFullYear(), d.getMonth() + 1, 0).getDate();
// Un 31 (ou 29, 30) tombe le dernier jour des mois plus courts
function periodOn(g, d){
  if (g.freq === 'month') { const dom = d.getDate(), last = lastDom(d); return (g.mdays || []).some(x => Math.min(x, last) === dom); }
  return (g.days || []).includes(wdIdx(d));
}
function periodDays(g){
  if (g.freq === 'month') { const m = (g.mdays || []).slice().sort((a, b) => a - b); return m.length === 1 ? `le ${m[0] === 1 ? '1er' : m[0]} du mois` : `les ${m.map(x => x === 1 ? '1er' : x).join(', ')} du mois`; }
  return daysLabel(g.days || []);
}
function nextPeriods(g, n = 4){
  const out = [], now = nowHM(); let d = new Date();
  for (let i = 0; i < 400 && out.length < n; i++, d = addDays(d, 1)) {
    if (!periodOn(g, d)) continue;
    if (i === 0 && (hasCheck(g.id, today()) || now > g.end)) continue;
    out.push(new Date(d));
  }
  return out;
}
EXT.period = {
  FREQ:{ week:'Hebdomadaire', month:'Mensuelle' },
  meta(g){ return `${cap(periodDays(g))} · ${g.start}–${g.end}`; },
  scheduled: (g, d) => periodOn(g, d), calendar:true, daily:true,
  streak(g){ return dayStreak(g, k => hasCheck(g.id, k), d => periodOn(g, d)); },
  stat(g){ const n = this.streak(g); return { v:n, l: n > 1 ? 'périodes tenues' : 'période tenue' }; },
  plan(g){ if (!periodOn(g, new Date()) || today() < ymd(g.createdAt)) return null; return { done:hasCheck(g.id, today()) }; },
  window(g){
    const hm = nowHM(), late = addHM(g.end, PERIOD_GRACE);
    if (hm < g.start) return { open:false, txt:`${g.start}–${g.end} · commence dans ${untilTxt(g.start)}` };
    if (hm <= g.end) return { open:true, live:true, txt:`En cours jusqu’à ${g.end}` };
    if (hm <= late) return { open:true, txt:`Terminée : validation possible jusqu’à ${late}` };
    return { open:false, txt:`Période terminée à ${g.end}` };
  },
  row(x){ const w = this.window(x.g); return rowShell(x, `<span class="${w.live && !x.done ? 'pd-live' : !w.open && !x.done ? 'urgent' : ''}">${esc(w.txt)}</span>`, checkBtn(x, 'Valider', !w.open && !x.done)); },
  validate(g){
    const k = today(), ex = todayDone(g, k); if (ex) return undoDone(g, ex);
    if (!periodOn(g, new Date())) { toast('Cette période n’est pas prévue aujourd’hui.', 'cal'); return; }
    const w = this.window(g);
    if (!w.open) { toast(nowHM() < g.start ? `Patience : la période commence à ${g.start}.` : `Trop tard : la période s’est terminée à ${g.end}. Rendez-vous à la prochaine.`, 'clock'); return; }
    winDone(g, TYPES.period.pts, k);
  },
  actions(g){ return periodOn(g, new Date()) ? validateBtn(g, hasCheck(g.id, today()), 'Valider cette période') : ''; },
  detail(g){
    const next = nextPeriods(g);
    return next.length ? `${h3('Prochaines périodes')}<ul class="pd-next">${next.map(d => `<li><b>${cap(d.toLocaleDateString('fr-FR', { weekday:'long', day:'numeric', month:'long' }))}</b><span>${g.start}–${g.end}</span></li>`).join('')}</ul>` : '';
  },

    }

      const e = now - flash.start;

function placeNavInd(){
  const prev = UI.navInd || {};
  for (const sel of ['.tabbar', '.side']) {
    const nav = document.querySelector(sel); if (!nav) continue;
    let ind = nav.querySelector(':scope > .nav-ind');
    if (!ind) { ind = document.createElement('span'); ind.className = 'nav-ind'; ind.setAttribute('aria-hidden', 'true'); nav.prepend(ind); }
    const cur = nav.querySelector('[aria-current="page"]');
    if (!cur || !nav.offsetParent && getComputedStyle(nav).position !== 'fixed' || !cur.offsetWidth) { ind.style.opacity = '0'; continue; }
    const g = { x:cur.offsetLeft, y:cur.offsetTop, w:cur.offsetWidth, h:cur.offsetHeight }, p = prev[sel];
    const put = r => { ind.style.transform = `translate(${r.x}px,${r.y}px)`; ind.style.width = `${r.w}px`; ind.style.height = `${r.h}px`; };
    ind.style.opacity = '1';
    if (p && (p.x !== g.x || p.y !== g.y || p.w !== g.w) && !reduced()) { ind.style.transition = 'none'; put(p); void ind.offsetWidth; ind.style.transition = ''; put(g); }
    else put(g);
    prev[sel] = g;
  }
  UI.navInd = prev;
}

    parse(fd, g){ g.length = Math.round(Number(fd.get('clen'))); g.start = fd.get('cstart') || today(); if (!(g.length >= 2 && g.length <= 365)) return 'La durée doit être comprise entre 2 et 365 jours.'; }
  },

  /* ---------- Paliers : une cible qui monte chaque semaine ---------- */
  program: {
    week: g => Math.round((weekStart(new Date()) - weekStart(parseYmd(g.start))) / (7 * DAY)) + 1,
    target: (g, w) => g.base + g.step * (w - 1),
    wsum(g, w){ const s = addDays(weekStart(parseYmd(g.start)), (w - 1) * 7), a = ymd(s), b = ymd(addDays(s, 6)); return sumKind(g, 'progress', c => c.date >= a && c.date <= b); },
    meta(g){ if (g.completedAt) return `Programme terminé : ${(g.weeksDone || []).length}/${g.weeks} semaines réussies`; const w = this.week(g); return w < 1 ? `Commence le ${fmtDate(g.start)}` : `Semaine ${w}/${g.weeks} · cible ${fmtNum(this.target(g, w))} ${g.unit}`; },
    stat(g){ const w = Math.min(Math.max(this.week(g), 1), g.weeks); return { v:Math.min(100, Math.round(this.wsum(g, w) / this.target(g, w) * 100)) + '%', l:`de la semaine ${w}` }; },
    streak: g => (g.weeksDone || []).length,
    plan(g){ if (g.completedAt) return null; const w = this.week(g); return w >= 1 && w <= g.weeks ? 'ongoing' : null; }, closable:true,
    row(x){ const g = x.g, w = this.week(g), s = this.wsum(g, w), t = this.target(g, w); return rowShell(x, `<span>Semaine ${w}/${g.weeks} : ${fmtNum(s)}/${fmtNum(t)} ${esc(g.unit)}</span>`, `<button class="mini-btn" data-act="validate" data-id="${g.id}">+ Progrès</button>`, { bar:s / t * 100, done:s >= t }); },
    card(g){ const w = Math.min(Math.max(this.week(g), 1), g.weeks); return rowBar(this.wsum(g, w) / this.target(g, w) * 100); },
    validate(g){ openProgress(g); },
    actions: g => g.completedAt ? '' : `<button class="btn btn-primary" data-act="validate" data-id="${g.id}">${icon('plus')}Ajouter un progrès</button>`,
    progressInfo(g){ const w = this.week(g); return { title:'Ajouter un progrès', info:`semaine ${w} : ${fmtNum(this.wsum(g, w))}/${fmtNum(this.target(g, w))} ${esc(g.unit)}`, label:`Quantité (${esc(g.unit)})` }; },
    progress(g, v){
      const u = me(), wasLit = globalStreak(u.id).lit, w = this.week(g);
      addCheck(g, 'progress', v, TYPES.program.pts); let pts = TYPES.program.pts;
      g.weeksDone = g.weeksDone || [];

const CLOSABLE = new Set(['deadline', 'objective', ...Object.keys(EXT).filter(k => EXT[k].closable)]);

/* ---- minuteur (type Durée) ---- */
function toggleTimer(g){
  const u = me(); DB.timers = DB.timers || {};
  const t = DB.timers[u.id];
  if (t && t.goalId === g.id) return stopTimer(u);
  if (t) stopTimer(u, true);
  DB.timers[u.id] = { goalId:g.id, start:Date.now() };
  save(); render(); toast(`Minuteur lancé : ${g.title}`, 'clock');
}
function stopTimer(u, silent){
  const t = DB.timers?.[u.id]; if (!t) return;
  delete DB.timers[u.id];
  const g = goalById(t.goalId); if (!g) { save(); return; }
  let mins = Math.round((Date.now() - t.start) / 6000) / 10;
  if (mins > 240) { mins = 240; setTimeout(() => toast('Minuteur oublié ? La session a été plafonnée à 4 h.', 'clock'), 0); }
  if (mins >= .1) addTimeMinutes(g, mins, silent); else { save(); render(); }
}
function addTimeMinutes(g, mins, silent){
  const u = me(), wasLit = globalStreak(u.id).lit;
  addCheck(g, 'progress', mins, 0);
  if (!hasCheck(g.id, today()) && EXT.duration.mins(g) >= g.minutes) {
    addCheck(g, 'done', 1, TYPES.duration.pts); UI.justDone = g.id;
    save(); render(); afterValidation(g, TYPES.duration.pts, wasLit);
    toast(`${g.minutes} minutes atteintes pour « ${g.title} » !`, 'clock'); save(); checkPerfect(); return;
  }
  save(); render(); if (!silent) toast(`+${fmtNum(mins)} min enregistrées.`, 'clock');
}
setInterval(() => {
  const u = me(), t = u && DB.timers?.[u.id]; if (!t) return;
  const g = goalById(t.goalId); if (!g) return;
  const live = EXT.duration.liveMins(g);
  document.querySelectorAll(`[data-timer="${g.id}"]`).forEach(el => el.textContent = fmtClock(live * 60));
  document.querySelectorAll(`[data-timer-bar="${g.id}"]`).forEach(el => el.style.width = Math.min(100, live / g.minutes * 100) + '%');
  if (!hasCheck(g.id, today()) && live >= g.minutes) stopTimer(u);
}, 1000);

/* ---- binôme de motivation (accountability) ---- */
function requestVerify(g, c){
  const b = userById(g.buddy), owner = userById(g.userId); if (!b) return;
  notify(b.id, `${owner.name} te demande de confirmer « ${g.title} » (${fmtDate(c.date)}).`, { type:'verify', goalId:g.id });
  if (b.demo) setTimeout(() => confirmCheck(c.id, true), 3500 + Math.random() * 3000);
}
function confirmCheck(cid, ok){
  const c = DB.checkins.find(x => x.id === cid); if (!c || !c.pending) return;
  const g = goalById(c.goalId), b = userById(g?.buddy); if (!g || !b) return;
  if (ok) {
    c.pending = false; c.pts = c.ptsPending || 0; delete c.ptsPending;
    notify(c.userId, `${b.name} a confirmé « ${g.title} »${c.pts ? ` : +${c.pts} flammes` : ''}.`, { type:'verify', goalId:g.id });
  } else {
    DB.checkins.splice(DB.checkins.indexOf(c), 1);
    if (g.type === 'deadline' && c.kind === 'done') g.completedAt = null;
    notify(c.userId, `${b.name} n'a pas confirmé « ${g.title} » du ${fmtDate(c.date)}. La validation est retirée.`, { type:'verify', goalId:g.id });
  }
  save(); softRender();
}

    <ul class="verify">${list.map(c => { const g = goalById(c.goalId), o = userById(c.userId); return `<li>${avatar(o, 36)}<span class="vt">${esc(o.name)} · ${esc(g.icon)} ${esc(g.title)}<small>${esc(fmtDate(c.date))} · ${esc(what(c))}</small></span><button class="btn btn-primary sm" data-act="verify-ok" data-id="${c.id}">Confirmer</button><button class="btn sm" data-act="verify-no" data-id="${c.id}">Refuser</button></li>`; }).join('')}</ul></section>`;

function buddyFields(g){

// Évalue les fins de challenge, de duel, de programme… et prévient le binôme des oublis
function evaluateGoals(u, once){
  let changed = false;
  for (const g of myGoals(u.id).filter(g => !g.archived)) {
    if (EXT[g.type]?.evaluate && EXT[g.type].evaluate(g)) changed = true;
    if (g.userId === u.id && g.buddy && g.buddyMiss && !isClosedGoal(g)) {
      const yd = addDays(new Date(), -1), k = ymd(yd);
      const sched = g.type === 'timed' ? g.mode !== 'notafter' && g.days.includes(wdIdx(yd)) : EXT[g.type] ? (EXT[g.type].daily && (!EXT[g.type].scheduled || EXT[g.type].scheduled(g, yd))) : scheduled(g, yd);
      if (sched && k >= ymd(g.createdAt) && !DB.checkins.some(c => c.goalId === g.id && c.date === k && c.kind === 'done' && c.userId === u.id)) {
        once('miss' + g.id, () => {
          const b = userById(g.buddy); if (!b) return;
          notify(b.id, `${u.name} a raté « ${g.title} » hier. Un petit mot d'encouragement ?`, { type:'verify', goalId:g.id });
          notify(u.id, `Ton binôme ${b.name} a reçu une alerte pour ton oubli d'hier sur « ${g.title} ».`, { type:'verify', goalId:g.id });
        });

function weekStrip(id){
  const ws = weekStart(new Date()), days = activeDays(id), frozen = new Set(userById(id).frozenDays || []), t = today();
  let h = '';

    const k = ymd(addDays(ws, i)), fut = k > t, on = days.has(k), fz = !on && frozen.has(k);
    h += `<div class="wd ${on ? 'on' : fz ? 'frozen' : 'off'} ${fut ? 'fut' : ''} ${k === t ? 'today' : ''}" aria-label="${WD_SHORT[i]} : ${on ? 'flamme allumée' : fz ? 'protégé par un gel' : fut ? 'à venir' : 'pas de validation'}">${fz ? icon('snow') : flame(22)}<span>${WD[i]}</span></div>`;
  }

}
function ring(done, total){

    <circle class="trk" cx="54" cy="54" r="${r}" fill="none" stroke-width="12"/>
    <circle class="arc" cx="54" cy="54" r="${r}" fill="none" stroke="url(#gRing)" stroke-width="12" stroke-linecap="round" stroke-dasharray="${c * pct} ${c}" transform="rotate(-90 54 54)"/>
    <text class="ring-txt" x="54" y="62" text-anchor="middle">${done}/${total}</text></svg>`;
}

function calendar(g){
  const ws = weekStart(new Date()), start = addDays(ws, -28), end = addDays(ws, 6), t = today(), created = ymd(g.createdAt);
  let cells = WD.map(d => `<span class="hd">${d}</span>`).join('');
  for (let d = new Date(start); d <= end; d = addDays(d, 1)) {
    const k = ymd(d), fut = k > t;
    const on = DB.checkins.some(c => c.goalId === g.id && c.date === k && isWin(c)), rel = hasCheck(g.id, k, 'relapse');
    let cls = 'rest';
    if (rel) cls = 'relapse'; else if (on) cls = 'on'; else if (fut) cls = 'fut';
    else if (k >= created && scheduled(g, d) && !(g.type === 'abstinence' && k < g.since)) cls = k === t ? 'pending' : 'miss';
    cells += `<span class="cal-c ${cls} ${k === t ? 'is-today' : ''}" title="${fmtDate(k)}">${d.getDate()}</span>`;
  }
  return `<div class="cal t-${g.type}">${cells}</div>
  <div class="legend t-${g.type}"><span><i style="background:var(--c)"></i>Validé</span>${g.type !== 'objective' ? `<span><i style="border:2px dashed var(--ink-3)"></i>Manqué</span>` : ''}${g.type === 'abstinence' ? `<span><i style="background:var(--danger)"></i>Écart</span>` : ''}</div>`;

function stagger(root){ [...root.children].forEach((c, i) => c.style.setProperty('--i', i)); }
function countUps(root){
  if (reduced()) return;
  root.querySelectorAll('[data-count]').forEach(el => {
    const to = Number(el.dataset.count), pre = el.dataset.pre || '', suf = el.dataset.suf || '';
    if (!(to > 0)) return;
    const t0 = performance.now(), dur = Math.min(1500, 600 + to * 6);
    const tick = t => {
      const k = Math.min(1, (t - t0) / dur), e = 1 - Math.pow(1 - k, 3), v = to * e;
      el.textContent = pre + fmtNum(Number.isInteger(to) ? Math.round(v) : Math.round(v * 10) / 10) + suf;
      if (k < 1) requestAnimationFrame(tick);
    };
    el.textContent = pre + '0' + suf; requestAnimationFrame(tick);
  });
}
function startConfetti(cv){
  if (!cv || reduced()) return;
  const ctx = cv.getContext('2d'), dpr = Math.min(2, window.devicePixelRatio || 1), W = cv.clientWidth, H = cv.clientHeight;
  cv.width = W * dpr; cv.height = H * dpr; ctx.scale(dpr, dpr);

  const ps = [...burst(0, 1, 90), ...burst(W, -1, 90)], t0 = performance.now();
  const step = t => {
    const el = (t - t0) / 1000; ctx.clearRect(0, 0, W, H);
    for (const p of ps) {
      p.vy += .32; p.vx *= .985; p.x += p.vx; p.y += p.vy; p.r += p.vr;
      ctx.save(); ctx.globalAlpha = Math.max(0, 1 - Math.max(0, el - 3) / 1.5); ctx.translate(p.x, p.y); ctx.rotate(p.r);

    }

  };
  confettiRAF = requestAnimationFrame(step);
}
function stopConfetti(){ if (confettiRAF) cancelAnimationFrame(confettiRAF); confettiRAF = null; }

async function hashPw(pw, salt){
  try {
    if (crypto && crypto.subtle) {
      const enc = new TextEncoder();
      const key = await crypto.subtle.importKey('raw', enc.encode(pw), 'PBKDF2', false, ['deriveBits']);
      const bits = await crypto.subtle.deriveBits({ name:'PBKDF2', salt:enc.encode(salt), iterations:120000, hash:'SHA-256' }, key, 256);
      return [...new Uint8Array(bits)].map(b => b.toString(16).padStart(2, '0')).join('');
    }
  } catch(e){}
  let h1 = 0xdeadbeef, h2 = 0x41c6ce57; const s = salt + pw;
  for (let i = 0; i < s.length; i++) { const c = s.charCodeAt(i); h1 = Math.imul(h1 ^ c, 2654435761); h2 = Math.imul(h2 ^ c, 1597334677); }
  return 'w' + (h1 >>> 0).toString(16) + (h2 >>> 0).toString(16);
}

  'add-friend': id => sendRequest(id),

  unfriend: id => { const x = userById(id); UI.modal = { type:'confirm', title:`Retirer ${x.name} ?`, text:'Vous ne verrez plus vos publications réservées aux amis.', ok:'Retirer', danger:true, run: () => { DB.friendships = DB.friendships.filter(f => f !== friendship(me().id, id)); save(); render(); } }; renderModal(); },
  'ask-notif': async () => {
    const u = me();

    } catch(e){ toast("Ce navigateur bloque les notifications ici. Les rappels restent visibles dans l'app.", 'bell'); }
  },
  'test-reminder': () => {
    const u = me(), plan = todayPlan(u.id), pending = plan.due.filter(x => !x.done).length;
    const text = pending ? `Rappel : il te reste ${pl(pending, 'validation', 'validations')} aujourd'hui.` : "Rappel : tout est validé aujourd'hui, bravo !";

const FORMS = {
  async login(f){
    if (!NET.online) { UI.authError = 'Hors ligne : la connexion à un compte nécessite internet. Tu peux continuer sans compte en attendant.'; return render(); }
    const d = Object.fromEntries(new FormData(f)), un = (d.username || '').trim().toLowerCase();
    const u = DB.users.find(x => x.username === un);
    if (!un || !d.password) { UI.authError = "Indique ton nom d'utilisateur et ton mot de passe."; return render(); }
    if (!u) { UI.authError = "Aucun compte avec ce nom d'utilisateur. Crée un compte ou vérifie l'orthographe."; return render(); }
    if (u.role === 'official') { UI.authError = 'Le compte PepsGoal Officiel se gère depuis le compte admin (onglet Modération).'; return render(); }
    if (!u.passHash) { UI.authError = "Ce profil d'exemple n'a pas de mot de passe. Utilise le bouton « Mode démonstration »."; return render(); }
    if (await hashPw(d.password, u.salt) !== u.passHash) { UI.authError = 'Mot de passe incorrect.'; return render(); }
    enter(u);
  },
  async signup(f){
    if (!NET.online) { UI.authError = 'Hors ligne : la connexion à un compte nécessite internet. Tu peux continuer sans compte en attendant.'; return render(); }
    const d = Object.fromEntries(new FormData(f)), un = (d.username || '').trim().toLowerCase(), name = (d.name || '').trim();
    if (name.length < 2) { UI.authError = 'Indique ton nom (2 caractères minimum).'; return render(); }
    if (!/^[a-z0-9._]{3,20}$/.test(un)) { UI.authError = "Le nom d'utilisateur doit faire 3 à 20 caractères : lettres, chiffres, point ou tiret bas."; return render(); }
    if (DB.users.some(x => x.username === un)) { UI.authError = "Ce nom d'utilisateur est déjà pris."; return render(); }
    if ((d.password || '').length < 6) { UI.authError = 'Le mot de passe doit contenir au moins 6 caractères.'; return render(); }
    const salt = uid() + uid();
    const hue = Math.floor(Math.random() * ACCENTS.length);
    const u = Object.assign({ id:uid(), username:un, name, hue, bio:'', demo:false, salt, passHash: await hashPw(d.password, salt), createdAt:Date.now(), settings:defSettings(), milestones:[] }, newUserFields(hue));
    DB.users.push(u); welcomeOfficial(u);
    DB.notifs.push({ id:uid(), userId:u.id, type:'badge', text:'Bienvenue sur PepsGoal ! Crée ton premier objectif pour allumer ta flamme.', at:Date.now(), read:false });
    enter(u);
  },
  goal(f){
    const fd = new FormData(f), m = UI.modal, g0 = m.editId ? goalById(m.editId) : null;
    const type = g0 ? g0.type : fd.get('type'), err = f.querySelector('#g-err');
    const fail = msg => { err.textContent = msg; err.hidden = false; };
    const title = (fd.get('title') || '').trim();
    if (!title) return fail("Donne un intitulé à ton objectif.");
    const g = { title, icon:fd.get('icon') || '🎯', note:(fd.get('note') || '').trim(), visibility:fd.get('visibility') || 'friends' };
    if (type === 'monthly') {
      g.target = Number(fd.get('mtarget')); g.unit = (fd.get('munit') || '').trim(); g.cumulate = fd.get('cumulate') === 'on';
      if (!(g.target > 0)) return fail('La cible mensuelle doit être un nombre supérieur à zéro.');
    }
    if (type === 'objective') {
      g.target = Number(fd.get('target')); g.unit = (fd.get('unit') || '').trim(); g.endDate = fd.get('endDate') || '';
      if (!(g.target > 0)) return fail('La cible doit être un nombre supérieur à zéro.');
    }
    if (type === 'deadline') { g.due = fd.get('due'); if (!g.due) return fail('Choisis une date limite.'); }
    if (type === 'routine') {
      g.mode = fd.get('mode'); g.days = fd.getAll('days').map(Number); g.perWeek = Number(fd.get('perWeek'));
      if (g.mode === 'days' && !g.days.length) return fail('Choisis au moins un jour de la semaine.');
      if (g.mode === 'count' && !(g.perWeek >= 1 && g.perWeek <= 7)) return fail('Choisis entre 1 et 7 fois par semaine.');
    }
    if (type === 'abstinence') { g.since = fd.get('since') || today(); }
    if (EXT[type]) { const e = EXT[type].parse(fd, g, g0); if (e) return fail(e); }
    if (!EXT[type]?.social) {
      g.buddy = fd.get('buddy') || null; g.buddyVerify = !!g.buddy && fd.get('bverify') === 'on'; g.buddyMiss = !!g.buddy && fd.get('bmiss') === 'on';
      if (g.buddy && g.buddy !== g0?.buddy) notify(g.buddy, `${me().name} compte sur toi comme binôme pour « ${title} ».`, { type:'verify' });
    }
    const grpSel = fd.get('group') || null;
    if (g0) { setGoalGroup(me(), g0.id, grpSel); Object.assign(g0, g); if (g0.type === 'objective' && g0.completedAt && objProgress(g0) < g0.target) g0.completedAt = null; UI.modal = { type:'goal', id:g0.id }; toast('Objectif mis à jour.'); }
    else {
      const ng = Object.assign({ id:uid(), userId:me().id, type, createdAt:Date.now(), archived:false, completedAt:null, milestones:[], monthsDone:[], days:[], perWeek:3 }, g);
      DB.goals.push(ng); UI.modal = null; setGoalGroup(me(), ng.id, grpSel);
      (ng.members || []).filter(id => id !== me().id).forEach(id => notify(id, `${me().name} t'a ajouté au ${type === 'duel' ? 'duel' : 'défi de groupe'} « ${title} ».`, { type:'friend', goalId:ng.id }));
      if (UI.view !== 'goals') UI.view = 'today';
      toast(`« ${title} » est prêt. À toi de jouer !`, 'flame');
    }
    save(); render();
  },
  progress(f){
    const g = goalById(f.dataset.id), raw = String(new FormData(f).get('value') || '').trim();
    const v = EXT[g.type]?.parseInput ? EXT[g.type].parseInput(g, raw) : Number(raw.replace(',', '.'));
    if (!(v > 0)) { toast(g.type === 'measure' ? (g.timeFmt ? 'Temps invalide : écris par exemple 52:30.' : 'Valeur invalide : écris un nombre, par exemple 72,5.') : 'Indique une quantité supérieure à zéro.', 'x'); return; }
    addProgress(g.id, v);
  },
  task(f){
    const g = goalById(f.dataset.id), t = String(new FormData(f).get('t') || '').trim(); if (!t || !g) return;
    g.tasks.push({ id:uid(), t, done:false });
    if (g.completedAt) g.completedAt = null;
    save(); render();
    const inp = document.getElementById('task-new'); if (inp) inp.focus({ preventScroll:true });
  },
  post(f){
    const fd = new FormData(f), text = (fd.get('text') || '').trim();
    if (!text) { toast('Écris quelque chose avant de publier.', 'x'); return; }
    if (socialBlocked('de publier')) return;
    const np = { id:uid(), userId:me().id, text, visibility:fd.get('vis') || 'friends', goalId:f.dataset.goal || fd.get('goal') || null, kind:'manual', at:Date.now(), likes:[], comments:[] };
    if (me().warned) { np.status = 'pending'; admins().forEach(a => notify(a.id, `Nouvelle publication de ${me().name} à valider.`, { type:'verify' })); }
    DB.posts.push(np); if (!np.status) demoReactions(np);
    UI.modal = null; UI.view = 'feed'; UI.feedTab = fd.get('vis') === 'public' && UI.feedTab === 'public' ? 'public' : 'friends';
    save(); render(); toast(np.status ? 'Envoyé à la modération : ta publication sera visible après validation.' : 'Publié.', 'feed');
  },
  comment(f){
    const text = (new FormData(f).get('text') || '').trim(); if (!text) return;
    const p = DB.posts.find(x => x.id === f.dataset.id), u = me();
    if (socialBlocked('de commenter')) return;
    if (!canComment(u, p)) { toast(p.commentsLocked ? 'Les commentaires sont fermés sur cette publication.' : 'La modération a restreint tes commentaires.', 'lock'); return; }
    p.comments.push({ id:uid(), userId:u.id, text, at:Date.now() });
    if (p.userId !== u.id) notify(p.userId, `${u.name} a commenté ta publication : « ${text.slice(0, 60)} »`, { type:'comment', view:'feed' });
    save(); render();
    const inp = document.getElementById('c-' + p.id); if (inp) inp.focus({ preventScroll:true });
  },
  profile(f){
    const fd = new FormData(f), u = me(), name = (fd.get('name') || '').trim();
    if (name.length < 2) { toast('Le nom doit contenir au moins 2 caractères.', 'x'); return; }
    u.name = name; u.bio = (fd.get('bio') || '').trim();
    save(); render(); toast('Profil enregistré.');
  }
};
document.addEventListener('submit', async e => {

/* ================= groupes d'objectifs ================= */
// Chaque personne range les objectifs qu'elle voit (y compris les défis partagés) dans ses propres groupes.
const GROUP_ICONS = ['📁','🏃','🧘','💼','💻','📚','💰','🏠','❤️','🎨','🌱','🎯','🍎','🎵','✈️','🧠','💪','⭐'];
const groupsOf = u => u.goalGroups || (u.goalGroups = []);
const groupOfGoal = (u, gid) => { const id = (u.goalGroupOf || {})[gid]; return id && groupsOf(u).find(x => x.id === id) || null; };
function setGoalGroup(u, gid, grp){ u.goalGroupOf = u.goalGroupOf || {}; if (grp) u.goalGroupOf[gid] = grp; else delete u.goalGroupOf[gid]; }
function groupSelect(g, id = 'g-group'){
  const u = me(), cur = g ? groupOfGoal(u, g.id)?.id : '';
  return `<select id="${id}" name="group" ${g ? `data-goal="${g.id}"` : ''}><option value="">Sans groupe</option>${groupsOf(u).map(x => `<option value="${x.id}" ${x.id === cur ? 'selected' : ''}>${esc(x.icon)} ${esc(x.name)}</option>`).join('')}</select>`;
}
let collapsed = new Set();
try { collapsed = new Set(JSON.parse(localStorage.getItem('pepsgoal.collapsed') || '[]')); } catch(e){}
function toggleCollapse(key){ collapsed.has(key) ? collapsed.delete(key) : collapsed.add(key); try { localStorage.setItem('pepsgoal.collapsed', JSON.stringify([...collapsed])); } catch(e){} render(); }
function groupBar(u, all){
  const gs = groupsOf(u), cnt = id => all.filter(g => (groupOfGoal(u, g.id)?.id || 'none') === id).length;
  return `<div class="filters grp-bar" role="group" aria-label="Groupes">
    <button class="fchip" data-act="grp-filter" data-id="all" aria-pressed="${UI.groupFilter === 'all'}">${icon('folder')}Tous les groupes</button>
    ${gs.map(x => `<button class="fchip" data-act="grp-filter" data-id="${x.id}" aria-pressed="${UI.groupFilter === x.id}">${esc(x.icon)} ${esc(x.name)} <span class="muted">${cnt(x.id)}</span></button>`).join('')}
    ${gs.length ? `<button class="fchip" data-act="grp-filter" data-id="none" aria-pressed="${UI.groupFilter === 'none'}">Sans groupe <span class="muted">${cnt('none')}</span></button>` : ''}
    <button class="fchip ghost" data-act="manage-groups">${icon(gs.length ? 'edit' : 'plus')}${gs.length ? 'Gérer' : 'Créer des groupes'}</button>
  </div>`;
}
function groupedGrid(u, list){
  const gs = groupsOf(u);
  if (UI.groupFilter !== 'all') return `<div class="ggrid">${list.map(goalCard).join('')}</div>`;
  if (!gs.length) return `<div class="ggrid">${list.map(goalCard).join('')}</div>`;
  const secs = [...gs.map(x => ({ key:x.id, icon:x.icon, name:x.name, items:list.filter(g => groupOfGoal(u, g.id)?.id === x.id) })), { key:'none', icon:'🗂️', name:'Sans groupe', items:list.filter(g => !groupOfGoal(u, g.id)) }].filter(s => s.items.length);
  return secs.map(s => { const c = collapsed.has(s.key); return `<section class="grp-sec">
    <button class="grp-h" data-act="grp-collapse" data-id="${s.key}" aria-expanded="${!c}"><span class="grp-ic" aria-hidden="true">${esc(s.icon)}</span><b>${esc(s.name)}</b><span class="count">${s.items.length}</span><span class="chev" aria-hidden="true">${c ? '▸' : '▾'}</span></button>
    ${c ? '' : `<div class="ggrid">${s.items.map(goalCard).join('')}</div>`}</section>`; }).join('');
}
function mGroups(){
  const gs = groupsOf(me());
  const iconSel = (name, cur, id) => `<select name="${name}" ${id ? `data-grp-icon="${id}"` : 'id="grp-new-icon"'} aria-label="Icône du groupe" class="grp-icon-sel">${GROUP_ICONS.map(e => `<option ${e === cur ? 'selected' : ''}>${e}</option>`).join('')}</select>`;
  return `${sheetHead('Groupes d’objectifs')}
  <div class="gform">
    <p class="muted">Range tes objectifs par thème. Chaque objectif appartient à un groupe au plus ; supprimer un groupe ne supprime pas ses objectifs.</p>

    <form class="c-form" data-form="grp-new">${iconSel('icon', '📁')}<label class="sr" for="grp-new-name">Nouveau groupe</label><input type="text" id="grp-new-name" name="name" placeholder="Nouveau groupe (Sport, Travail…)" maxlength="30" autocomplete="off"><button class="btn sm btn-primary" type="submit">Créer</button></form>

/* ================= modération ================= */
const isAdmin = u => u?.role === 'admin';
const admins = () => DB.users.filter(isAdmin);
const isBanned = u => !!(u?.ban && (u.ban.until == null || u.ban.until > Date.now()));
const banText = u => !isBanned(u) ? '' : u.ban.until == null ? 'définitivement' : `jusqu'au ${new Date(u.ban.until).toLocaleDateString('fr-FR', { day:'numeric', month:'long', hour:'2-digit', minute:'2-digit' })}`;
const canComment = (u, p) => !isBanned(u) && !u.noComments && !p.commentsLocked;
const postVisible = (p, v) => isAdmin(userById(v)) || p.userId === v || (p.status !== 'pending' && !isBanned(userById(p.userId)));
function socialBlocked(action){
  const u = me();
  if (maintBlocks(u)) { toast(`Maintenance en cours : impossible ${action} pour le moment.`, 'gauge'); return true; }
  if (!isBanned(u)) return false;
  toast(`Ton accès à la plateforme sociale est suspendu ${banText(u)} : impossible ${action}.`, 'ban');
  return true;
}
function modLog(action, targetId, detail = ''){
  DB.modlog = DB.modlog || [];
  DB.modlog.push({ id:uid(), at:Date.now(), admin:me().id, action, target:targetId, detail });
}
function deleteUserData(id){
  ksForget(id);
  const owned = new Set(DB.goals.filter(g => g.userId === id).map(g => g.id));
  DB.goals = DB.goals.filter(g => !owned.has(g.id));
  DB.goals.forEach(g => {
    if (g.members?.includes(id)) { g.members = g.members.filter(m => m !== id); if (g.type === 'duel' && !g.completedAt) { g.completedAt = Date.now(); g.winner = null; } }
    if (g.buddy === id) { g.buddy = null; g.buddyVerify = false; g.buddyMiss = false; }
  });
  DB.checkins = DB.checkins.filter(c => c.userId !== id && !owned.has(c.goalId));
  DB.posts = DB.posts.filter(p => p.userId !== id);
  DB.posts.forEach(p => { p.likes = p.likes.filter(l => l !== id); p.comments = p.comments.filter(c => c.userId !== id); });
  DB.friendships = DB.friendships.filter(f => f.from !== id && f.to !== id);
  DB.notifs = DB.notifs.filter(n => n.userId !== id);
  DB.messages = (DB.messages || []).filter(m => m.from !== id && m.to !== id);
  DB.stories = (DB.stories || []).filter(x => x.userId !== id); DB.stories.forEach(x => { x.seenBy = x.seenBy.filter(v => v !== id); });
  DB.appeals = (DB.appeals || []).filter(a => a.userId !== id);
  DB.reports = (DB.reports || []).filter(r => r.by !== id && DB.posts.some(p => p.id === r.postId));
  DB.users = DB.users.filter(u => u.id !== id);
  if (DB.timers) delete DB.timers[id];
}
function pendingPosts(){ return DB.posts.filter(p => p.status === 'pending').sort((a, b) => a.at - b.at); }
function openAppeals(){ return (DB.appeals || []).filter(a => a.status === 'pending' && userById(a.userId)); }
function openReports(){
  const by = {};
  (DB.reports || []).filter(r => !r.closed && DB.posts.some(p => p.id === r.postId)).forEach(r => { (by[r.postId] = by[r.postId] || []).push(r); });
  return Object.entries(by).map(([postId, rs]) => ({ post:DB.posts.find(p => p.id === postId), rs })).sort((a, b) => b.rs.length - a.rs.length);
}
const modCount = () => pendingPosts().length + openAppeals().length + openReports().length;
function statusChips(x){
  return [
    isAdmin(x) ? `<span class="chip t-project">${icon('shield')}Admin</span>` : '',
    isBanned(x) ? `<span class="chip st-ban">${icon('ban')}Banni ${x.ban.until == null ? 'définitivement' : 'temporairement'}</span>` : '',
    x.warned ? `<span class="chip st-warn">${icon('bell')}Sous avertissement</span>` : '',
    x.noComments ? `<span class="chip st-warn">${icon('comment')}Commentaires restreints</span>` : ''

/* ================= chiffrement de bout en bout des messages privés ================= */
// Chaque paire d'amis a sa propre clé AES-256-GCM, tirée au hasard sur l'appareil au premier message.
// Les clés sont rangées à part (KEYSTORE_KEY), jamais dans la base ni dans les sauvegardes complètes :
// la base ne contient que des messages chiffrés, liés à leur conversation (données associées). PepsGoal Officiel écrit en clair.
const KEYSTORE_KEY = 'pepsgoal.keys.v1';
const E2E = { store:null, cache:new Map(), keys:new Map(), busy:null };
const pairId = (a, b) => [a, b].sort().join('|');
const b64e = buf => { let s = ''; new Uint8Array(buf).forEach(c => { s += String.fromCharCode(c); }); return btoa(s); };
const b64d = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
const enc8 = t => new TextEncoder().encode(t);
function ksLoad(){
  if (E2E.store) return E2E.store;
  let st = null;
  if (!SANDBOX) { try { st = JSON.parse(localStorage.getItem(KEYSTORE_KEY) || 'null'); } catch(e){} }
  return E2E.store = st && typeof st === 'object' && st.pairs && typeof st.pairs === 'object' ? st : { v:1, pairs:{} };
}
function ksSave(){ if (SANDBOX) return; try { localStorage.setItem(KEYSTORE_KEY, JSON.stringify(ksLoad())); } catch(e){ toast('Stockage plein : la clé de conversation n’a pas pu être enregistrée.', 'lock'); } }
function ksReset(){ E2E.store = null; E2E.cache.clear(); E2E.keys.clear(); }
// Clés des conversations d'un compte (export .zip du compte, pour relire ses messages après restauration)
function ksFor(userId){ return Object.fromEntries(Object.entries(ksLoad().pairs).filter(([id]) => id.split('|').includes(userId))); }
function ksMerge(pairs){
  const st = ksLoad(); let n = 0;
  for (const [id, list] of Object.entries(pairs || {})) {
    if (!/^[\w-]{1,64}\|[\w-]{1,64}$/.test(id) || !Array.isArray(list)) continue;
    const cur = st.pairs[id] = st.pairs[id] || [];
    for (const k of list.slice(0, 20)) {
      if (!k || typeof k.keyId !== 'string' || typeof k.k !== 'string' || !/^[A-Za-z0-9+/]{43}=$/.test(k.k) || cur.some(x => x.keyId === k.keyId)) continue;
      cur.push({ keyId:k.keyId.slice(0, 64), k:k.k, at:Number(k.at) || Date.now() }); n++;
    }
    cur.sort((a, b) => a.at - b.at);
  }
  if (n) ksSave();
  return n;
}
function ksForget(userId){ const st = ksLoad(); Object.keys(st.pairs).forEach(id => { if (id.split('|').includes(userId)) delete st.pairs[id]; }); ksSave(); }
async function cryptoKey(k){
  if (!E2E.keys.has(k.keyId)) E2E.keys.set(k.keyId, await crypto.subtle.importKey('raw', b64d(k.k), 'AES-GCM', false, ['encrypt', 'decrypt']));
  return E2E.keys.get(k.keyId);
}
function currentKey(a, b, create){
  const st = ksLoad(), id = pairId(a, b), list = st.pairs[id] || [];
  if (!list.length && create) { list.push({ keyId:uid(), k:b64e(crypto.getRandomValues(new Uint8Array(32))), at:Date.now() }); st.pairs[id] = list; ksSave(); }
  return list[list.length - 1] || null;
}
async function e2eEncrypt(from, to, text){
  const k = currentKey(from, to, true), iv = crypto.getRandomValues(new Uint8Array(12));
  const ct = await crypto.subtle.encrypt({ name:'AES-GCM', iv, additionalData:enc8(pairId(from, to)) }, await cryptoKey(k), enc8(text));
  return { v:1, keyId:k.keyId, iv:b64e(iv), ct:b64e(ct) };
}
async function e2eDecrypt(m){
  const k = (ksLoad().pairs[pairId(m.from, m.to)] || []).find(x => x.keyId === m.e2e.keyId); if (!k) return null;
  try { return new TextDecoder().decode(await crypto.subtle.decrypt({ name:'AES-GCM', iv:b64d(m.e2e.iv), additionalData:enc8(pairId(m.from, m.to)) }, await cryptoKey(k), b64d(m.e2e.ct))); }
  catch(e){ return null; }
}
const msgText = m => !m.e2e ? (m.text || '') : !E2E.cache.has(m.id) ? '🔒 …' : (E2E.cache.get(m.id) ?? '🔒 Message chiffré : sa clé n’est pas sur cet appareil.');
const keyPrint = async (a, b) => { const k = currentKey(a, b, false); if (!k) return null; const h = new Uint8Array(await crypto.subtle.digest('SHA-256', b64d(k.k))); return Array.from({ length:5 }, (_, i) => String(((h[i * 3] << 16) | (h[i * 3 + 1] << 8) | h[i * 3 + 2]) % 100000).padStart(5, '0')).join(' '); };
// Déchiffre les messages pas encore en cache, puis rafraîchit l'affichage
async function decryptPending(){
  if (!E2E.busy) E2E.busy = (async () => {
    let n = 0;
    for (const m of [...(DB.messages || [])]) if (m.e2e && !E2E.cache.has(m.id)) { E2E.cache.set(m.id, await e2eDecrypt(m)); n++; }
    return n;
  })().finally(() => { E2E.busy = null; });
  const n = await E2E.busy;
  if (n && me()) { updateChat(); if (UI.view === 'friends' || UI.view === 'settings') softRender(); }
}
// Messages en clair des versions précédentes (et données d'exemple) : chiffrés une fois pour toutes
async function encryptLegacy(){
  if (!window.crypto?.subtle) return;
  const db = DB; let n = 0;
  for (const m of [...(db.messages || [])]) {
    if (m.official || m.e2e || !m.text) continue;
    const text = m.text; m.e2e = await e2eEncrypt(m.from, m.to, text); delete m.text; E2E.cache.set(m.id, text); n++;
  }
  if (n && db === DB) save();
  await decryptPending();
}

const DEMO_REPLIES = ['Trop bien ! Continue comme ça 🔥', 'Haha, je te suis de près 😄', 'On se motive ensemble cette semaine ?', 'Bien joué, tu m’inspires.', 'Je viens de valider ma routine, à ton tour !', 'Merci, ça me fait plaisir 🙌', 'Demain je m’y remets, promis.', 'Tu lâches rien, j’adore.'];
const convo = (a, b) => (DB.messages || []).filter(m => (m.from === a && m.to === b) || (m.from === b && m.to === a)).sort((x, y) => x.at - y.at);
const unreadFrom = (meId, other) => (DB.messages || []).filter(m => m.to === meId && m.from === other && !m.read).length;
const unreadMsgs = meId => (DB.messages || []).filter(m => m.to === meId && !m.read && userById(m.from)).length;

  const u = me(), x = userById(UI.modal.with); if (!x) { UI.modal = null; return ''; }

  const blocked = isBanned(u), friends = areFriends(u.id, x.id);

  ${isOfficial(x) ? '' : `<p class="e2e-note">${icon('lock')}<span>Chiffrée de bout en bout : une clé propre à votre paire, stockée uniquement sur cet appareil. <span id="e2e-print"></span></span></p>`}

    : blocked ? `<p class="muted small">Ta messagerie est suspendue ${esc(banText(u))}.</p>` : !friends ? `<p class="muted small">Vous n'êtes plus amis : la conversation est en lecture seule.</p>`
    : `<form class="c-form" data-form="chat" data-id="${x.id}"><label class="sr" for="chat-input">Message</label><input type="text" id="chat-input" name="text" placeholder="Écrire un message…" maxlength="500" autocomplete="off" autofocus><button class="btn btn-primary sm" type="submit" aria-label="Envoyer">${icon('send')}</button></form>`}`;
}
async function sendMessage(to, text){
  const u = me(), id = uid();
  if (!window.crypto?.subtle) { toast('Ce navigateur ne permet pas le chiffrement : message non envoyé.', 'lock'); return; }
  const e2e = await e2eEncrypt(u.id, to, text);
  DB.messages = DB.messages || [];
  E2E.cache.set(id, text);
  DB.messages.push({ id, from:u.id, to, e2e, at:Date.now(), read:false });
  save(); updateChat(); updateBadges();
  const x = userById(to);
  if (x?.demo) {
    setTimeout(() => { UI.typing = to; updateChat(); }, 700);
    setTimeout(async () => {
      UI.typing = null;
      const rid = uid(), reply = DEMO_REPLIES[Math.floor(Math.random() * DEMO_REPLIES.length)];
      E2E.cache.set(rid, reply);
      DB.messages.push({ id:rid, from:to, to:u.id, e2e:await e2eEncrypt(to, u.id, reply), at:Date.now(), read:false });
      save();
      if (UI.modal?.type === 'chat' && UI.modal.with === to) updateChat();
      else { toast(`Nouveau message de ${first(x.name)}`, 'comment'); updateBadges(); if (UI.view === 'friends') softRender(); }
    }, 2200 + Math.random() * 1800);
  }
}

  const rows = others.map(id => { const c = convo(u.id, id); return { x:userById(id), last:c[c.length - 1], n:unreadFrom(u.id, id) }; }).sort((a, b) => (isOfficial(b.x) - isOfficial(a.x)) || b.last.at - a.last.at);

  },
  report(f){

    if (DB.reports.some(r => r.postId === id && r.by === me().id && !r.closed)) { UI.modal = null; renderModal(); toast('Tu as déjà signalé cette publication.', 'flag'); return; }
    DB.reports.push({ id:uid(), postId:id, by:me().id, reason, at:Date.now() });

  chat(f){

    f.reset(); sendMessage(f.dataset.id, text);

  },
  async password(f){
    const fd = new FormData(f), u = me(), err = f.querySelector('#pw-err');
    const fail = m => { err.textContent = m; err.hidden = false; };
    const cur = fd.get('cur') || '', next = fd.get('next') || '', next2 = fd.get('next2') || '';
    if (await hashPw(cur, u.salt) !== u.passHash) return fail('Le mot de passe actuel est incorrect.');
    if (next.length < 8) return fail('Le nouveau mot de passe doit contenir au moins 8 caractères.');
    if (next === 'password' || next === cur) return fail('Choisis un mot de passe différent de l’actuel et de celui par défaut.');
    if (next !== next2) return fail('Les deux nouveaux mots de passe ne correspondent pas.');
    u.salt = uid() + uid(); u.passHash = await hashPw(next, u.salt); u.defaultPw = false;
    save(); render(); toast('Mot de passe modifié.', 'lock');
  }
});

// Envoie un message au nom du compte officiel (jamais aux comptes admin ou officiel)
function officialSend(to, text, o = {}){
  const off = officialUser(), x = userById(to); if (!off || !x || x.role || x.guest) return false;
  DB.messages.push({ id:uid(), from:off.id, to, text, at:Date.now(), read:false, official:true, tag:o.tag || 'info', bid:o.bid || uid(), auto:!!o.auto, by:o.auto ? null : me()?.id });
  if (o.notif !== false) notify(to, `PepsGoal Officiel : ${text.length > 90 ? text.slice(0, 90) + '…' : text}`, { type:'official' });
  if (me()?.id === to && UI.modal?.type === 'chat' && UI.modal.with === off.id) updateChat();
  updateBadges();
  return true;
}
// Décision de modération : notification + message officiel automatique
function modNotify(to, text){ notify(to, text, { type:'mod' }); officialSend(to, text, { tag:'mod', auto:true, notif:false }); }
function broadcast(text, tag){
  const bid = uid();
  if (tag === 'news') { DB.news = DB.news || []; DB.news.push({ id:bid, text, at:Date.now() }); }
  return DB.users.filter(u => !u.role).filter(u => officialSend(u.id, text, { tag, bid })).length;
}

  officialSend(u.id, NEWS_SEED[0][2], { tag:'info', notif:false, auto:true });

}

const STORY_TTL = DAY, STORY_MS = 6000;
const liveStories = () => (DB.stories || []).filter(s => Date.now() - s.at < STORY_TTL && userById(s.userId));
const canSeeStory = (s, v) => s.userId === v || areFriends(s.userId, v);
function purgeStories(){ const n = (DB.stories || []).length; DB.stories = liveStories(); return n !== DB.stories.length; }
function storyUsers(v){
  const live = liveStories().filter(s => canSeeStory(s, v) && (s.userId === v || !isBanned(userById(s.userId))));
  return [...new Set(live.map(s => s.userId))].map(id => {
    const list = live.filter(s => s.userId === id).sort((a, b) => a.at - b.at);
    return { u:userById(id), list, unseen:id !== v && list.some(s => !s.seenBy.includes(v)), last:list[list.length - 1].at };
  }).sort((a, b) => (b.u.id === v) - (a.u.id === v) || b.unseen - a.unseen || b.last - a.last);
}
function storiesBar(u){

function resizeStoryPhoto(file){
  return new Promise((res, rej) => {
    const url = URL.createObjectURL(file), img = new Image();
    img.onload = () => {
      const k = Math.min(1, 900 / Math.max(img.naturalWidth, img.naturalHeight)), c = document.createElement('canvas');
      c.width = Math.round(img.naturalWidth * k); c.height = Math.round(img.naturalHeight * k);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url); res(c.toDataURL('image/jpeg', .8));
    };
    img.onerror = () => { URL.revokeObjectURL(url); rej(); };
    img.src = url;
  });
}

function svStep(d){
